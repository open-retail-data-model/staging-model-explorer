    description: Equipment downtime in hours caused by this maintenance event.
  - name: actual_cost
    logicalType: number
    physicalType: DECIMAL(12, 2)
  - name: currency_code
    logicalType: string
    physicalType: STRING
  - name: spoilage_risk_flag
    logicalType: boolean
    physicalType: BOOLEAN
    description: TRUE if this is a refrigeration outage with critical/high criticality.
  - name: perishable_units_at_risk
    description: Perishable inventory units at risk in the affected store on the event date (refrigeration
      only).
  - name: perishable_products_at_risk
    description: Number of perishable products at risk in the affected store (refrigeration only).
  - name: spoilage_risk_tier
