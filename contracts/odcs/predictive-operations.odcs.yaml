    description: 'Spoilage risk level for refrigeration: high (>4h), medium (2-4h), low (<2h), none.'
- name: gold_equipment_health
  physicalName: in_store_equipment_maintenance.gold_equipment_health
  physicalType: view
  description: 'Per-equipment health dashboard: latest reading summary, anomaly counts, current status,
    and a health score (0-100). The primary monitoring surface for store operations teams.'
  tags:
  - gold
  authoritativeDefinitions:
  - url: outcome-packages/predictive-operations/README.md
    type: businessDefinition
  - url: outcome-packages/predictive-operations/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: equipment_sk
    logicalType: integer
    physicalType: BIGINT
    description: Equipment surrogate key.
  - name: equipment_id
    logicalType: string
    physicalType: STRING
    description: Durable equipment business key.
  - name: equipment_name
    logicalType: string
    physicalType: STRING
    description: Display name of the equipment.
  - name: equipment_type
    logicalType: string
    physicalType: STRING
    description: 'Category: refrigeration, hvac, pos_terminal, self_checkout, oven, etc.'
  - name: manufacturer
    logicalType: string
    physicalType: STRING
  - name: model_number
    logicalType: string
    physicalType: STRING
  - name: store_id
    logicalType: string
    physicalType: STRING
  - name: store_name
    logicalType: string
    physicalType: STRING
  - name: installation_zone
    logicalType: string
    physicalType: STRING
  - name: equipment_status
    logicalType: string
    physicalType: STRING
  - name: criticality
    logicalType: string
    physicalType: STRING
  - name: install_date
    logicalType: date
    physicalType: DATE
  - name: warranty_expiry_date
    logicalType: date
    physicalType: DATE
  - name: latest_temperature
    logicalType: number
    physicalType: DOUBLE
  - name: latest_power_kw
    logicalType: number
    physicalType: DOUBLE
  - name: latest_vibration
    logicalType: number
    physicalType: DOUBLE
  - name: latest_runtime_hours
    logicalType: number
    physicalType: DOUBLE
  - name: last_reading_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
  - name: total_readings_7d
    logicalType: integer
    physicalType: BIGINT
  - name: anomaly_count_7d
    logicalType: integer
    physicalType: BIGINT
    description: Number of anomalous sensor readings in the last 7 days.
  - name: error_count_7d
    logicalType: integer
    physicalType: BIGINT
  - name: anomaly_rate_7d
    logicalType: number
    physicalType: DOUBLE
    description: Fraction of readings flagged as anomalous in the last 7 days.
  - name: wo_count_90d
    logicalType: integer
    physicalType: BIGINT
  - name: corrective_wo_count_90d
    logicalType: integer
    physicalType: BIGINT
    description: Number of corrective work orders in the last 90 days.
  - name: total_downtime_hours_90d
    logicalType: number
    physicalType: DECIMAL(8, 2)
    description: Total equipment downtime hours in the last 90 days.
  - name: health_score
    logicalType: integer
    physicalType: INT
    description: 0-100 health score. 100 = fully healthy, 0 = out of service.
  - name: health_tier
    logicalType: string
    physicalType: STRING
    description: 'Health tier: healthy, at_risk, degraded, or failed.'
  quality:
  - name: health_score_range
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: health_score_range
    query: 'SELECT * FROM in_store_equipment_maintenance.gold_equipment_health

      WHERE health_score NOT BETWEEN 0 AND 100'
  - name: health_tier_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: health_tier_domain
    query: 'SELECT * FROM in_store_equipment_maintenance.gold_equipment_health

      WHERE health_tier NOT IN (''healthy'', ''at_risk'', ''degraded'', ''failed'')'
  - name: health_rowcount
    type: sql
    dimension: accuracy
    severity: info
    description: health_rowcount
    query: SELECT COUNT(*) AS health_rows FROM in_store_equipment_maintenance.gold_equipment_health
  - name: health_at_risk_count
    type: sql
    dimension: accuracy
    severity: info
    description: health_at_risk_count
    query: 'SELECT COUNT(*) AS at_risk_or_worse

      FROM in_store_equipment_maintenance.gold_equipment_health

      WHERE health_tier IN (''at_risk'', ''degraded'', ''failed'')'
- name: gold_maintenance_effectiveness
  physicalName: in_store_equipment_maintenance.gold_maintenance_effectiveness
  physicalType: view
  description: 'Maintenance program effectiveness per equipment: preventive vs corrective ratio, schedule
    compliance, cost analysis, and MTBF (mean time between failures). Helps operations teams assess whether
    their preventive maintenance program is effective. Current-version equipment attributes are used (not
    as-of the work order date); this is intentional for a current-state effectiveness dashboard.'
  tags:
  - gold
  authoritativeDefinitions:
  - url: outcome-packages/predictive-operations/README.md
    type: businessDefinition
  - url: outcome-packages/predictive-operations/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: equipment_sk
    logicalType: integer
    physicalType: BIGINT
    description: Equipment surrogate key.
  - name: equipment_id
    logicalType: string
    physicalType: STRING
    description: Durable equipment business key.
  - name: equipment_name
    logicalType: string
    physicalType: STRING
  - name: equipment_type
    logicalType: string
    physicalType: STRING
  - name: store_id
    logicalType: string
    physicalType: STRING
  - name: criticality
    logicalType: string
    physicalType: STRING
  - name: total_completed_wo
    logicalType: integer
    physicalType: BIGINT
  - name: preventive_count
    logicalType: integer
    physicalType: BIGINT
  - name: corrective_count
    logicalType: integer
    physicalType: BIGINT
  - name: emergency_count
    logicalType: integer
    physicalType: BIGINT
  - name: preventive_to_corrective_ratio
    logicalType: number
    physicalType: DOUBLE
    description: Ratio of preventive to corrective work orders. Higher = more proactive.
  - name: total_maintenance_cost
    logicalType: number
    physicalType: DECIMAL(12, 2)
    description: Total maintenance spend in base currency.
  - name: preventive_cost
    logicalType: number
    physicalType: DECIMAL(12, 2)
  - name: corrective_cost
    logicalType: number
    physicalType: DECIMAL(12, 2)
  - name: total_labor_hours
    logicalType: number
    physicalType: DECIMAL(6, 1)
  - name: total_downtime_hours
    logicalType: number
    physicalType: DECIMAL(8, 2)
  - name: avg_completion_days
    logicalType: number
    physicalType: DOUBLE
  - name: mtbf_days
    logicalType: number
    physicalType: DOUBLE
    description: Mean Time Between Failures in calendar days.
  - name: active_schedules
    logicalType: integer
    physicalType: BIGINT
  - name: overdue_schedules
    logicalType: integer
    physicalType: BIGINT
    description: Number of active maintenance schedules that are past due.
  - name: schedule_compliance_rate
    logicalType: number
    physicalType: DOUBLE
    description: Fraction of active schedules that are on-schedule (0-1).
  - name: currency_code
    logicalType: string
    physicalType: STRING
    description: ISO currency code for cost amounts.
  quality:
  - name: effectiveness_rowcount
    type: sql
    dimension: accuracy
    severity: info
    description: effectiveness_rowcount
    query: SELECT COUNT(*) AS effectiveness_rows FROM in_store_equipment_maintenance.gold_maintenance_effectiveness
  - name: effectiveness_avg_mtbf
    type: sql
    dimension: accuracy
    severity: info
    description: effectiveness_avg_mtbf
    query: 'SELECT ROUND(AVG(mtbf_days), 1) AS avg_mtbf_days

      FROM in_store_equipment_maintenance.gold_maintenance_effectiveness

      WHERE mtbf_days IS NOT NULL'
