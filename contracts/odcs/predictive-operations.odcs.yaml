    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: wo_completed_has_date
    query: 'SELECT * FROM predictive_operations.work_order

      WHERE work_order_status = ''completed'' AND completed_date IS NULL'
  - name: wo_completed_after_created
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: wo_completed_after_created
    query: 'SELECT * FROM predictive_operations.work_order

      WHERE completed_date IS NOT NULL AND completed_date < created_date'
  - name: wo_cost_nonnegative
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: wo_cost_nonnegative
    query: 'SELECT * FROM predictive_operations.work_order

      WHERE actual_cost IS NOT NULL AND actual_cost < 0'
  - name: wo_downtime_nonnegative
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: wo_downtime_nonnegative
    query: 'SELECT * FROM predictive_operations.work_order

      WHERE downtime_hours IS NOT NULL AND downtime_hours < 0'
  - name: wo_single_currency
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: wo_single_currency
    query: 'SELECT ''work_order'' AS table_name, COUNT(DISTINCT currency_code) AS currencies

      FROM predictive_operations.work_order

      HAVING COUNT(DISTINCT currency_code) > 1 OR COUNT(CASE WHEN currency_code IS NULL THEN 1 END) >
      0'
  - name: wo_store_equipment_mismatch
    type: sql
    dimension: accuracy
    severity: warning
    mustBe: 0
    unit: rows
    description: wo_store_equipment_mismatch
    query: "SELECT wo.work_order_id, wo.store_sk AS wo_store_sk, eq.store_sk AS eq_store_sk\nFROM predictive_operations.work_order\
      \ wo\nJOIN equipment.equipment eq\n  ON eq.equipment_sk = wo.equipment_sk\nWHERE wo.store_sk !=\
      \ eq.store_sk"
  - name: wo_rowcount
    type: sql
    dimension: accuracy
    severity: info
    description: wo_rowcount
    query: SELECT COUNT(*) AS work_order_rows FROM predictive_operations.work_order
  - name: wo_status_distribution
    type: sql
    dimension: accuracy
    severity: info
    description: wo_status_distribution
    query: 'SELECT work_order_status, COUNT(*) AS status_count

      FROM predictive_operations.work_order

      GROUP BY work_order_status'
  - name: wo_type_distribution
    type: sql
    dimension: accuracy
    severity: info
    description: wo_type_distribution
    query: 'SELECT work_order_type, COUNT(*) AS type_count

      FROM predictive_operations.work_order

      GROUP BY work_order_type'
  - name: wo_open_count
    type: sql
    dimension: accuracy
    severity: info
    description: wo_open_count
    query: 'SELECT COUNT(*) AS open_work_orders

      FROM predictive_operations.work_order

      WHERE work_order_status IN (''open'', ''in_progress'')'
- name: work_order_line
  physicalName: predictive_operations.work_order_line
  physicalType: table
  description: 'Work order line items: parts, labor, and service charges for equipment maintenance.'
  tags:
  - transactional
  authoritativeDefinitions:
  - url: outcome-packages/predictive-operations/README.md
    type: businessDefinition
  - url: outcome-packages/predictive-operations/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: work_order_line_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Surrogate key.
  - name: work_order_line_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable natural/business key for the line.
  - name: work_order_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to work_order.work_order_sk.
    relationships:
    - to: work_order.work_order_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: predictive_operations
      - property: enforced
        value: false
  - name: work_order_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable work order business key.
  - name: line_type
    logicalType: string
    physicalType: STRING
    required: true
    description: 'Type of line item. Allowed values: part, labor, service, other.'
  - name: part_number
    logicalType: string
    physicalType: STRING
    required: false
    description: Part number (populated when line_type = part).
  - name: part_description
    logicalType: string
    physicalType: STRING
    required: false
    description: Description of the part or service.
  - name: quantity
    logicalType: number
    physicalType: DECIMAL(10,2)
    required: false
    description: Quantity used (units for parts, hours for labor).
    quality:
    - type: text
      dimension: validity
      severity: error
      description: CHECK (quantity IS NULL OR quantity >= 0).
  - name: unit_cost
    logicalType: number
    physicalType: DECIMAL(12,2)
    required: false
    description: Cost per unit in base currency.
    quality:
    - type: text
      dimension: validity
      severity: error
      description: CHECK (unit_cost IS NULL OR unit_cost >= 0).
  - name: line_total
    logicalType: number
    physicalType: DECIMAL(12,2)
    required: false
    description: Total cost for this line (quantity x unit_cost) in base currency.
  - name: currency_code
    logicalType: string
    physicalType: STRING
    required: true
    description: Reporting/base currency for cost columns, ISO 4217 alpha-3.
  - name: record_source
    logicalType: string
    physicalType: STRING
    required: false
    description: Originating system (CMMS, EAM, or manual entry).
  - name: load_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When this row was loaded (UTC, ISO 8601).
  quality:
  - name: wol_pk_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: wol_pk_unique
    query: 'SELECT work_order_line_sk

      FROM predictive_operations.work_order_line

      GROUP BY work_order_line_sk

      HAVING COUNT(*) > 1'
  - name: wol_wo_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: wol_wo_fk_orphan
    query: 'SELECT wol.* FROM predictive_operations.work_order_line wol

      LEFT JOIN predictive_operations.work_order wo ON wol.work_order_sk = wo.work_order_sk

      WHERE wo.work_order_sk IS NULL AND wol.work_order_sk IS NOT NULL'
  - name: wol_rowcount
    type: sql
    dimension: accuracy
    severity: info
    description: wol_rowcount
    query: SELECT COUNT(*) AS work_order_line_rows FROM predictive_operations.work_order_line
  - name: wol_type_distribution
    type: sql
    dimension: accuracy
    severity: info
    description: wol_type_distribution
    query: 'SELECT line_type, COUNT(*) AS line_count

      FROM predictive_operations.work_order_line

      GROUP BY line_type'
  - name: wol_single_currency
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: wol_single_currency
    query: 'SELECT ''work_order_line'' AS table_name, COUNT(DISTINCT currency_code) AS currencies

      FROM predictive_operations.work_order_line

      HAVING COUNT(DISTINCT currency_code) > 1 OR COUNT(CASE WHEN currency_code IS NULL THEN 1 END) >
      0'
  - name: wol_wo_currency_match
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: wol_wo_currency_match
    query: 'SELECT wol.work_order_line_id, wol.currency_code AS line_currency, wo.currency_code AS wo_currency

      FROM predictive_operations.work_order_line wol

      JOIN predictive_operations.work_order wo ON wol.work_order_sk = wo.work_order_sk

      WHERE wol.currency_code != wo.currency_code'
