    outcome packages.
  tags:
  - master
  authoritativeDefinitions:
  - url: canonical-core/customer/README.md
    type: businessDefinition
  - url: canonical-core/customer/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: profile_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Surrogate key. Unique per SCD2 version. Used as the join/FK target for downstream dimensional
      models.
  - name: profile_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable natural/business key for the individual customer. Stable across SCD2 versions;
      pseudonymous identifier, not a name.
  - name: name_prefix
    logicalType: string
    physicalType: STRING
    required: false
    description: Honorific prefix. Common values include mr, mrs, ms, mx, dr.
  - name: first_name
    logicalType: string
    physicalType: STRING
    required: false
    description: Given name.
    classification: restricted
    tags:
    - dbx_pii_name
  - name: middle_name
    logicalType: string
    physicalType: STRING
    required: false
    description: Middle name(s) or initial.
    classification: restricted
    tags:
    - dbx_pii_name
  - name: last_name
    logicalType: string
    physicalType: STRING
    required: false
    description: Family / surname.
    classification: restricted
    tags:
    - dbx_pii_name
  - name: name_suffix
    logicalType: string
    physicalType: STRING
    required: false
    description: Generational/qualification suffix. Common values include jr, sr, ii, iii.
  - name: date_of_birth
    logicalType: date
    physicalType: DATE
    required: false
    description: Date of birth (ISO 8601 date).
    classification: restricted
    tags:
    - dbx_pii_dob
  - name: gender
    logicalType: string
    physicalType: STRING
    required: false
    description: Self-described gender. Free text; common values include female, male, non_binary, prefer_not_to_say.
  - name: preferred_language_code
    logicalType: string
    physicalType: STRING
    required: false
    description: Preferred communication language, ISO 639-1 alpha-2 (e.g. en, fr, es).
  - name: nationality_country_code
    logicalType: string
    physicalType: STRING
    required: false
    description: Nationality, ISO 3166-1 alpha-2 country code.
  - name: loyalty_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Loyalty/membership program identifier for the individual. Treated as PII.
    classification: restricted
    tags:
    - dbx_pii
  - name: household_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Household grouping identifier linking related individuals. Treated as PII.
    classification: restricted
    tags:
    - dbx_pii
  - name: customer_status
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Lifecycle status. Allowed values: prospect, active, inactive, closed.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: prospect, active, inactive, closed.'
  - name: enrollment_date
    logicalType: date
    physicalType: DATE
    required: false
    description: Date the individual first became a known customer (ISO 8601 date).
  - name: effective_from_date
    logicalType: date
    physicalType: DATE
    required: true
    description: 'SCD2: inclusive start date this version became effective.'
  - name: effective_to_date
    logicalType: date
    physicalType: DATE
    required: false
    description: 'SCD2: exclusive end date this version stopped being effective; NULL for the current
      version.'
  - name: is_current
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: 'SCD2: TRUE for the currently active version of this profile.'
  - name: created_timestamp
    logicalType: date
    physicalType: TIMESTAMP
    required: false
    description: When the record was created in the source system (UTC, ISO 8601).
  - name: source_updated_timestamp
    logicalType: date
    physicalType: TIMESTAMP
    required: false
    description: When the record was last modified in the source system (UTC, ISO 8601).
  - name: record_source
    logicalType: string
    physicalType: STRING
    required: false
    description: Originating system of record (vendor-neutral label).
  - name: load_timestamp
    logicalType: date
    physicalType: TIMESTAMP
    required: false
    description: When this row was loaded into the canonical core (UTC, ISO 8601).
  quality:
  - name: profile_keys_not_null
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: Surrogate key, business key, SCD2 start date and current flag are mandatory.
    query: "SELECT * FROM customer.profile\nWHERE profile_sk IS NULL OR profile_id IS NULL\n   OR effective_from_date\
      \ IS NULL OR is_current IS NULL"
  - name: profile_business_key_unique_current
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: A business key must resolve to at most one current version.
    query: 'SELECT profile_id, COUNT(*) AS current_versions

      FROM customer.profile

      WHERE is_current = true

      GROUP BY profile_id

      HAVING COUNT(*) > 1'
  - name: profile_customer_status_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: customer_status must be within the declared enum.
    query: "SELECT * FROM customer.profile\nWHERE customer_status IS NOT NULL\n  AND customer_status NOT\
      \ IN ('prospect', 'active', 'inactive', 'closed')"
  - name: profile_scd2_current_open
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: The current version must have an open (NULL) end date; non-current must be closed.
    query: "SELECT * FROM customer.profile\nWHERE (is_current = true  AND effective_to_date IS NOT NULL)\n\
      \   OR (is_current = false AND effective_to_date IS NULL)"
  - name: profile_scd2_date_order
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: When set, the end date must be strictly after the start date.
    query: "SELECT * FROM customer.profile\nWHERE effective_to_date IS NOT NULL\n  AND effective_to_date\
      \ <= effective_from_date"
