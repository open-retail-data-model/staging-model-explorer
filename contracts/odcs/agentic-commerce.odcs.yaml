      (ADR 0030), so a mandate may reference a consent decision not yet loaded in-model. Deduped on the
      durable consent_id.'
    query: "SELECT m.* FROM agentic_commerce.a2a_mandate m\nLEFT JOIN (SELECT DISTINCT consent_id FROM\
      \ customer.consent) c\n  ON m.consent_id = c.consent_id\nWHERE m.consent_id IS NOT NULL AND c.consent_id\
      \ IS NULL"
  - name: a2a_mandate_single_currency
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: 'Monetary master: all mandates with amounts must carry the single reporting currency.'
    query: "SELECT * FROM agentic_commerce.a2a_mandate\nWHERE currency_code IS NOT NULL\n  AND currency_code\
      \ <> (\n    SELECT MIN(currency_code) FROM agentic_commerce.a2a_mandate\n    WHERE currency_code\
      \ IS NOT NULL\n  )"
