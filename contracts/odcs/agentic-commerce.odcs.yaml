    physicalType: DOUBLE
- name: gold_a2a_session_summary
  physicalName: agentic_commerce.gold_a2a_session_summary
  physicalType: view
  description: 'One row per A2A session with its negotiation outcome rolled up from the append-only event
    log: how many steps, the first offer, the final agreed price/quantity (from the acceptance event),
    whether a human was escalated to, and the buyer/seller/agent context. This is the serving surface
    for "what happened in this negotiation and how did it land".'
  tags:
  - gold
  authoritativeDefinitions:
  - url: outcome-packages/agentic-commerce/README.md
    type: businessDefinition
  - url: outcome-packages/agentic-commerce/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: a2a_session_sk
    logicalType: integer
    physicalType: BIGINT
  - name: a2a_session_id
    logicalType: string
    physicalType: STRING
  - name: session_status
    logicalType: string
    physicalType: STRING
  - name: communication_channel
    logicalType: string
    physicalType: STRING
  - name: initiator_type
    logicalType: string
    physicalType: STRING
  - name: buyer_profile_id
    logicalType: string
    physicalType: STRING
  - name: store_id
    logicalType: string
    physicalType: STRING
  - name: product_id
    logicalType: string
    physicalType: STRING
  - name: initiating_agent_id
    logicalType: string
    physicalType: STRING
  - name: responding_agent_id
    logicalType: string
    physicalType: STRING
  - name: initiated_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
  - name: completed_timestamp
