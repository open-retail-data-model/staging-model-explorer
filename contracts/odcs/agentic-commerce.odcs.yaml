    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: Spend ceiling, per-transaction limit, and approval threshold, when set, must be non-negative.
    query: "SELECT * FROM agentic_commerce.a2a_mandate\nWHERE (spend_ceiling_amount IS NOT NULL AND spend_ceiling_amount\
      \ < 0)\n   OR (per_transaction_limit_amount IS NOT NULL AND per_transaction_limit_amount < 0)\n\
      \   OR (approval_threshold_amount IS NOT NULL AND approval_threshold_amount < 0)"
  - name: a2a_mandate_limit_within_ceiling
    type: sql
    dimension: accuracy
    severity: warning
    mustBe: 0
    unit: rows
    description: 'Cross-field ordering guardrail: a single transaction cannot exceed the cumulative spend
      ceiling, so per_transaction_limit_amount must not be greater than spend_ceiling_amount when both
      are set. warn, not error: mandates are customer-authored guardrails and a source system may not
      enforce the ordering, so this flags an incoherent mandate without blocking the load.'
    query: "SELECT * FROM agentic_commerce.a2a_mandate\nWHERE spend_ceiling_amount IS NOT NULL\n  AND\
      \ per_transaction_limit_amount IS NOT NULL\n  AND per_transaction_limit_amount > spend_ceiling_amount"
