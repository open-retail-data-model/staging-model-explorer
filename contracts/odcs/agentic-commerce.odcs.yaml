    description: event_type must be within the declared enum.
    query: 'SELECT * FROM agentic_commerce.a2a_negotiation_event

      WHERE event_type NOT IN (''price_request'', ''offer'', ''counter_offer'', ''acceptance'', ''rejection'',
      ''availability_check'', ''escalation_to_human'')'
  - name: a2a_negotiation_event_session_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: Every event must reference an existing session (by surrogate FK).
    query: 'SELECT e.* FROM agentic_commerce.a2a_negotiation_event e

      LEFT JOIN agentic_commerce.a2a_session s ON e.a2a_session_sk = s.a2a_session_sk

      WHERE e.a2a_session_sk IS NOT NULL AND s.a2a_session_sk IS NULL'
  - name: a2a_negotiation_event_agent_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: Every event with an emitting agent must reference an existing agent.
    query: 'SELECT e.* FROM agentic_commerce.a2a_negotiation_event e

      LEFT JOIN agentic_commerce.a2a_agent a ON e.a2a_agent_sk = a.a2a_agent_sk

      WHERE e.a2a_agent_sk IS NOT NULL AND a.a2a_agent_sk IS NULL'
  - name: a2a_negotiation_event_product_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: Every event with a product must reference an existing product.
    query: 'SELECT e.* FROM agentic_commerce.a2a_negotiation_event e

      LEFT JOIN product.product p ON e.product_sk = p.product_sk

      WHERE e.product_sk IS NOT NULL AND p.product_sk IS NULL'
  - name: a2a_negotiation_event_single_currency
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: 'Monetary fact: all priced events must carry the single reporting currency. Replace ''USD''
      via ${base_currency} at deploy; the check asserts consistency, not a specific code, by flagging
      any second distinct currency among priced rows.'
    query: "SELECT * FROM agentic_commerce.a2a_negotiation_event\nWHERE proposed_price IS NOT NULL\n \
      \ AND currency_code IS NOT NULL\n  AND currency_code <> (\n    SELECT MIN(currency_code) FROM agentic_commerce.a2a_negotiation_event\n\
      \    WHERE proposed_price IS NOT NULL AND currency_code IS NOT NULL\n  )"
  - name: a2a_negotiation_event_price_currency_paired
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: A proposed_price requires a currency_code (and vice versa) — no orphan money.
    query: "SELECT * FROM agentic_commerce.a2a_negotiation_event\nWHERE (proposed_price IS NOT NULL AND\
      \ currency_code IS NULL)\n   OR (proposed_price IS NULL AND currency_code IS NOT NULL)"
  - name: a2a_negotiation_event_nonneg
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: Proposed price and quantity, when set, must be non-negative.
    query: "SELECT * FROM agentic_commerce.a2a_negotiation_event\nWHERE (proposed_price IS NOT NULL AND\
      \ proposed_price < 0)\n   OR (proposed_quantity IS NOT NULL AND proposed_quantity < 0)"
  - name: a2a_negotiation_event_sequence_unique
    type: sql
    dimension: accuracy
    severity: warning
    mustBe: 0
    unit: rows
    description: event_sequence is documented as the monotonic step number within a session; two events
      sharing a sequence within one session break replay/ordering.
    query: 'SELECT a2a_session_sk, event_sequence, COUNT(*) AS rows_at_sequence

      FROM agentic_commerce.a2a_negotiation_event

      WHERE event_sequence IS NOT NULL

      GROUP BY a2a_session_sk, event_sequence

      HAVING COUNT(*) > 1'
  - name: a2a_negotiation_event_single_acceptance
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: A session concludes with at most one acceptance. More than one would fan out gold_a2a_session_summary's
      agreed-terms join and double-count the session.
    query: 'SELECT a2a_session_sk, COUNT(*) AS acceptance_count

      FROM agentic_commerce.a2a_negotiation_event

      WHERE event_type = ''acceptance''

      GROUP BY a2a_session_sk

      HAVING COUNT(*) > 1'
- name: a2a_session
  physicalName: agentic_commerce.a2a_session
  physicalType: table
  description: Agent-to-agent commerce session tracking for the Agentic Commerce outcome package. One
    row per A2A negotiation lifecycle between a buying agent (customer) and a selling agent (retailer).
  tags:
  - transactional
  authoritativeDefinitions:
  - url: outcome-packages/agentic-commerce/README.md
    type: businessDefinition
  - url: outcome-packages/agentic-commerce/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: a2a_session_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Surrogate key. Unique per session.
  - name: a2a_session_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable natural/business key for the session (e.g. a UUID issued by the orchestrator).
  - name: buyer_profile_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to customer.profile.profile_sk — the individual the buying agent represents.
    relationships:
    - to: profile.profile_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: customer
      - property: enforced
        value: false
  - name: buyer_profile_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable business key of the buyer profile. Stable across SCD2 versions.
  - name: store_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to store.store.store_sk — the store or channel the selling agent represents.
    relationships:
    - to: store.store_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: store
      - property: enforced
        value: false
  - name: store_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable business key of the store.
  - name: product_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to product.product.product_sk — the primary product being negotiated, if applicable.
    relationships:
    - to: product.product_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: product
      - property: enforced
        value: false
  - name: product_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable business key of the product.
  - name: initiating_agent_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to a2a_agent.a2a_agent_sk — the agent that opened the session.
    relationships:
    - to: a2a_agent.a2a_agent_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: agentic_commerce
      - property: enforced
        value: false
  - name: initiating_agent_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable business key of the initiating agent.
  - name: responding_agent_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to a2a_agent.a2a_agent_sk — the agent that responded.
    relationships:
    - to: a2a_agent.a2a_agent_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: agentic_commerce
      - property: enforced
        value: false
  - name: responding_agent_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable business key of the responding agent.
  - name: session_status
    logicalType: string
    physicalType: STRING
    required: true
    description: 'Lifecycle status. Allowed values: initiated, negotiating, agreed, completed, abandoned,
      failed, expired.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: initiated, negotiating, agreed, completed, abandoned, failed, expired.'
  - name: communication_channel
    logicalType: string
    physicalType: STRING
    required: true
    description: 'Communication channel between agents. Allowed values: api, marketplace, direct, voice.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: api, marketplace, direct, voice.'
  - name: initiator_type
    logicalType: string
    physicalType: STRING
    required: true
    description: 'Which side initiated the session. Allowed values: buyer_agent, seller_agent.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: buyer_agent, seller_agent.'
  - name: session_summary
    logicalType: string
    physicalType: STRING
    required: false
    description: Free-text summary of the session outcome or current state. May contain PII if agents
      reference customer details.
    classification: restricted
    tags:
    - dbx_pii
  - name: initiated_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: true
    description: When the session was created (UTC, ISO 8601).
  - name: last_activity_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When the most recent interaction occurred (UTC, ISO 8601). Updated on each negotiation
      event.
  - name: completed_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When the session concluded (UTC, ISO 8601). NULL if still active.
  - name: record_source
    logicalType: string
    physicalType: STRING
    required: false
    description: Originating system or orchestration platform that produced this session.
  - name: source_updated_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When this session row was last modified in the source system (UTC, ISO 8601). Advances
      on each in-place status/activity update.
  - name: load_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When this row was loaded into the lakehouse (UTC, ISO 8601).
  quality:
  - name: a2a_session_keys_not_null
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: Surrogate key, business key, status, channel, initiator, and initiated timestamp are
      mandatory.
    query: "SELECT * FROM agentic_commerce.a2a_session\nWHERE a2a_session_sk IS NULL OR a2a_session_id\
      \ IS NULL\n   OR session_status IS NULL OR communication_channel IS NULL\n   OR initiator_type IS\
      \ NULL OR initiated_timestamp IS NULL"
  - name: a2a_session_business_key_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: Each session business key must be unique (no SCD2; one row per session).
    query: 'SELECT a2a_session_id, COUNT(*) AS row_count

      FROM agentic_commerce.a2a_session

      GROUP BY a2a_session_id

      HAVING COUNT(*) > 1'
  - name: a2a_session_status_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: session_status must be within the declared enum.
    query: 'SELECT * FROM agentic_commerce.a2a_session

      WHERE session_status NOT IN (''initiated'', ''negotiating'', ''agreed'', ''completed'', ''abandoned'',
      ''failed'', ''expired'')'
  - name: a2a_session_communication_channel_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: communication_channel must be within the declared enum.
    query: 'SELECT * FROM agentic_commerce.a2a_session

      WHERE communication_channel NOT IN (''api'', ''marketplace'', ''direct'', ''voice'')'
  - name: a2a_session_initiator_type_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: initiator_type must be within the declared enum.
    query: 'SELECT * FROM agentic_commerce.a2a_session

      WHERE initiator_type NOT IN (''buyer_agent'', ''seller_agent'')'
  - name: a2a_session_buyer_profile_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: Every session with a buyer must reference an existing profile (by surrogate FK).
    query: 'SELECT s.* FROM agentic_commerce.a2a_session s

      LEFT JOIN customer.profile p ON s.buyer_profile_sk = p.profile_sk

      WHERE s.buyer_profile_sk IS NOT NULL AND p.profile_sk IS NULL'
  - name: a2a_session_store_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: Every session with a store must reference an existing store.
    query: 'SELECT s.* FROM agentic_commerce.a2a_session s

      LEFT JOIN store.store st ON s.store_sk = st.store_sk

      WHERE s.store_sk IS NOT NULL AND st.store_sk IS NULL'
  - name: a2a_session_product_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: Every session with a product must reference an existing product.
    query: 'SELECT s.* FROM agentic_commerce.a2a_session s

      LEFT JOIN product.product p ON s.product_sk = p.product_sk

      WHERE s.product_sk IS NOT NULL AND p.product_sk IS NULL'
  - name: a2a_session_completed_timestamp_consistency
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: Completed sessions must have a completed_timestamp; active sessions must not.
    query: "SELECT * FROM agentic_commerce.a2a_session\nWHERE (session_status IN ('completed', 'abandoned',\
      \ 'failed', 'expired') AND completed_timestamp IS NULL)\n   OR (session_status IN ('initiated',\
      \ 'negotiating', 'agreed') AND completed_timestamp IS NOT NULL)"
  - name: a2a_session_timestamp_order
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: completed_timestamp, when set, must be after initiated_timestamp.
    query: "SELECT * FROM agentic_commerce.a2a_session\nWHERE completed_timestamp IS NOT NULL\n  AND completed_timestamp\
      \ <= initiated_timestamp"
  - name: a2a_session_last_activity_bounds
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: last_activity_timestamp, when set, must fall on or after initiated_timestamp and (when
      the session has ended) on or before completed_timestamp.
    query: "SELECT * FROM agentic_commerce.a2a_session\nWHERE last_activity_timestamp IS NOT NULL\n  AND\
      \ (last_activity_timestamp < initiated_timestamp\n    OR (completed_timestamp IS NOT NULL AND last_activity_timestamp\
      \ > completed_timestamp))"
  - name: a2a_session_audit_block_present
    type: sql
    dimension: accuracy
    severity: warning
    mustBe: 0
    unit: rows
    description: 'Audit provenance should be populated: record_source and load_timestamp identify where
      each row came from and when it landed.'
    query: 'SELECT * FROM agentic_commerce.a2a_session

      WHERE record_source IS NULL OR load_timestamp IS NULL'
  - name: a2a_session_initiating_agent_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: Every session with an initiating agent must reference an existing agent.
    query: 'SELECT s.* FROM agentic_commerce.a2a_session s

      LEFT JOIN agentic_commerce.a2a_agent a ON s.initiating_agent_sk = a.a2a_agent_sk

      WHERE s.initiating_agent_sk IS NOT NULL AND a.a2a_agent_sk IS NULL'
  - name: a2a_session_responding_agent_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: Every session with a responding agent must reference an existing agent.
    query: 'SELECT s.* FROM agentic_commerce.a2a_session s

      LEFT JOIN agentic_commerce.a2a_agent a ON s.responding_agent_sk = a.a2a_agent_sk

      WHERE s.responding_agent_sk IS NOT NULL AND a.a2a_agent_sk IS NULL'
  - name: a2a_session_agents_distinct
    type: sql
    dimension: accuracy
    severity: warning
    mustBe: 0
    unit: rows
    description: 'The two agents on a session must be different rows. A self-paired session (one agent
      as both initiator and responder) would double-count that agent in gold_a2a_agent_scorecard, which
      UNION ALLs the two roles. warn: hardens the spine without blocking on a data anomaly.'
    query: "SELECT * FROM agentic_commerce.a2a_session\nWHERE initiating_agent_sk IS NOT NULL AND responding_agent_sk\
      \ IS NOT NULL\n  AND initiating_agent_sk = responding_agent_sk"
  - name: a2a_session_agents_opposite_side
    type: sql
    dimension: accuracy
    severity: warning
    mustBe: 0
    unit: rows
    description: 'The two agents must sit on opposite sides — one buyer_agent, one seller_agent (the A2A
      model is a buying agent negotiating with a selling agent). Joins the current a2a_agent version for
      each side''s role. warn, not error: an agent''s role is SCD2 and could in principle change, so this
      is a consistency signal.'
    query: "SELECT s.* FROM agentic_commerce.a2a_session s\nJOIN agentic_commerce.a2a_agent ia\n  ON s.initiating_agent_sk\
      \ = ia.a2a_agent_sk AND ia.is_current = TRUE\nJOIN agentic_commerce.a2a_agent ra\n  ON s.responding_agent_sk\
      \ = ra.a2a_agent_sk AND ra.is_current = TRUE\nWHERE ia.agent_role = ra.agent_role"
  - name: a2a_session_completed_has_acceptance
    type: sql
    dimension: accuracy
    severity: warning
    mustBe: 0
    unit: rows
    description: 'A completed session should have an acceptance event behind it — completion is the terminal
      lifecycle state a deal reaches after its terms are accepted. If a session reads ''completed'' with
      no acceptance in the event log, the funnel''s completed count (gold_a2a_negotiation_funnel, from
      session_status) can exceed reached_agreed (from the event log). warn, not error: the session''s
      mutable status and the append-only log can legitimately lag at read time, so this is a consistency
      signal rather than a hard invariant.'
    query: "SELECT s.a2a_session_sk, s.a2a_session_id\nFROM agentic_commerce.a2a_session s\nLEFT JOIN\
      \ (\n  SELECT DISTINCT a2a_session_sk\n  FROM agentic_commerce.a2a_negotiation_event\n  WHERE event_type\
      \ = 'acceptance'\n) a ON s.a2a_session_sk = a.a2a_session_sk\nWHERE s.session_status = 'completed'\
      \ AND a.a2a_session_sk IS NULL"
- name: gold_a2a_agent_scorecard
  physicalName: agentic_commerce.gold_a2a_agent_scorecard
  physicalType: view
  description: 'Per-agent performance scorecard. Attributes each session to the agents on both sides (initiating
    and responding), then aggregates outcome metrics per agent: how many sessions it took part in, how
    many completed, its success rate, and average time to completion. Joins the current a2a_agent version
    for role/operator/trust context. Note: this measures start -> completed (the terminal lifecycle timestamp
    on the session), NOT start -> acceptance event; agreement (the acceptance event) can precede completion,
    so this is the wider end-to-end duration, named accordingly.'
  tags:
  - gold
  authoritativeDefinitions:
  - url: outcome-packages/agentic-commerce/README.md
    type: businessDefinition
  - url: outcome-packages/agentic-commerce/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: a2a_agent_id
    logicalType: string
    physicalType: STRING
  - name: agent_name
    logicalType: string
    physicalType: STRING
  - name: agent_role
    logicalType: string
    physicalType: STRING
  - name: operator_name
    logicalType: string
    physicalType: STRING
  - name: trust_status
    logicalType: string
    physicalType: STRING
  - name: sessions_participated
    logicalType: integer
    physicalType: BIGINT
  - name: sessions_completed
    logicalType: integer
    physicalType: BIGINT
  - name: success_rate
    logicalType: number
    physicalType: DOUBLE
  - name: avg_time_to_completion_seconds
    logicalType: number
    physicalType: DOUBLE
- name: gold_a2a_negotiation_funnel
  physicalName: agentic_commerce.gold_a2a_negotiation_funnel
  physicalType: view
  description: 'The A2A negotiation funnel, aggregated by day x channel x product. Each session is counted
    once at each stage it reached, so downstream can chart initiated -> negotiated -> agreed -> completed
    conversion and the loss (abandoned / failed / expired) by cut. Grain: one row per (session_date, communication_channel,
    product_id). NOTE: product_id is nullable on a2a_session (a session need not name a primary product),
    so all product-less sessions for a given day x channel collapse into one row with a NULL product_id
    — read that NULL bucket as "no primary product", not missing data.'
  tags:
  - gold
  authoritativeDefinitions:
  - url: outcome-packages/agentic-commerce/README.md
    type: businessDefinition
  - url: outcome-packages/agentic-commerce/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: session_date
