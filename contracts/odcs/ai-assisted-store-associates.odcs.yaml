    query: SELECT * FROM ai_assisted_store_associates.suggested_action WHERE suggested_action_sk IS NULL
      OR suggested_action_id IS NULL OR generated_timestamp IS NULL OR action_type IS NULL
  - name: sa_associate_key_pair
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sa_associate_key_pair
    query: SELECT * FROM ai_assisted_store_associates.suggested_action WHERE (associate_sk IS NULL) <>
      (associate_id IS NULL)
  - name: sa_associate_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sa_associate_fk_orphan
    query: SELECT f.* FROM ai_assisted_store_associates.suggested_action f LEFT JOIN ai_assisted_store_associates.associate
      a ON f.associate_sk = a.associate_sk WHERE f.associate_sk IS NOT NULL AND a.associate_sk IS NULL
  - name: sa_store_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sa_store_fk_orphan
    query: SELECT f.* FROM ai_assisted_store_associates.suggested_action f LEFT JOIN store.store s ON
      f.store_sk = s.store_sk WHERE f.store_sk IS NOT NULL AND s.store_sk IS NULL
  - name: sa_profile_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sa_profile_fk_orphan
    query: SELECT f.* FROM ai_assisted_store_associates.suggested_action f LEFT JOIN customer.profile
      p ON f.profile_sk = p.profile_sk WHERE f.profile_sk IS NOT NULL AND p.profile_sk IS NULL
  - name: sa_product_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sa_product_fk_orphan
    query: SELECT f.* FROM ai_assisted_store_associates.suggested_action f LEFT JOIN product.product p
      ON f.product_sk = p.product_sk WHERE f.product_sk IS NOT NULL AND p.product_sk IS NULL
  - name: sa_actioned_requires_associate
    type: sql
    dimension: accuracy
    severity: warning
    mustBe: 0
    unit: rows
    description: sa_actioned_requires_associate
    query: 'SELECT a.suggested_action_id

      FROM ai_assisted_store_associates.suggested_action a

      JOIN ai_assisted_store_associates.action_response_log r ON a.suggested_action_sk = r.suggested_action_sk

      WHERE r.response_type IN (''accepted'', ''completed'') AND a.associate_sk IS NULL'
  - name: sa_zone_coverage
    type: sql
    dimension: accuracy
    severity: info
    description: sa_zone_coverage
    query: "SELECT store_id,\n       COUNT(*) AS actions,\n       SUM(CASE WHEN store_zone_id IS NOT NULL\
      \ THEN 1 ELSE 0 END) AS actions_with_zone\nFROM ai_assisted_store_associates.suggested_action\n\
      GROUP BY store_id"
- name: gold_action_outcome_funnel_daily
  physicalName: ai_assisted_store_associates.gold_action_outcome_funnel_daily
  physicalType: view
  description: 'The Next Best Action feedback funnel, one row per store x zone x associate x trading date
    x action_type: how many actions were generated, accepted, rejected, completed and expired, the acceptance/completion
    rates, average time-to-first-response, and the realized monetary outcome. This is the optimization
    surface — it turns the response and outcome logs into the ROI signal and the labeled history for future
    models.'
  tags:
  - gold
  authoritativeDefinitions:
  - url: outcome-packages/ai-assisted-store-associates/README.md
    type: businessDefinition
  - url: outcome-packages/ai-assisted-store-associates/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: store_id
    logicalType: string
    physicalType: STRING
    description: Durable store business key.
  - name: store_zone_id
    logicalType: string
    physicalType: STRING
    description: Durable target-zone id (logical reference to connected-store-signals.store_zone). NULL
      when the actions had no target zone; the grain that exposes the per-zone staffing signal.
  - name: associate_id
    logicalType: string
    physicalType: STRING
    description: Durable associate business key the actions were routed to. NULL for unrouted actions;
      the grain for per-associate effectiveness.
  - name: trading_date
    logicalType: date
    physicalType: DATE
    description: Business date the actions were generated.
  - name: action_type
    logicalType: string
    physicalType: STRING
    description: Task class of the actions in the row.
  - name: actions_generated
    logicalType: integer
    physicalType: BIGINT
    description: Count of actions generated in the cell.
  - name: actions_accepted
    logicalType: integer
    physicalType: BIGINT
    description: Actions with an accepted response (from action_response_log).
  - name: actions_rejected
    logicalType: integer
    physicalType: BIGINT
    description: Actions with a rejected response (from action_response_log).
  - name: actions_completed
    logicalType: integer
    physicalType: BIGINT
    description: Actions with a completed response (from action_response_log).
  - name: actions_expired
    logicalType: integer
    physicalType: BIGINT
    description: Actions with an expired response (from action_response_log).
  - name: acceptance_rate
    logicalType: number
    physicalType: DOUBLE
    description: actions_accepted / actions_generated for the cell (ratio-of-sums-safe components are
      also exposed).
  - name: completion_rate
    logicalType: number
    physicalType: DOUBLE
    description: actions_completed / actions_generated for the cell.
  - name: avg_response_seconds
    logicalType: number
    physicalType: DOUBLE
    description: Mean seconds from dispatch to first response for the cell (display convenience; re-aggregate
      via response_seconds_total / responses_timed).
  - name: response_seconds_total
    description: Sum of dispatch-to-first-response seconds; the additive numerator for average response
      time.
  - name: responses_timed
    logicalType: integer
    physicalType: BIGINT
    description: Count of actions that received a first response; the additive denominator for average
      response time.
  - name: sales_closed
    logicalType: integer
    physicalType: BIGINT
    description: Count of actions resolved as a closed sale.
  - name: realized_outcome_value
    logicalType: number
    physicalType: DECIMAL(18, 2)
    description: Sum of monetary outcomes attributed to the actions (in outcome_currency_code).
  - name: outcome_currency_code
    logicalType: string
    physicalType: STRING
    description: ISO 4217 currency of realized_outcome_value (single reporting currency; see or_single_currency).
  - name: fresh_as_of_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
    description: View evaluation timestamp (UTC).
- name: gold_associate_action_queue_current
  physicalName: ai_assisted_store_associates.gold_associate_action_queue_current
  physicalType: view
  description: 'The live prioritized Next Best Action queue an associate sees: one row per OPEN, non-expired
    suggested action, ranked within each associate by the time-decayed Business Value Score. This is the
    "Associates Best Next Actions" serving surface.'
  tags:
  - gold
  authoritativeDefinitions:
  - url: outcome-packages/ai-assisted-store-associates/README.md
    type: businessDefinition
  - url: outcome-packages/ai-assisted-store-associates/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: associate_id
    logicalType: string
    physicalType: STRING
    description: Durable associate business key the queue belongs to.
  - name: associate_role
    logicalType: string
    physicalType: STRING
    description: Associate job role (from the associate version at dispatch).
  - name: associate_skill_tags
    logicalType: string
    physicalType: STRING
    description: Associate capability tags (pipe-delimited) used for skill matching.
  - name: store_id
    logicalType: string
    physicalType: STRING
    description: Durable store business key.
  - name: store_zone_id
    logicalType: string
    physicalType: STRING
    description: Durable target-zone id (logical reference to connected-store-signals.store_zone).
  - name: suggested_action_id
    logicalType: string
    physicalType: STRING
    description: Durable action business key.
  - name: action_type
    logicalType: string
    physicalType: STRING
    description: 'Task class: customer_assist, restock_shelf, bopis_fulfill, safety_loss_prevention, maintenance_cleaning,
      price_check, queue_bust, clienteling.'
  - name: trigger_source
    logicalType: string
    physicalType: STRING
    description: What fired the action (ble_beacon_dwell, pos_inventory_decrement, order_management_system,
      sensor_event, digital_interaction, schedule, manual).
  - name: base_score
    logicalType: integer
    physicalType: INT
    description: Hierarchy-of-needs base score in [0,100] before dynamic multipliers/decay.
  - name: priority_score
    logicalType: number
    physicalType: DOUBLE
    description: Business Value Score at generation (before time decay), in [0,100].
  - name: current_priority_score
    logicalType: number
    physicalType: DOUBLE
    description: Time-decayed Business Value Score the queue is ranked on, derived in-view from priority_score
      and decay_type since generated_timestamp.
  - name: decay_type
    logicalType: string
    physicalType: STRING
    description: 'Relevance-decay curve applied to priority_score: linear, exponential, immediate_nullification,
      none.'
  - name: current_state
    description: 'Derived lifecycle state (open states only appear here): pending, or the latest non-terminal
      response (accepted / deferred / reassigned). Sourced from action_response_log, not a stored status.'
  - name: profile_id
    logicalType: string
    physicalType: STRING
    description: Durable, pseudonymous customer key the action concerns; NULL for customer-agnostic tasks.
  - name: product_id
    logicalType: string
    physicalType: STRING
    description: Durable product key the action concerns; NULL when not product-specific.
  - name: generated_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    description: When the action was generated/dispatched (UTC).
  - name: expiration_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    description: When the action becomes stale; NULL for persistent tasks.
  - name: minutes_to_expiry
    logicalType: number
    physicalType: DOUBLE
    description: Minutes remaining until expiration at view evaluation time; NULL for persistent tasks.
  - name: queue_rank
    logicalType: integer
    physicalType: BIGINT
    description: Rank of the action within the associate's open queue (1 = highest priority_score).
  - name: context_payload
    logicalType: string
    physicalType: STRING
    description: Schemaless JSON payload the associate app renders (location, customer/product context,
      suggested dialogue).
  - name: fresh_as_of_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
    description: View evaluation timestamp (UTC).
