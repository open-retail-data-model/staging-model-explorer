    physicalType: STRING
  - name: subcategory
    logicalType: string
    physicalType: STRING
  - name: scope_type
    logicalType: string
    physicalType: STRING
  - name: reconciliation_basis
    logicalType: string
    physicalType: STRING
    description: aligned_eod only for full-store sessions closing in the declared EOD window; every other
      row is misaligned.
  - name: eligible_tagged_units
    logicalType: integer
    physicalType: BIGINT
    description: Distinct active serialized units observed for the store-product in the eligibility lookback.
  - name: observed_units
    logicalType: integer
    physicalType: BIGINT
  - name: book_units_eod
    logicalType: number
    physicalType: DECIMAL(12, 3)
  - name: unit_variance
