- name: gold_store_traffic_daily_current
  physicalName: connected_store_signals.gold_store_traffic_daily_current
  physicalType: view
  description: 'GRAIN: one row per store × trading_date.'
  tags:
  - gold
  authoritativeDefinitions:
  - url: outcome-packages/connected-store-signals/README.md
    type: businessDefinition
  - url: outcome-packages/connected-store-signals/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: store_id
    logicalType: string
    physicalType: STRING
    description: Durable store business key.
  - name: trading_date
    logicalType: date
    physicalType: DATE
    description: Business date, derived from the UTC instant plus the store UTC offset -- not a calendar
      date in the reader timezone.
  - name: fiscal_year
    logicalType: integer
    physicalType: INT
  - name: fiscal_period
    logicalType: integer
    physicalType: INT
  - name: fiscal_week
    logicalType: integer
    physicalType: INT
  - name: fiscal_week_id
    logicalType: integer
    physicalType: INT
  - name: fiscal_week_index
    logicalType: integer
    physicalType: INT
  - name: day_of_week
    logicalType: integer
    physicalType: INT
  - name: is_holiday
    logicalType: boolean
    physicalType: BOOLEAN
  - name: footfall_count
    logicalType: integer
    physicalType: BIGINT
    description: Store footfall for the day, measured AT site level. NOT a sum over zones -- a shopper
      traversing five zones would be counted five times.
  - name: entry_count
    logicalType: integer
    physicalType: BIGINT
    description: Measured entries. The denominator for per-entry productivity measures.
  - name: exit_count
    logicalType: integer
    physicalType: BIGINT
    description: Measured exits. NULL where the sensors are non-directional and therefore cannot measure
      them. Entries and exits are independently measured and never exactly equal.
  - name: visitor_count_adjusted
    logicalType: integer
    physicalType: BIGINT
    description: Footfall after staff exclusion. Equals visitor_count_raw - staff_count.
  - name: staff_count
    logicalType: integer
    physicalType: BIGINT
    description: Staff detections excluded from footfall.
  - name: child_count
    logicalType: integer
    physicalType: BIGINT
    description: Child detections. A SUBSET of footfall, not an exclusion from it.
  - name: peak_occupancy
    logicalType: integer
    physicalType: BIGINT
    description: 'Highest simultaneous occupancy in the day. Semi-additive: a MAX over intervals, never
      a SUM.'
  - name: avg_occupancy
    logicalType: number
    physicalType: DOUBLE
    description: Mean simultaneous occupancy, DURATION-WEIGHTED by interval length rather than an average
      of averages.
  - name: dwell_seconds_total
    logicalType: integer
    physicalType: BIGINT
    description: Dwell numerator. Kept alongside dwell_count so the average re-aggregates correctly at
      any grain.
  - name: dwell_count
    logicalType: integer
    physicalType: BIGINT
    description: Dwell denominator -- the number of dwell observations.
  - name: avg_dwell_seconds
    logicalType: number
    physicalType: DOUBLE
    description: dwell_seconds_total / dwell_count.
  - name: footfall_count_py
    logicalType: integer
    physicalType: BIGINT
    description: Footfall on the equivalent NRF fiscal week and weekday last year, not the same calendar
      date.
  - name: footfall_delta_py
    logicalType: integer
    physicalType: BIGINT
  - name: footfall_growth_py
    logicalType: number
    physicalType: DOUBLE
    description: Fractional growth against footfall_count_py.
  - name: counting_unit
    logicalType: string
    physicalType: STRING
    description: 'What one count represents: person, group, device or object. A footfall number is uninterpretable
      without it.'
  - name: staff_exclusion_enabled
    logicalType: boolean
    physicalType: BOOLEAN
    description: TRUE if staff were excluded. Store-days differing on this are not comparable without
      saying so.
  - name: group_counting_enabled
    logicalType: boolean
    physicalType: BOOLEAN
    description: TRUE if family or shopping groups were counted as one. Changes counting_unit from person
      to group.
  - name: time_mode
    logicalType: string
    physicalType: STRING
    description: Whether the day covers operating hours only or all day. Vendors expose this per metric,
      so it travels with the row.
  - name: avg_uptime_ratio
    logicalType: number
    physicalType: DOUBLE
    description: Mean share of canonical interval duration the sensors were online. Read this before trusting
      a low count.
  - name: avg_coverage_ratio
    logicalType: number
    physicalType: DOUBLE
    description: Mean share of expected sensors that reported. A low value means the count is PARTIAL,
      not low.
  - name: valid_interval_share
    logicalType: number
    physicalType: DOUBLE
    description: Share of intervals whose measurement was valid. Orthogonal to completeness -- an interval
      can be complete but invalid.
  - name: complete_interval_share
    logicalType: number
    physicalType: DOUBLE
    description: Share of intervals whose data had fully landed. Orthogonal to validity.
  - name: has_imputed_intervals
    logicalType: boolean
    physicalType: BOOLEAN
    description: TRUE if any interval was modelled rather than measured.
  - name: is_zero_observed
    logicalType: boolean
    physicalType: BOOLEAN
  - name: interval_count
    logicalType: integer
    physicalType: BIGINT
    description: Source intervals behind the row.
  - name: interval_minutes_total
    logicalType: integer
    physicalType: BIGINT
    description: Total duration of valid traffic intervals. This generic duration is not the denominator
      for measures that were reported on only some intervals.
  - name: occupancy_interval_minutes_total
    logicalType: integer
    physicalType: BIGINT
    description: Duration of valid intervals with a reported occupancy average; the re-aggregation denominator
      for avg_occupancy.
  - name: uptime_interval_minutes_total
    logicalType: integer
    physicalType: BIGINT
    description: Duration of intervals with a reported uptime ratio; the re-aggregation denominator for
      avg_uptime_ratio.
  - name: coverage_interval_minutes_total
    logicalType: integer
    physicalType: BIGINT
    description: Duration of intervals with a reported coverage ratio; the re-aggregation denominator
      for avg_coverage_ratio.
  - name: aggregation_level
    logicalType: string
    physicalType: STRING
    description: Always site for this view. Present so a consumer joining it to zone data cannot mix levels
      by accident.
  - name: fresh_as_of_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
    description: When the view was evaluated.
  quality:
  - name: css_store_traffic_grain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: css_store_traffic_grain
    query: 'SELECT store_id, trading_date, COUNT(*) AS n

      FROM connected_store_signals.gold_store_traffic_daily_current

      GROUP BY store_id, trading_date

      HAVING COUNT(*) > 1'
