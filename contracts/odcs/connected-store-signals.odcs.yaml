  properties:
  - name: store_id
    logicalType: string
    physicalType: STRING
    description: Durable store business key.
  - name: store_zone_id
    logicalType: string
    physicalType: STRING
    description: Durable zone business key.
  - name: zone_code
    description: Zone code from the version effective for the measured intervals.
  - name: zone_name
    description: Human-readable zone name.
  - name: zone_type
    description: Depth or role of the zone in the in-store spatial hierarchy.
  - name: parent_zone_id
    description: Durable id of the containing zone.
  - name: hierarchy_depth
    description: Materialised zone depth, where zero is the site.
  - name: is_sales_floor
    description: TRUE when the zone is customer-accessible selling space.
  - name: trading_date
    logicalType: date
    physicalType: DATE
    description: Business date whose effective disclosure policy governs this shared cell.
  - name: fiscal_year
    logicalType: integer
    physicalType: INT
    description: NRF fiscal year for the trading date.
  - name: fiscal_week_id
    logicalType: integer
    physicalType: INT
    description: NRF fiscal week identifier.
  - name: day_of_week
    logicalType: integer
    physicalType: INT
    description: ISO day of week for the trading date.
  - name: footfall_count
    logicalType: integer
    physicalType: BIGINT
    description: Disclosure-controlled zone footfall. NULL with disclosure_suppressed_flag = TRUE means
      suppressed, not zero.
  - name: entry_count
    logicalType: integer
    physicalType: BIGINT
    description: Disclosure-controlled zone entries. NULL with disclosure_suppressed_flag = TRUE means
      suppressed.
  - name: exit_count
    logicalType: integer
    physicalType: BIGINT
    description: Disclosure-controlled zone exits. NULL with disclosure_suppressed_flag = TRUE means suppressed;
      otherwise NULL can mean a non-directional source.
  - name: passersby_count
    logicalType: integer
    physicalType: BIGINT
    description: Disclosure-controlled pass-by traffic. NULL with disclosure_suppressed_flag = TRUE means
      suppressed.
  - name: peak_occupancy
    logicalType: integer
    physicalType: BIGINT
    description: Disclosure-controlled zone peak occupancy. NULL with disclosure_suppressed_flag = TRUE
      means suppressed.
  - name: avg_occupancy
    logicalType: number
    physicalType: DOUBLE
    description: Disclosure-controlled duration-weighted mean occupancy. NULL with disclosure_suppressed_flag
      = TRUE means suppressed.
  - name: dwell_seconds_total
    logicalType: integer
    physicalType: BIGINT
    description: Disclosure-controlled dwell numerator. NULL with disclosure_suppressed_flag = TRUE means
      suppressed.
  - name: dwell_count
    logicalType: integer
    physicalType: BIGINT
    description: Disclosure-controlled dwell denominator. NULL with disclosure_suppressed_flag = TRUE
      means suppressed.
  - name: avg_dwell_seconds
    logicalType: number
    physicalType: DOUBLE
    description: Disclosure-controlled dwell_seconds_total / dwell_count. NULL with disclosure_suppressed_flag
      = TRUE means suppressed.
  - name: engaged_count
    logicalType: integer
    physicalType: BIGINT
    description: Disclosure-controlled dwell observations at or above the engagement threshold.
  - name: passing_count
    logicalType: integer
    physicalType: BIGINT
    description: Disclosure-controlled dwell observations below the engagement threshold.
  - name: engagement_rate
    logicalType: number
    physicalType: DOUBLE
    description: Disclosure-controlled engaged_count / dwell_count.
  - name: footfall_per_sqm
    logicalType: number
    physicalType: DOUBLE
    description: Disclosure-controlled daily zone traffic density.
  - name: occupancy_per_sqm
    logicalType: number
    physicalType: DOUBLE
    description: Disclosure-controlled mean occupancy density.
  - name: peak_capacity_utilisation
    logicalType: number
    physicalType: DOUBLE
    description: Disclosure-controlled peak occupancy as a share of effective capacity.
  - name: area_sqm
    logicalType: number
    physicalType: DECIMAL
    description: Duration-weighted effective zone area. This non-traffic dimension remains visible when
      traffic measures are suppressed.
  - name: capacity_persons
    logicalType: number
    physicalType: DOUBLE
    description: Duration-weighted effective zone capacity. This non-traffic dimension remains visible
      when traffic measures are suppressed.
  - name: counting_unit
    logicalType: string
    physicalType: STRING
    description: 'What one published count represents: person, group, device or object.'
  - name: staff_exclusion_enabled
    logicalType: boolean
    physicalType: BOOLEAN
    description: TRUE when staff were excluded from the operational count behind this shared row.
  - name: sensing_disclosure_policy_id
    logicalType: string
    physicalType: STRING
    description: Durable policy assignment whose effective version was resolved for this trading date.
  - name: disclosure_suppressed_flag
    logicalType: boolean
    physicalType: BOOLEAN
    description: TRUE when every traffic-derived measure in this cell is NULL under same-cell dependent-measure
      suppression.
  - name: aggregation_level
    logicalType: string
    physicalType: STRING
    description: Always area. Zone footfall is not additive across zones.
  - name: fresh_as_of_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
    description: When the shared view was evaluated.
  quality:
  - name: shared_suppression_threshold
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: shared_suppression_threshold
    query: "SELECT 'zone' AS shared_view, s.store_id, s.trading_date, s.footfall_count\nFROM connected_store_signals.gold_zone_traffic_shared\
      \ s\nJOIN connected_store_signals.sensing_disclosure_policy p\n  ON s.sensing_disclosure_policy_id\
      \ = p.sensing_disclosure_policy_id\n AND s.trading_date >= p.effective_from_date\n AND (p.effective_to_date\
      \ IS NULL OR s.trading_date < p.effective_to_date)\nWHERE s.footfall_count IS NOT NULL\n  AND s.footfall_count\
      \ < p.k_threshold\nUNION ALL\nSELECT 'store' AS shared_view, s.store_id, s.trading_date, s.footfall_count\n\
      FROM connected_store_signals.gold_store_traffic_daily_shared s\nJOIN connected_store_signals.sensing_disclosure_policy\
      \ p\n  ON s.sensing_disclosure_policy_id = p.sensing_disclosure_policy_id\n AND s.trading_date >=\
      \ p.effective_from_date\n AND (p.effective_to_date IS NULL OR s.trading_date < p.effective_to_date)\n\
      WHERE s.footfall_count IS NOT NULL\n  AND s.footfall_count < p.k_threshold"
  - name: shared_zero_suppression
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: shared_zero_suppression
    query: "SELECT 'zone' AS shared_view, s.store_id, s.trading_date, s.footfall_count\nFROM connected_store_signals.gold_zone_traffic_shared\
      \ s\nJOIN connected_store_signals.sensing_disclosure_policy p\n  ON s.sensing_disclosure_policy_id\
      \ = p.sensing_disclosure_policy_id\n AND s.trading_date >= p.effective_from_date\n AND (p.effective_to_date\
      \ IS NULL OR s.trading_date < p.effective_to_date)\nWHERE p.suppress_zero_flag = TRUE\n  AND s.footfall_count\
      \ = 0\nUNION ALL\nSELECT 'store' AS shared_view, s.store_id, s.trading_date, s.footfall_count\n\
      FROM connected_store_signals.gold_store_traffic_daily_shared s\nJOIN connected_store_signals.sensing_disclosure_policy\
      \ p\n  ON s.sensing_disclosure_policy_id = p.sensing_disclosure_policy_id\n AND s.trading_date >=\
      \ p.effective_from_date\n AND (p.effective_to_date IS NULL OR s.trading_date < p.effective_to_date)\n\
      WHERE p.suppress_zero_flag = TRUE\n  AND s.footfall_count = 0"
  - name: shared_dependent_measure_suppression
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: shared_dependent_measure_suppression
    query: "SELECT 'zone' AS shared_view, store_id, trading_date\nFROM connected_store_signals.gold_zone_traffic_shared\n\
      WHERE disclosure_suppressed_flag = TRUE\n  AND (\n    footfall_count IS NOT NULL\n    OR entry_count\
      \ IS NOT NULL\n    OR exit_count IS NOT NULL\n    OR passersby_count IS NOT NULL\n    OR peak_occupancy\
      \ IS NOT NULL\n    OR avg_occupancy IS NOT NULL\n    OR dwell_seconds_total IS NOT NULL\n    OR\
      \ dwell_count IS NOT NULL\n    OR avg_dwell_seconds IS NOT NULL\n    OR engaged_count IS NOT NULL\n\
      \    OR passing_count IS NOT NULL\n    OR engagement_rate IS NOT NULL\n    OR footfall_per_sqm IS\
      \ NOT NULL\n    OR occupancy_per_sqm IS NOT NULL\n    OR peak_capacity_utilisation IS NOT NULL\n\
      \  )\nUNION ALL\nSELECT 'store' AS shared_view, store_id, trading_date\nFROM connected_store_signals.gold_store_traffic_daily_shared\n\
      WHERE disclosure_suppressed_flag = TRUE\n  AND (\n    footfall_count IS NOT NULL\n    OR entry_count\
      \ IS NOT NULL\n    OR exit_count IS NOT NULL\n    OR peak_occupancy IS NOT NULL\n    OR avg_occupancy\
      \ IS NOT NULL\n    OR dwell_seconds_total IS NOT NULL\n    OR dwell_count IS NOT NULL\n    OR avg_dwell_seconds\
      \ IS NOT NULL\n  )"
