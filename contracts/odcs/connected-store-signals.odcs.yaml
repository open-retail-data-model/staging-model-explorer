    logicalType: number
    physicalType: DOUBLE
    description: Observed-versus-EOD-book agreement for aligned_eod rows only; NULL for misaligned sessions.
  - name: observed_to_book_agreement_pct
    logicalType: number
    physicalType: DOUBLE
    description: Agreement evidence for misaligned sessions; it must not be labeled inventory accuracy.
  - name: is_phantom_stock
    logicalType: boolean
    physicalType: BOOLEAN
    description: TRUE when an aligned eligible product has positive EOD book stock and zero observed units.
  - name: is_record_inaccuracy
    logicalType: boolean
    physicalType: BOOLEAN
  - name: reconciled_at_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
