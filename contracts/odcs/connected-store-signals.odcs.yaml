- name: gold_item_current_state
  physicalName: connected_store_signals.gold_item_current_state
  physicalType: view
  description: 'GRAIN: one row per serialized item (durable tagged_item_id). Stray-suspect reads never
    drive state. A recall is persistent until a future explicit release mechanism is modeled; ordinary
    dispositions use the latest event. Reference freshness windows are 120 minutes for fixed readers and
    24 hours for mobile sweeps. Adopters may tighten them without changing the event contract. The evaluation
    clock defaults to wall clock; historical demos may explicitly evaluate at the RFID event-time maximum
    under ADR 0038 without rewriting history.'
  tags:
  - gold
  authoritativeDefinitions:
