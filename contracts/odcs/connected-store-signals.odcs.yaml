  - name: day_of_week
    logicalType: integer
    physicalType: INT
    description: ISO day of week for the trading date.
  - name: is_holiday
    logicalType: boolean
    physicalType: BOOLEAN
    description: TRUE when the trading date is a recognised retail holiday.
  - name: footfall_count
    logicalType: integer
    physicalType: BIGINT
    description: Disclosure-controlled site-level footfall. NULL with disclosure_suppressed_flag = TRUE
      means suppressed, not zero.
  - name: entry_count
    logicalType: integer
    physicalType: BIGINT
    description: Disclosure-controlled measured entries. NULL with disclosure_suppressed_flag = TRUE means
      suppressed, not zero.
  - name: exit_count
    logicalType: integer
    physicalType: BIGINT
    description: Disclosure-controlled measured exits. NULL with disclosure_suppressed_flag = TRUE means
      suppressed; otherwise NULL can mean a non-directional source.
  - name: peak_occupancy
    logicalType: integer
    physicalType: BIGINT
