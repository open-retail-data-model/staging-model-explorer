    description: 'Durable binding key: esl_label_id|product_id|store_zone_id. Re-pairing the same triple
      resumes the same durable identity with a new version.'
  - name: esl_label_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    description: FK to the label endpoint version bound.
    relationships:
    - to: esl_label.esl_label_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: connected_store_signals
      - property: enforced
        value: false
  - name: esl_label_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable label endpoint identifier.
  - name: product_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    description: FK to the product version in effect when this version was written.
    relationships:
    - to: product.product_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: product
      - property: enforced
        value: false
  - name: product_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable product business key this label displays.
  - name: store_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    description: FK to the store version in effect when this version was written.
    relationships:
    - to: store.store_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: store
      - property: enforced
        value: false
  - name: store_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable store business key.
  - name: store_zone_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    description: FK to the shelf-position zone version where the bound label is placed.
    relationships:
    - to: store_zone.store_zone_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: connected_store_signals
      - property: enforced
        value: false
  - name: store_zone_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable shelf-position zone id of the label placement.
  - name: encoded_gtin
    logicalType: string
    physicalType: STRING
    required: false
    description: The GTIN as ENCODED at the shelf edge for this binding — a snapshot of what the label
      carries, not an identity authority. Core product.gtin remains authoritative; a warn-severity check
      surfaces disagreement, because a wrong encoding is exactly the shelf-edge defect this layer exists
      to catch (Sunrise 2027 join key).
  - name: encoded_digital_link_uri
    logicalType: string
    physicalType: STRING
    required: false
    description: The GS1 Digital Link URI as RENDERED by the label where qr_capable — shelf-edge snapshot,
      same authority rule as encoded_gtin (Sunrise 2027 lead syntax).
  - name: binding_source
    logicalType: string
    physicalType: STRING
    required: false
    description: 'How the binding was made. Allowed values: platform, manual.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: platform, manual.'
  - name: is_binding_verified
    logicalType: boolean
    physicalType: BOOLEAN
    required: false
    description: TRUE when the pairing was verified after assignment (scan-back or platform verification
      workflow).
  - name: binding_status
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Allowed values: active, suspended, retired.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: active, suspended, retired.'
  - name: valid_from_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: true
    description: Inclusive UTC instant this binding version took effect. The version grain key.
  - name: valid_to_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: Exclusive UTC instant this binding stopped applying; NULL for the current version.
  - name: effective_from_date
    logicalType: date
    physicalType: DATE
    required: true
    description: 'SCD2: inclusive start date this version became effective. Derived: CAST(valid_from_ts
      AS DATE).'
  - name: effective_to_date
    logicalType: date
    physicalType: DATE
    required: false
    description: 'SCD2: exclusive end date; NULL for the current version. Derived from valid_to_ts.'
  - name: is_current
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: 'SCD2: TRUE for the currently active version.'
  - name: created_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When the record was created in the source system (UTC, ISO 8601).
  - name: source_updated_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When the record was last modified in the source system (UTC, ISO 8601).
  - name: record_source
    logicalType: string
    physicalType: STRING
    required: false
    description: Originating system of record (vendor-neutral label).
  - name: load_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When this row was loaded (UTC, ISO 8601).
  quality:
  - name: esla_grain_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: esla_grain_unique
    query: SELECT esl_label_assignment_id, valid_from_ts, COUNT(*) AS n FROM connected_store_signals.esl_label_assignment
      GROUP BY esl_label_assignment_id, valid_from_ts HAVING COUNT(*) > 1
  - name: esla_keys_not_null
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: esla_keys_not_null
    query: SELECT * FROM connected_store_signals.esl_label_assignment WHERE esl_label_assignment_sk IS
      NULL OR esl_label_assignment_id IS NULL OR esl_label_id IS NULL OR product_id IS NULL OR store_id
      IS NULL OR store_zone_id IS NULL OR valid_from_ts IS NULL OR effective_from_date IS NULL OR is_current
      IS NULL
  - name: esla_dates_derive_from_ts
    type: sql
    dimension: accuracy
    severity: warning
    mustBe: 0
    unit: rows
    description: esla_dates_derive_from_ts
    query: "SELECT * FROM connected_store_signals.esl_label_assignment\nWHERE effective_from_date <> CAST(valid_from_ts\
      \ AS DATE)\n   OR (valid_to_ts IS NULL AND effective_to_date IS NOT NULL)\n   OR (valid_to_ts IS\
      \ NOT NULL AND\n       (effective_to_date IS NULL OR effective_to_date <> CAST(valid_to_ts AS DATE)))"
  - name: esla_scd2_consistent
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: esla_scd2_consistent
    query: "SELECT * FROM connected_store_signals.esl_label_assignment\nWHERE (is_current = TRUE AND (valid_to_ts\
      \ IS NOT NULL OR effective_to_date IS NOT NULL))\n   OR (is_current = FALSE AND (valid_to_ts IS\
      \ NULL OR effective_to_date IS NULL))\n   OR (valid_to_ts IS NOT NULL AND valid_to_ts <= valid_from_ts)"
  - name: esla_single_current
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: esla_single_current
    query: SELECT esl_label_assignment_id, COUNT(*) AS n FROM connected_store_signals.esl_label_assignment
      WHERE is_current = TRUE GROUP BY esl_label_assignment_id HAVING COUNT(*) > 1
  - name: esla_one_current_per_label
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: esla_one_current_per_label
    query: SELECT esl_label_id, COUNT(*) AS n FROM connected_store_signals.esl_label_assignment WHERE
      is_current = TRUE GROUP BY esl_label_id HAVING COUNT(*) > 1
  - name: esla_current_chain_resolves
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: esla_current_chain_resolves
    query: "SELECT a.esl_label_assignment_id, a.esl_label_id, a.store_zone_id, a.product_id\nFROM connected_store_signals.esl_label_assignment\
      \ a\nLEFT JOIN connected_store_signals.esl_label l\n  ON a.esl_label_id = l.esl_label_id AND l.is_current\
      \ = TRUE\nLEFT JOIN connected_store_signals.shelf_position_assignment s\n  ON a.store_id = s.store_id\n\
      \ AND a.store_zone_id = s.store_zone_id\n AND a.product_id = s.product_id\n AND s.is_current = TRUE\n\
      \ AND s.assignment_status = 'active'\nWHERE a.is_current = TRUE\n  AND a.binding_status = 'active'\n\
      \  AND (l.esl_label_id IS NULL OR l.store_id <> a.store_id\n       OR s.shelf_position_assignment_id\
      \ IS NULL)"
  - name: esla_nonoverlapping_validity
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: esla_nonoverlapping_validity
    query: "SELECT a.esl_label_id, a.esl_label_assignment_sk, b.esl_label_assignment_sk AS overlapping_sk\n\
      FROM connected_store_signals.esl_label_assignment a\nJOIN connected_store_signals.esl_label_assignment\
      \ b\n  ON a.esl_label_id = b.esl_label_id\n AND a.esl_label_assignment_sk < b.esl_label_assignment_sk\n\
      \ AND a.valid_from_ts < COALESCE(b.valid_to_ts, TIMESTAMP'9999-12-31 00:00:00')\n AND b.valid_from_ts\
      \ < COALESCE(a.valid_to_ts, TIMESTAMP'9999-12-31 00:00:00')"
  - name: esla_label_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: esla_label_fk_orphan
    query: SELECT a.* FROM connected_store_signals.esl_label_assignment a LEFT JOIN connected_store_signals.esl_label
      l ON a.esl_label_sk = l.esl_label_sk WHERE a.esl_label_sk IS NOT NULL AND l.esl_label_sk IS NULL
  - name: esla_product_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: esla_product_fk_orphan
    query: SELECT a.* FROM connected_store_signals.esl_label_assignment a LEFT JOIN product.product p
      ON a.product_sk = p.product_sk WHERE a.product_sk IS NOT NULL AND p.product_sk IS NULL
  - name: esla_store_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: esla_store_fk_orphan
    query: SELECT a.* FROM connected_store_signals.esl_label_assignment a LEFT JOIN store.store s ON a.store_sk
      = s.store_sk WHERE a.store_sk IS NOT NULL AND s.store_sk IS NULL
  - name: esla_zone_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: esla_zone_fk_orphan
    query: SELECT a.* FROM connected_store_signals.esl_label_assignment a LEFT JOIN connected_store_signals.store_zone
      z ON a.store_zone_sk = z.store_zone_sk WHERE a.store_zone_sk IS NOT NULL AND z.store_zone_sk IS
      NULL
  - name: esla_reference_key_agreement
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: esla_reference_key_agreement
    query: "SELECT a.esl_label_assignment_id\nFROM connected_store_signals.esl_label_assignment a\nJOIN\
      \ connected_store_signals.esl_label l ON a.esl_label_sk = l.esl_label_sk\nJOIN product.product p\
      \ ON a.product_sk = p.product_sk\nJOIN store.store s ON a.store_sk = s.store_sk\nJOIN connected_store_signals.store_zone\
      \ z ON a.store_zone_sk = z.store_zone_sk\nWHERE a.esl_label_id <> l.esl_label_id\n   OR a.product_id\
      \ <> p.product_id\n   OR a.store_id <> s.store_id\n   OR a.store_zone_id <> z.store_zone_id"
  - name: esla_zone_is_shelf_position
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: esla_zone_is_shelf_position
    query: "SELECT a.esl_label_assignment_id, z.store_zone_id, z.zone_type\nFROM connected_store_signals.esl_label_assignment\
      \ a\nJOIN connected_store_signals.store_zone z\n  ON a.store_zone_sk = z.store_zone_sk\nWHERE z.zone_type\
      \ <> 'shelf_position'"
  - name: esla_encoded_gtin_agrees
    type: sql
    dimension: accuracy
    severity: warning
    mustBe: 0
    unit: rows
    description: esla_encoded_gtin_agrees
    query: "SELECT a.esl_label_assignment_id, a.encoded_gtin, p.gtin AS product_gtin\nFROM connected_store_signals.esl_label_assignment\
      \ a\nJOIN product.product p\n  ON a.product_sk = p.product_sk\nWHERE a.encoded_gtin IS NOT NULL\n\
      \  AND p.gtin IS NOT NULL\n  AND a.encoded_gtin <> p.gtin"
- name: esl_price_observation
  physicalName: connected_store_signals.esl_price_observation
  physicalType: table
  description: 'Connected Store Signals append-only price-display audit fact: what each ESL displayed,
    when, by which evidence path, against the captured price of record. Observation-only ESL layer (draft
    ADR-C, extending ADR 0030).'
  tags:
  - transactional
  authoritativeDefinitions:
  - url: outcome-packages/connected-store-signals/README.md
    type: businessDefinition
  - url: outcome-packages/connected-store-signals/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: esl_price_observation_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: 'Surrogate join key: xxhash64(esl_price_observation_id). The durable id is authoritative
      and collision-guarded.'
  - name: esl_price_observation_id
    logicalType: string
    physicalType: STRING
    required: true
    description: 'Durable grain key: esl_label_id|observation_source|source_observation_id. Source-event
      identity, not timestamp-to-the-second: a re-delivered source event deduplicates instead of duplicating,
      and ack/CV/audit observing the same label in the same second cannot collide.'
  - name: source_observation_id
    logicalType: string
    physicalType: STRING
    required: true
    description: 'Source-system event identity: platform ack/event id, CV frame/inference id, or audit
      record id. Part of the durable grain key.'
  - name: esl_label_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    description: FK to the label endpoint version in effect at observation time.
    relationships:
    - to: esl_label.esl_label_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: connected_store_signals
      - property: enforced
        value: false
  - name: esl_label_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable label endpoint identifier.
  - name: esl_label_assignment_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to the binding version current at observation time. NULL when the label was observed
      unbound.
    relationships:
    - to: esl_label_assignment.esl_label_assignment_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: connected_store_signals
      - property: enforced
        value: false
  - name: esl_label_assignment_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable binding key captured at observation time (SCD2-safe attribution, ADR 0025). NULL
      when observed unbound.
  - name: product_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: Product version resolved through the binding at write. NULL when observed unbound.
    relationships:
    - to: product.product_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: product
      - property: enforced
        value: false
  - name: product_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable product business key via the binding. NULL when observed unbound.
  - name: store_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    description: FK to the store version in effect at observation time.
    relationships:
    - to: store.store_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: store
      - property: enforced
        value: false
  - name: store_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable store business key.
  - name: store_zone_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to the shelf-position zone version of the label placement at observation time.
    relationships:
    - to: store_zone.store_zone_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: connected_store_signals
      - property: enforced
        value: false
  - name: store_zone_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable shelf-position zone id via the binding. NULL when observed unbound.
  - name: observed_at_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: true
    description: 'Observation instant as UTC: ack receipt, CV capture, or audit scan time.'
  - name: store_timezone
    logicalType: string
    physicalType: STRING
    required: false
    description: IANA store timezone used to derive local business fields.
  - name: utc_offset_minutes
    logicalType: integer
    physicalType: SMALLINT
    required: true
    description: Store UTC offset in minutes at observed_at_ts.
  - name: trading_date
    logicalType: date
    physicalType: DATE
    required: true
    description: Business date of observed_at_ts, persisted on the ledger itself so no join loss can strip
      store-local date context. Logical join to fiscal_calendar.date_key.
  - name: hour_of_day
    logicalType: integer
    physicalType: TINYINT
    required: false
    description: Store-local observation hour, 0 through 23.
  - name: observation_source
    logicalType: string
    physicalType: STRING
    required: true
    description: 'How the displayed state became known: platform_ack, shelf_cv, manual_audit. The three
      paths are independent evidence; disagreement between them is signal.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: platform_ack, shelf_cv, manual_audit.'
  - name: displayed_price
    logicalType: number
    physicalType: DECIMAL(18,4)
    required: false
    description: Unit-grain price shown on the label at observation, in the store reporting currency.
      NULL only when the source could observe the label but not read a price (e.g. occluded CV).
    quality:
    - type: text
      dimension: validity
      severity: error
      description: CHECK ((displayed_price IS NULL OR displayed_price >= 0) AND (displayed_unit_price
        IS NULL OR displayed_unit_price >= 0) AND (price_of_record IS NULL OR price_of_record >= 0) AND
        (display_sync_latency_seconds IS NULL OR display_sync_latency_seconds >= 0)).
    - type: text
      dimension: validity
      severity: error
      description: CHECK (displayed_price IS NULL OR price_of_record IS NULL OR (displayed_currency_code
        IS NOT NULL AND price_of_record_currency_code IS NOT NULL AND displayed_currency_code = price_of_record_currency_code)).
  - name: displayed_currency_code
    logicalType: string
    physicalType: STRING
    required: false
    description: ISO 4217 currency of the displayed price; must match the store reporting currency (single-currency
      check).
  - name: displayed_unit_price
    logicalType: number
    physicalType: DECIMAL(18,4)
    required: false
    description: 'Unit price shown (per uom), where the label displays one. NIST HB44 random-weight awareness:
      unit-priced items are priced from scale PLU memory, not the POS database.'
  - name: unit_price_uom
    logicalType: string
    physicalType: STRING
    required: false
    description: UN/CEFACT unit code for the displayed unit price (e.g. KGM, LBR).
  - name: displayed_promo_indicator
    logicalType: boolean
    physicalType: BOOLEAN
    required: false
    description: TRUE when the label showed a promotional presentation AS DISPLAYED. Records the display,
      not the promotion validity.
  - name: displayed_disclosure_indicator
    logicalType: boolean
    physicalType: BOOLEAN
    required: false
    description: TRUE when the label showed a pricing-disclosure notice AS DISPLAYED (NY GBL §349-a wording;
      CT 2026 mandated label text). Observed display state, not a compliance conclusion.
  - name: displayed_disclosure_text
    logicalType: string
    physicalType: STRING
    required: false
    description: The disclosure wording as displayed, where the source captures text. Nullable; an indicator
      plus Bronze evidence may stand in.
  - name: price_of_record
    logicalType: number
    physicalType: DECIMAL(18,4)
    required: false
    description: The STORE-SCOPED unit-grain authoritative price in effect at observation time, captured
      onto the row (degenerate copy — audit evidence must stand alone). Core product_price is product
      × price_type × DATE with no store/channel scope, so it is a legal source only where the adopter
      prices chain-wide by day; store/zone-priced or intraday-priced estates capture from their pricing
      platform of record. This fact READS pricing; it never feeds it (ADR 0030).
    quality:
    - type: text
      dimension: validity
      severity: error
      description: CHECK ((price_of_record IS NULL AND price_of_record_currency_code IS NULL) OR (price_of_record
        IS NOT NULL AND price_of_record_currency_code IS NOT NULL)).
  - name: price_of_record_currency_code
    logicalType: string
    physicalType: STRING
    required: false
    description: 'ISO 4217 currency of the captured price of record. MUST equal displayed_currency_code
      and the store reporting currency: price_of_record_source may name a non-store-reporting authority
      (pricing_platform, pos_system) whose price arrives in another currency, so without this column is_price_match
      and the over/undercharge magnitudes would silently compare across currencies. Enforced row-wise
      by eslp_price_of_record_currency and folded into the single-reporting-currency contract (eslp_single_currency).'
  - name: price_of_record_source
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Which authority the captured price of record came from: pricing_platform, product_price,
      pos_system, scale_plu, manual. NIST HB44: random-weight items price from scale PLU memory, not the
      POS database — "the price" has no single origin (ADR 0030 consequence), so the source is part of
      the evidence.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: pricing_platform, product_price, pos_system, scale_plu, manual.'
  - name: price_of_record_price_type
    logicalType: string
    physicalType: STRING
    required: false
    description: Price type of the captured record where the source distinguishes one (e.g. list, promotional).
      Vocabulary follows the source system; core product_price uses list/cost/promotional/contract.
  - name: price_of_record_effective_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: UTC instant the captured price of record became effective IN THE SOURCE AUTHORITY. Date-grained
      sources (core product_price) yield a midnight instant; intraday-capable platforms yield the real
      one — display_sync_latency_seconds is only as good as this timestamp.
  - name: is_price_match
    logicalType: boolean
    physicalType: BOOLEAN
    required: false
    description: 'TRUE when displayed_price equals the captured price of record. NULL when either side
      is unobserved. Comparison is same-currency by contract: price_of_record_currency_code = displayed_currency_code
      (eslp_price_of_record_currency).'
  - name: display_sync_latency_seconds
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: Seconds from price-of-record effectiveness to this ack observation. platform_ack rows
      only; NULL otherwise.
  - name: sensing_derived_input_flag
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: 'ADR 0030 §Decision.2 invariant, schema-visible: always FALSE (Delta CHECK). No displayed
      price may claim a sensing-derived input; any attempt to violate is an explicit, reviewable act.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: CHECK (sensing_derived_input_flag = FALSE).
  - name: raw_data_uri
    logicalType: string
    physicalType: STRING
    required: false
    description: Pointer to source evidence in Bronze (ack payload, CV crop, audit record), outside ORDM.
  - name: ingest_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When the observation arrived in the lakehouse (UTC).
  - name: record_source
    logicalType: string
    physicalType: STRING
    required: false
    description: Originating system of record (vendor-neutral label).
  - name: load_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When this row was loaded (UTC).
  quality:
  - name: eslp_grain_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: eslp_grain_unique
    query: SELECT esl_price_observation_id, COUNT(*) AS n FROM connected_store_signals.esl_price_observation
      GROUP BY esl_price_observation_id HAVING COUNT(*) > 1
  - name: eslp_source_identity_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: eslp_source_identity_unique
    query: 'SELECT esl_label_id, observation_source, source_observation_id, COUNT(*) AS n

      FROM connected_store_signals.esl_price_observation

      GROUP BY esl_label_id, observation_source, source_observation_id

      HAVING COUNT(*) > 1'
  - name: eslp_sk_collision
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: eslp_sk_collision
    query: 'SELECT esl_price_observation_sk, COUNT(DISTINCT esl_price_observation_id) AS durable_id_count

      FROM connected_store_signals.esl_price_observation

      GROUP BY esl_price_observation_sk

      HAVING COUNT(DISTINCT esl_price_observation_id) > 1'
  - name: eslp_keys_not_null
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: eslp_keys_not_null
    query: SELECT * FROM connected_store_signals.esl_price_observation WHERE esl_price_observation_sk
      IS NULL OR esl_price_observation_id IS NULL OR source_observation_id IS NULL OR esl_label_id IS
      NULL OR store_id IS NULL OR observed_at_ts IS NULL OR utc_offset_minutes IS NULL OR trading_date
      IS NULL OR observation_source IS NULL OR sensing_derived_input_flag IS NULL
  - name: eslp_binding_reference_consistent
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: eslp_binding_reference_consistent
    query: "SELECT * FROM connected_store_signals.esl_price_observation\nWHERE (esl_label_assignment_sk\
      \ IS NULL AND esl_label_assignment_id IS NOT NULL)\n   OR (esl_label_assignment_sk IS NOT NULL AND\
      \ esl_label_assignment_id IS NULL)\n   OR (esl_label_assignment_sk IS NULL AND\n       (product_sk\
      \ IS NOT NULL OR product_id IS NOT NULL\n        OR store_zone_sk IS NOT NULL OR store_zone_id IS\
      \ NOT NULL))\n   OR (esl_label_assignment_sk IS NOT NULL AND\n       (product_sk IS NULL OR product_id\
      \ IS NULL\n        OR store_zone_sk IS NULL OR store_zone_id IS NULL))"
  - name: eslp_record_source_present
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: eslp_record_source_present
    query: 'SELECT * FROM connected_store_signals.esl_price_observation

      WHERE price_of_record IS NOT NULL AND price_of_record_source IS NULL'
  - name: eslp_record_source_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: eslp_record_source_domain
    query: "SELECT * FROM connected_store_signals.esl_price_observation\nWHERE price_of_record_source\
      \ IS NOT NULL\n  AND price_of_record_source NOT IN ('pricing_platform', 'product_price', 'pos_system',\
      \ 'scale_plu', 'manual')"
  - name: eslp_sensing_flag_false
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: eslp_sensing_flag_false
    query: SELECT * FROM connected_store_signals.esl_price_observation WHERE sensing_derived_input_flag
      <> FALSE
  - name: eslp_label_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: eslp_label_fk_orphan
    query: SELECT o.* FROM connected_store_signals.esl_price_observation o LEFT JOIN connected_store_signals.esl_label
      l ON o.esl_label_sk = l.esl_label_sk WHERE o.esl_label_sk IS NOT NULL AND l.esl_label_sk IS NULL
  - name: eslp_assignment_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: eslp_assignment_fk_orphan
    query: SELECT o.* FROM connected_store_signals.esl_price_observation o LEFT JOIN connected_store_signals.esl_label_assignment
      a ON o.esl_label_assignment_sk = a.esl_label_assignment_sk WHERE o.esl_label_assignment_sk IS NOT
      NULL AND a.esl_label_assignment_sk IS NULL
  - name: eslp_product_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: eslp_product_fk_orphan
    query: SELECT o.* FROM connected_store_signals.esl_price_observation o LEFT JOIN product.product p
      ON o.product_sk = p.product_sk WHERE o.product_sk IS NOT NULL AND p.product_sk IS NULL
  - name: eslp_store_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: eslp_store_fk_orphan
    query: SELECT o.* FROM connected_store_signals.esl_price_observation o LEFT JOIN store.store s ON
      o.store_sk = s.store_sk WHERE o.store_sk IS NOT NULL AND s.store_sk IS NULL
  - name: eslp_zone_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: eslp_zone_fk_orphan
    query: SELECT o.* FROM connected_store_signals.esl_price_observation o LEFT JOIN connected_store_signals.store_zone
      z ON o.store_zone_sk = z.store_zone_sk WHERE o.store_zone_sk IS NOT NULL AND z.store_zone_sk IS
      NULL
  - name: eslp_reference_key_agreement
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: eslp_reference_key_agreement
    query: "SELECT o.esl_price_observation_id\nFROM connected_store_signals.esl_price_observation o\n\
      JOIN connected_store_signals.esl_label l ON o.esl_label_sk = l.esl_label_sk\nJOIN store.store s\
      \ ON o.store_sk = s.store_sk\nLEFT JOIN connected_store_signals.esl_label_assignment a\n  ON o.esl_label_assignment_sk\
      \ = a.esl_label_assignment_sk\nLEFT JOIN product.product p ON o.product_sk = p.product_sk\nLEFT\
      \ JOIN connected_store_signals.store_zone z ON o.store_zone_sk = z.store_zone_sk\nWHERE o.esl_label_id\
      \ <> l.esl_label_id\n   OR o.store_id <> s.store_id\n   OR (o.esl_label_assignment_sk IS NOT NULL\n\
      \       AND o.esl_label_assignment_id <> a.esl_label_assignment_id)\n   OR (o.product_sk IS NOT\
      \ NULL AND o.product_id <> p.product_id)\n   OR (o.store_zone_sk IS NOT NULL AND o.store_zone_id\
      \ <> z.store_zone_id)"
  - name: eslp_match_consistency
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: eslp_match_consistency
    query: "SELECT * FROM connected_store_signals.esl_price_observation\nWHERE (is_price_match IS NOT\
      \ NULL\n       AND (displayed_price IS NULL\n            OR price_of_record IS NULL\n          \
      \  OR displayed_currency_code IS NULL\n            OR price_of_record_currency_code IS NULL\n  \
      \          OR displayed_currency_code <> price_of_record_currency_code))\n   OR (is_price_match\
      \ = TRUE  AND displayed_price <> price_of_record)\n   OR (is_price_match = FALSE AND displayed_price\
      \ = price_of_record)"
  - name: eslp_price_of_record_currency
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: eslp_price_of_record_currency
    query: "SELECT * FROM connected_store_signals.esl_price_observation\nWHERE (price_of_record IS NULL\
      \ AND price_of_record_currency_code IS NOT NULL)\n   OR (price_of_record IS NOT NULL AND price_of_record_currency_code\
      \ IS NULL)\n   OR (displayed_price IS NOT NULL AND price_of_record IS NOT NULL\n       AND (displayed_currency_code\
      \ IS NULL\n            OR price_of_record_currency_code IS NULL\n            OR displayed_currency_code\
      \ <> price_of_record_currency_code))"
  - name: eslp_single_currency
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: eslp_single_currency
    query: "SELECT 'esl_price_observation' AS table_name, COUNT(DISTINCT currency_code) AS currencies\n\
      FROM (\n  SELECT displayed_currency_code AS currency_code\n  FROM connected_store_signals.esl_price_observation\
      \ WHERE displayed_price IS NOT NULL\n  UNION ALL\n  SELECT price_of_record_currency_code AS currency_code\n\
      \  FROM connected_store_signals.esl_price_observation WHERE price_of_record IS NOT NULL\n)\nHAVING\
      \ COUNT(DISTINCT currency_code) > 1\n    OR COUNT(CASE WHEN currency_code IS NULL THEN 1 END) >\
      \ 0"
  - name: eslp_sync_latency_ack_only
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: eslp_sync_latency_ack_only
    query: 'SELECT * FROM connected_store_signals.esl_price_observation

      WHERE display_sync_latency_seconds IS NOT NULL AND observation_source <> ''platform_ack'''
  - name: eslp_sync_latency_agreement
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: eslp_sync_latency_agreement
    query: "SELECT * FROM connected_store_signals.esl_price_observation\nWHERE display_sync_latency_seconds\
      \ IS NOT NULL\n  AND (price_of_record_effective_ts IS NULL\n       OR display_sync_latency_seconds\
      \ <>\n          unix_timestamp(observed_at_ts) - unix_timestamp(price_of_record_effective_ts))"
  - name: eslp_disclosure_text_implies_indicator
    type: sql
    dimension: accuracy
    severity: warning
    mustBe: 0
    unit: rows
    description: eslp_disclosure_text_implies_indicator
    query: 'SELECT * FROM connected_store_signals.esl_price_observation

      WHERE displayed_disclosure_text IS NOT NULL AND COALESCE(displayed_disclosure_indicator, FALSE)
      = FALSE'
  - name: eslp_time_agreement
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: eslp_time_agreement
    query: "SELECT * FROM connected_store_signals.esl_price_observation\nWHERE utc_offset_minutes IS NOT\
      \ NULL\n  AND trading_date <> date_from_unix_date(\n        CAST(FLOOR((unix_timestamp(observed_at_ts)\
      \ + utc_offset_minutes * 60) / 86400) AS INT))"
  - name: eslp_binding_denorm_consistent
    type: sql
    dimension: accuracy
    severity: warning
    mustBe: 0
    unit: rows
    description: eslp_binding_denorm_consistent
    query: "SELECT o.esl_price_observation_id, o.product_id AS observed_product, a.product_id AS binding_product,\n\
      \       o.store_zone_id AS observed_zone, a.store_zone_id AS binding_zone\nFROM connected_store_signals.esl_price_observation\
      \ o\nJOIN connected_store_signals.esl_label_assignment a\n  ON o.esl_label_assignment_sk = a.esl_label_assignment_sk\n\
      WHERE o.esl_label_id <> a.esl_label_id\n   OR o.store_id <> a.store_id\n   OR o.product_id <> a.product_id\n\
      \   OR o.store_zone_id <> a.store_zone_id\n   OR o.observed_at_ts < a.valid_from_ts\n   OR (a.valid_to_ts\
      \ IS NOT NULL AND o.observed_at_ts >= a.valid_to_ts)"
  - name: eslp_ack_cv_disagreement
    type: sql
    dimension: accuracy
    severity: info
    description: eslp_ack_cv_disagreement
    query: "SELECT COUNT(*) AS disagreeing_label_days\nFROM (\n  SELECT esl_label_id, trading_date\n \
      \ FROM connected_store_signals.esl_price_observation\n  WHERE observation_source IN ('platform_ack',\
      \ 'shelf_cv') AND displayed_price IS NOT NULL\n  GROUP BY esl_label_id, trading_date\n  HAVING COUNT(DISTINCT\
      \ observation_source) = 2 AND COUNT(DISTINCT displayed_price) > 1\n)"
- name: evaluation_rule
  physicalName: connected_store_signals.evaluation_rule
  physicalType: table
  description: Connected Store Signals -- threshold framework for the automation loop (SCD2). A standing
    condition on a sensor observed property that fires automation_action rows.
  tags:
  - master
  authoritativeDefinitions:
  - url: outcome-packages/connected-store-signals/README.md
    type: businessDefinition
  - url: outcome-packages/connected-store-signals/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: evaluation_rule_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Surrogate key. Unique per SCD2 version.
  - name: evaluation_rule_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable natural/business key for the rule. Stable across SCD2 versions as the threshold
      is retuned.
  - name: sensor_device_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to sensor_device.sensor_device_sk -- the observing device whose readings this rule
      evaluates. NULL for a rule that evaluates a cross-device aggregate.
    relationships:
    - to: sensor_device.sensor_device_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: connected_store_signals
      - property: enforced
        value: false
  - name: sensor_device_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable device id. The SCD2-safe join key.
  - name: rule_name
    logicalType: string
    physicalType: STRING
    required: false
    description: Human-readable rule name, e.g. "Vaccine fridge over 8C for 10 minutes".
  - name: report_type
    logicalType: string
    physicalType: STRING
    required: false
    description: 'GS1 CBV sensor-property CURIE the rule watches, matching sensor_report_interval.report_type.
      Allowed values: gs1:Count, gs1:Temperature, gs1:RelativeHumidity, gs1:Power, gs1:Energy, gs1:Mass,
      gs1:Illuminance, gs1:VolumeFraction.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: gs1:Count, gs1:Temperature, gs1:RelativeHumidity, gs1:Power, gs1:Energy,
        gs1:Mass, gs1:Illuminance, gs1:VolumeFraction.'
  - name: condition_operator
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Comparison applied to the observed value. Allowed values: greater_than, greater_than_or_equal,
      less_than, less_than_or_equal, equal, not_equal, outside_range, inside_range.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: greater_than, greater_than_or_equal, less_than, less_than_or_equal,
        equal, not_equal, outside_range, inside_range.'
  - name: threshold_value_numeric
    logicalType: number
    physicalType: DOUBLE
    required: false
    description: 'Threshold the observed value is compared against, in the rule unit. NULL for a purely
      categorical rule. DOUBLE, not DECIMAL: this is a non-monetary continuous physical quantity (temperature,
      humidity, power) compared directly against sensor_report_interval.value, which is DOUBLE -- matching
      the two avoids precision/comparison surprises, and DECIMAL(18,x) is reserved for stored money (standards
      §A.6).'
  - name: threshold_value_upper
    logicalType: number
    physicalType: DOUBLE
    required: false
    description: Upper bound for the inside_range / outside_range operators; NULL otherwise. threshold_value_numeric
      is the lower bound in that case. DOUBLE for the same reason as threshold_value_numeric.
  - name: unit_iri
    logicalType: string
    physicalType: STRING
    required: false
    description: QUDT unit IRI for the threshold, e.g. http://qudt.org/vocab/unit/DEG_C. NULL for a dimensionless
      (count) rule.
  - name: uom_code
    logicalType: string
    physicalType: STRING
    required: false
    description: UN/CEFACT Recommendation 20 common code for the threshold unit, e.g. CEL. The interchange
      form of unit_iri.
  - name: time_window_seconds
    logicalType: integer
    physicalType: INT
    required: false
    description: 'Sustained-breach window in seconds: the condition must hold this long before the rule
      fires, which debounces a single transient reading. 0 means fire on the first breaching observation.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: CHECK (time_window_seconds IS NULL OR time_window_seconds >= 0).
  - name: severity
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Operational severity of a breach. Allowed values: info, warning, critical.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: info, warning, critical.'
  - name: is_enabled
    logicalType: boolean
    physicalType: BOOLEAN
    required: false
    description: TRUE if the rule is live. Replaces the source CHAR(1) Y/N flag with a native BOOLEAN
      per strict-typing (standards §A.6).
  - name: effective_from_date
    logicalType: date
    physicalType: DATE
    required: true
    description: 'SCD2: inclusive start date this version became effective.'
  - name: effective_to_date
    logicalType: date
    physicalType: DATE
    required: false
    description: 'SCD2: exclusive end date; NULL for the current version.'
  - name: is_current
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: 'SCD2: TRUE for the currently active version.'
  - name: created_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When the record was created in the source system (UTC, ISO 8601).
  - name: source_updated_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When the record was last modified in the source system (UTC, ISO 8601).
  - name: record_source
    logicalType: string
    physicalType: STRING
    required: false
    description: Originating system of record (vendor-neutral label).
  - name: load_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When this row was loaded (UTC, ISO 8601).
  quality:
  - name: er_grain_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: er_grain_unique
    query: SELECT evaluation_rule_id, effective_from_date, COUNT(*) AS n FROM connected_store_signals.evaluation_rule
      GROUP BY evaluation_rule_id, effective_from_date HAVING COUNT(*) > 1
  - name: er_keys_not_null
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: er_keys_not_null
    query: SELECT * FROM connected_store_signals.evaluation_rule WHERE evaluation_rule_sk IS NULL OR evaluation_rule_id
      IS NULL OR effective_from_date IS NULL OR is_current IS NULL
  - name: er_single_current
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: er_single_current
    query: SELECT evaluation_rule_id, COUNT(*) AS n FROM connected_store_signals.evaluation_rule WHERE
      is_current = TRUE GROUP BY evaluation_rule_id HAVING COUNT(*) > 1
  - name: er_device_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: er_device_fk_orphan
    query: SELECT r.* FROM connected_store_signals.evaluation_rule r LEFT JOIN connected_store_signals.sensor_device
      d ON r.sensor_device_sk = d.sensor_device_sk WHERE r.sensor_device_sk IS NOT NULL AND d.sensor_device_sk
      IS NULL
- name: execution_log
  physicalName: connected_store_signals.execution_log
  physicalType: table
  description: Connected Store Signals -- append-only audit ledger of realised automation firings. Closes
    the sense -> evaluate -> act loop back to the observation that triggered it.
  tags:
  - transactional
  authoritativeDefinitions:
  - url: outcome-packages/connected-store-signals/README.md
    type: businessDefinition
  - url: outcome-packages/connected-store-signals/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: execution_log_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Surrogate key for the execution event.
  - name: execution_log_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable natural/business key for the execution event, from the source automation platform.
      Identifies the FIRING (the action that ran against its triggering observation), not merely the observation
      -- one breaching interval can fire several actions, so a key scoped to the interval alone would
      collide and defeat the one-row-per-firing grain (el_grain_unique).
  - name: automation_action_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to automation_action.automation_action_sk -- the action version that fired. NULL when
      the action has been retired (the log row outlives it).
    relationships:
    - to: automation_action.automation_action_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: connected_store_signals
      - property: enforced
        value: false
  - name: automation_action_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable action id. The SCD2-safe join key.
  - name: actuator_capability_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to actuator_capability.actuator_capability_sk -- the actuator the command hit. NULL
      for a non-actuator action (notification, webhook) or a retired actuator.
    relationships:
    - to: actuator_capability.actuator_capability_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: connected_store_signals
      - property: enforced
        value: false
  - name: actuator_capability_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable actuator id. The SCD2-safe join key. NULL for non-actuator actions.
  - name: evaluation_rule_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to evaluation_rule.evaluation_rule_sk -- the rule version whose breach triggered this
      run. Denormalised onto the fact so "which rule caused this action" survives the retirement of automation_action.
    relationships:
    - to: evaluation_rule.evaluation_rule_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: connected_store_signals
      - property: enforced
        value: false
  - name: evaluation_rule_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable rule id. The SCD2-safe join key.
  - name: sensor_report_interval_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to sensor_report_interval.sensor_report_interval_sk -- the reading interval that breached
      the rule, closing the loop back to the observation that caused the action. NULL if the trigger was
      not a single canonical interval.
    relationships:
    - to: sensor_report_interval.sensor_report_interval_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: connected_store_signals
      - property: enforced
        value: false
  - name: triggered_at_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: true
    description: When the action fired (UTC, ISO 8601). The ordering key for the ledger.
  - name: execution_status
    logicalType: string
    physicalType: STRING
    required: true
    description: 'Outcome of the run. Allowed values: success, failure, pending, timeout, skipped.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: success, failure, pending, timeout, skipped.'
  - name: response_payload
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Rendered response from the target, e.g. {"status_code": 200, "message": "Actuator triggered
      successfully"}. The realised counterpart to automation_action.payload_template.'
  - name: latency_ms
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: Milliseconds between the triggering observation and this execution. Feeds automation
      responsiveness monitoring.
    quality:
    - type: text
      dimension: validity
      severity: error
      description: CHECK (latency_ms IS NULL OR latency_ms >= 0).
  - name: record_source
    logicalType: string
    physicalType: STRING
    required: false
    description: Originating system of record (vendor-neutral label).
  - name: load_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When this row was loaded (UTC, ISO 8601).
  quality:
  - name: el_grain_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: el_grain_unique
    query: SELECT execution_log_id, COUNT(*) AS n FROM connected_store_signals.execution_log GROUP BY
      execution_log_id HAVING COUNT(*) > 1
  - name: el_keys_not_null
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: el_keys_not_null
    query: SELECT * FROM connected_store_signals.execution_log WHERE execution_log_sk IS NULL OR execution_log_id
      IS NULL OR triggered_at_timestamp IS NULL OR execution_status IS NULL
  - name: el_action_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: el_action_fk_orphan
    query: SELECT l.* FROM connected_store_signals.execution_log l LEFT JOIN connected_store_signals.automation_action
      a ON l.automation_action_sk = a.automation_action_sk WHERE l.automation_action_sk IS NOT NULL AND
      a.automation_action_sk IS NULL
  - name: el_actuator_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: el_actuator_fk_orphan
    query: SELECT l.* FROM connected_store_signals.execution_log l LEFT JOIN connected_store_signals.actuator_capability
      c ON l.actuator_capability_sk = c.actuator_capability_sk WHERE l.actuator_capability_sk IS NOT NULL
      AND c.actuator_capability_sk IS NULL
  - name: el_rule_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: el_rule_fk_orphan
    query: SELECT l.* FROM connected_store_signals.execution_log l LEFT JOIN connected_store_signals.evaluation_rule
      r ON l.evaluation_rule_sk = r.evaluation_rule_sk WHERE l.evaluation_rule_sk IS NOT NULL AND r.evaluation_rule_sk
      IS NULL
  - name: el_interval_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: el_interval_fk_orphan
    query: SELECT l.* FROM connected_store_signals.execution_log l LEFT JOIN connected_store_signals.sensor_report_interval
      f ON l.sensor_report_interval_sk = f.sensor_report_interval_sk WHERE l.sensor_report_interval_sk
      IS NOT NULL AND f.sensor_report_interval_sk IS NULL
- name: foot_traffic_interval_detail
  physicalName: connected_store_signals.foot_traffic_interval_detail
  physicalType: table
  description: Connected Store Signals -- one-to-one Foot Traffic measures for a canonical sensor report
    interval.
  tags:
  - transactional
  authoritativeDefinitions:
  - url: outcome-packages/connected-store-signals/README.md
    type: businessDefinition
  - url: outcome-packages/connected-store-signals/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: sensor_report_interval_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: PK and FK to sensor_report_interval.sensor_report_interval_sk. Exactly one detail row
      is required for each gs1:Count interval.
    relationships:
    - to: sensor_report_interval.sensor_report_interval_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: connected_store_signals
      - property: enforced
        value: false
  - name: footfall_count
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: Headline footfall for the interval at the envelope aggregation_level.
    quality:
    - type: text
      dimension: validity
      severity: error
      description: CHECK ((footfall_count IS NULL OR footfall_count >= 0) AND (entry_count IS NULL OR
        entry_count >= 0) AND (exit_count IS NULL OR exit_count >= 0) AND (dwell_seconds_total IS NULL
        OR dwell_seconds_total >= 0) AND (dwell_count IS NULL OR dwell_count >= 0)).
  - name: entry_count
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: Measured entries.
  - name: exit_count
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: Measured exits. NULL, never zero, for a non-directional device.
  - name: passersby_count
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: Pass-by traffic interpreted per passby_convention.
  - name: unique_visitor_count
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: De-duplicated visitors where supported. Not additive across intervals.
  - name: is_zero_observed
    logicalType: boolean
    physicalType: BOOLEAN
    required: false
    description: TRUE for a measured zero, distinct from an absent row or offline source.
  - name: counting_unit
    logicalType: string
    physicalType: STRING
    required: false
    description: 'What one count represents: person, group, device, or object.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: person, group, device, object.'
  - name: group_counting_enabled
    logicalType: boolean
    physicalType: BOOLEAN
    required: false
    description: TRUE when family or shopping groups are counted as one.
  - name: unique_visitor_enabled
    logicalType: boolean
    physicalType: BOOLEAN
    required: false
    description: TRUE when repeat entries in the configured window are de-duplicated.
  - name: child_counting_enabled
    logicalType: boolean
    physicalType: BOOLEAN
    required: false
    description: TRUE when children are counted.
  - name: child_height_threshold_cm
    logicalType: integer
    physicalType: INT
    required: false
    description: Effective height threshold separating child from adult.
  - name: staff_exclusion_enabled
    logicalType: boolean
    physicalType: BOOLEAN
    required: false
    description: TRUE when staff are excluded from the published operational footfall.
  - name: directionality
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Allowed values: bidirectional, unidirectional, none.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: bidirectional, unidirectional, none.'
  - name: count_divisor
    logicalType: integer
    physicalType: INT
    required: false
    description: Configured beam-count divisor; never assume a fixed value.
  - name: passby_convention
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Allowed values: includes_entrants, excludes_entrants.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: includes_entrants, excludes_entrants.'
  - name: visitor_count_raw
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: Count before staff adjustment.
  - name: staff_count
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: Staff detections identified in the interval.
  - name: child_count
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: Child detections; a subset of footfall_count.
  - name: visitor_count_adjusted
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: Count after staff adjustment.
  - name: staff_adjustment_applied
    logicalType: boolean
    physicalType: BOOLEAN
    required: false
    description: TRUE when an adjustment was applied to this row.
  - name: staff_exclusion_method
    logicalType: string
    physicalType: STRING
    required: false
    description: Method used to exclude staff.
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: none, exclusion_line, zone_button, patterned_tag, fabric_tag, uniform_ml,
        reidentification, fixed_count_subtraction, scaling_factor.'
  - name: staff_exclusion_stage
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Allowed values: none, at_sensor, at_aggregation.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: none, at_sensor, at_aggregation.'
  - name: staff_exclusion_grade
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Published accuracy band: high, medium, or low.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: high, medium, low.'
  - name: occupancy_snapshot_end
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: 'Occupancy at interval end. Semi-additive: take the latest value.'
  - name: occupancy_min
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: Minimum occupancy observed in the interval.
  - name: occupancy_max
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: Maximum occupancy observed in the interval.
  - name: occupancy_avg
    logicalType: number
    physicalType: DOUBLE
    required: false
    description: Mean occupancy in the interval. Roll up weighted by interval duration.
  - name: cumulative_entries
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: Running entries since the most recent reset.
  - name: cumulative_exits
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: Running exits since the most recent reset.
  - name: occupancy_adjustment
    logicalType: integer
    physicalType: INT
    required: false
    description: Signed manual or reconciliation correction.
  - name: adjustment_source
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Allowed values: manual, reset, reconciliation, vendor_correction.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: manual, reset, reconciliation, vendor_correction.'
  - name: last_reset_local_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: Source-local timestamp of the most recent cumulative-counter reset.
  - name: dwell_seconds_total
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: Sum of dwell seconds across observations; the re-aggregatable numerator.
  - name: dwell_count
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: Number of dwell observations; the re-aggregatable denominator.
  - name: engaged_count
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: Dwell observations at or above the configured engagement threshold.
  - name: passing_count
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: Dwell observations below the configured engagement threshold.
  - name: engagement_threshold_seconds
    logicalType: integer
    physicalType: INT
    required: false
    description: Threshold separating engaged and passing dwell observations.
  quality:
  - name: ftid_nondirectional_exits_null
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: ftid_nondirectional_exits_null
    query: "SELECT t.* FROM connected_store_signals.foot_traffic_interval_detail t\nJOIN connected_store_signals.sensor_report_interval\
      \ f\n  ON f.sensor_report_interval_sk = t.sensor_report_interval_sk\nWHERE f.report_type = 'gs1:Count'\
      \ AND t.directionality = 'none' AND t.exit_count IS NOT NULL"
  - name: ftid_staff_adjustment_balances
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: ftid_staff_adjustment_balances
    query: "SELECT * FROM connected_store_signals.foot_traffic_interval_detail\nWHERE staff_adjustment_applied\
      \ = TRUE\n  AND visitor_count_raw IS NOT NULL\n  AND staff_count IS NOT NULL\n  AND visitor_count_adjusted\
      \ IS NOT NULL\n  AND visitor_count_adjusted <> visitor_count_raw - staff_count"
  - name: ftid_child_subset
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: ftid_child_subset
    query: SELECT * FROM connected_store_signals.foot_traffic_interval_detail WHERE child_count IS NOT
      NULL AND footfall_count IS NOT NULL AND child_count > footfall_count
  - name: ftid_occupancy_nonnegative
    type: sql
    dimension: accuracy
    severity: warning
    mustBe: 0
    unit: rows
    description: ftid_occupancy_nonnegative
    query: SELECT * FROM connected_store_signals.foot_traffic_interval_detail WHERE occupancy_snapshot_end
      IS NOT NULL AND occupancy_snapshot_end < 0
  - name: ftid_occupancy_balance
    type: sql
    dimension: accuracy
    severity: warning
    mustBe: 0
    unit: rows
    description: ftid_occupancy_balance
    query: "SELECT * FROM connected_store_signals.foot_traffic_interval_detail\nWHERE occupancy_snapshot_end\
      \ IS NOT NULL AND cumulative_entries IS NOT NULL AND cumulative_exits IS NOT NULL\n  AND occupancy_snapshot_end\
      \ <> cumulative_entries - cumulative_exits + COALESCE(occupancy_adjustment, 0)"
  - name: ftid_dwell_denominator_present
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: ftid_dwell_denominator_present
    query: SELECT * FROM connected_store_signals.foot_traffic_interval_detail WHERE dwell_seconds_total
      IS NOT NULL AND dwell_seconds_total > 0 AND (dwell_count IS NULL OR dwell_count = 0)
  - name: ftid_interval_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: ftid_interval_fk_orphan
    query: SELECT t.* FROM connected_store_signals.foot_traffic_interval_detail t LEFT JOIN connected_store_signals.sensor_report_interval
      f ON t.sensor_report_interval_sk = f.sensor_report_interval_sk WHERE f.sensor_report_interval_sk
      IS NULL
- name: rfid_count_session
  physicalName: connected_store_signals.rfid_count_session
  physicalType: table
  description: Connected Store Signals bounded RFID count-session header; coverage and census are derived
    from linked read events.
  tags:
  - transactional
  authoritativeDefinitions:
  - url: outcome-packages/connected-store-signals/README.md
    type: businessDefinition
  - url: outcome-packages/connected-store-signals/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: rfid_count_session_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Surrogate key for the bounded RFID count session.
  - name: rfid_count_session_id
    logicalType: string
    physicalType: STRING
    required: true
    description: 'Durable key: store_id|source_session_id.'
  - name: source_session_id
    logicalType: string
    physicalType: STRING
    required: true
    description: 'Source session identifier. For fixed windows without one: count_method|primary sensor_device_id
      or _ALL|unix_timestamp(started_at_ts).'
  - name: store_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    description: FK to store.store_sk.
    relationships:
    - to: store.store_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: store
      - property: enforced
        value: false
  - name: store_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable store business key.
  - name: primary_sensor_device_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: Nullable FK to the initiating or primary sensor_device version. The complete device set
      derives from events.
    relationships:
    - to: sensor_device.sensor_device_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: connected_store_signals
      - property: enforced
        value: false
  - name: primary_sensor_device_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable id of the initiating or primary device.
  - name: count_method
    logicalType: string
    physicalType: STRING
    required: true
    description: 'RFID count method. Allowed values: handheld_sweep, fixed_window, robot_sweep.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: handheld_sweep, fixed_window, robot_sweep.'
  - name: scope_type
    logicalType: string
    physicalType: STRING
    required: true
    description: Representable scope claim. full_store has a derivable zone plan; partial makes no plan
      claim.
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: full_store, partial.'
  - name: started_at_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: true
    description: Session start as a UTC instant.
  - name: ended_at_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: true
    description: Session end as a UTC instant.
    quality:
    - type: text
      dimension: validity
      severity: error
      description: CHECK (ended_at_ts >= started_at_ts).
  - name: store_timezone
    logicalType: string
    physicalType: STRING
    required: false
    description: IANA store timezone used to derive trading_date and hour_of_day.
  - name: utc_offset_minutes
    logicalType: integer
    physicalType: SMALLINT
    required: true
    description: Store UTC offset in minutes at started_at_ts.
  - name: trading_date
    logicalType: date
    physicalType: DATE
    required: true
    description: Business date of the session start; logical join to fiscal_calendar.date_key, enforced
      by rcs_calendar_orphan.
  - name: hour_of_day
    logicalType: integer
    physicalType: TINYINT
    required: false
    description: Store-local hour at session start, 0 through 23.
    quality:
    - type: text
      dimension: validity
      severity: error
      description: CHECK (hour_of_day IS NULL OR hour_of_day BETWEEN 0 AND 23).
  - name: raw_data_uri
    logicalType: string
    physicalType: STRING
    required: false
    description: Optional pointer to the source session manifest in Bronze.
  - name: ingest_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When the session header arrived in the lakehouse (UTC).
  - name: record_source
    logicalType: string
    physicalType: STRING
    required: false
    description: Originating system of record (vendor-neutral label).
  - name: load_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When this row was loaded (UTC).
  quality:
  - name: rcs_grain_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: rcs_grain_unique
    query: 'SELECT rfid_count_session_id, COUNT(*) AS n

      FROM connected_store_signals.rfid_count_session

      GROUP BY rfid_count_session_id

      HAVING COUNT(*) > 1'
  - name: rcs_keys_not_null
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: rcs_keys_not_null
    query: 'SELECT *

      FROM connected_store_signals.rfid_count_session

      WHERE rfid_count_session_sk IS NULL OR rfid_count_session_id IS NULL'
  - name: rcs_durable_id_wellformed
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: rcs_durable_id_wellformed
    query: 'SELECT *

      FROM connected_store_signals.rfid_count_session

      WHERE rfid_count_session_id <> concat(store_id, ''|'', source_session_id)'
  - name: rcs_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: rcs_fk_orphan
    query: "SELECT s.*\nFROM connected_store_signals.rfid_count_session s\nLEFT JOIN store.store st ON\
      \ s.store_sk = st.store_sk\nLEFT JOIN connected_store_signals.sensor_device d\n  ON s.primary_sensor_device_sk\
      \ = d.sensor_device_sk\nWHERE st.store_sk IS NULL\n   OR st.store_id <> s.store_id\n   OR (s.primary_sensor_device_sk\
      \ IS NULL) <> (s.primary_sensor_device_id IS NULL)\n   OR (s.primary_sensor_device_sk IS NOT NULL\
      \ AND (\n         d.sensor_device_sk IS NULL OR d.sensor_device_id <> s.primary_sensor_device_id\n\
      \       ))"
  - name: rcs_zero_events
    type: sql
    dimension: accuracy
    severity: warning
    mustBe: 0
    unit: rows
    description: rcs_zero_events
    query: "SELECT s.rfid_count_session_id, s.store_id, s.ended_at_ts\nFROM connected_store_signals.rfid_count_session\
      \ s\nLEFT JOIN connected_store_signals.rfid_read_event e\n  ON s.rfid_count_session_sk = e.rfid_count_session_sk\n\
      GROUP BY s.rfid_count_session_id, s.store_id, s.ended_at_ts\nHAVING COUNT(e.rfid_read_event_sk)\
      \ = 0"
  - name: rcs_calendar_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: rcs_calendar_orphan
    query: "SELECT s.rfid_count_session_id, s.trading_date\nFROM connected_store_signals.rfid_count_session\
      \ s\nLEFT JOIN calendar.fiscal_calendar c\n  ON s.trading_date = c.date_key\nWHERE c.date_key IS\
      \ NULL"
- name: rfid_read_event
  physicalName: connected_store_signals.rfid_read_event
  physicalType: table
  description: Connected Store Signals append-only EPCIS ObjectEvent-shaped RFID visibility fact at EPC
    × reader × second grain.
  tags:
  - transactional
  authoritativeDefinitions:
  - url: outcome-packages/connected-store-signals/README.md
    type: businessDefinition
  - url: outcome-packages/connected-store-signals/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: rfid_read_event_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: 'Surrogate join key: xxhash64(rfid_read_event_id). The durable id is authoritative and
      collision-guarded.'
  - name: rfid_read_event_id
    logicalType: string
    physicalType: STRING
    required: true
    description: 'Durable grain key: tagged_item_id|unix_timestamp(event_ts)|sensor_device_id.'
  - name: tagged_item_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: Nullable FK to tagged_item. NULL only for an explicitly unregistered EPC.
    relationships:
    - to: tagged_item.tagged_item_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: connected_store_signals
      - property: enforced
        value: false
  - name: tagged_item_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Observed EPC Pure Identity URI, including for unregistered EPCs.
  - name: is_unregistered_epc
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: TRUE when the observed EPC has no commissioned tagged_item registry row.
  - name: product_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: Product version resolved at write. NULL only for an unregistered or unresolved EPC.
    relationships:
    - to: product.product_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: product
      - property: enforced
        value: false
  - name: product_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable product business key resolved at write.
  - name: store_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    description: FK to the store version in effect at event time.
    relationships:
    - to: store.store_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: store
      - property: enforced
        value: false
  - name: store_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable store business key.
  - name: store_zone_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    description: FK to the event-level read-point zone version.
    relationships:
    - to: store_zone.store_zone_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: connected_store_signals
      - property: enforced
        value: false
  - name: store_zone_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable event-level read-point zone id.
  - name: sensor_device_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    description: FK to the reader device version in effect at event time.
    relationships:
    - to: sensor_device.sensor_device_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: connected_store_signals
      - property: enforced
        value: false
  - name: sensor_device_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable reader device business key.
  - name: sensing_deployment_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    description: FK to the governing sensing deployment version.
    relationships:
    - to: sensing_deployment.sensing_deployment_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: connected_store_signals
      - property: enforced
        value: false
  - name: sensing_deployment_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable sensing deployment business key.
  - name: rfid_count_session_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: Nullable FK to rfid_count_session for count-bound reads.
    relationships:
    - to: rfid_count_session.rfid_count_session_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: connected_store_signals
      - property: enforced
        value: false
  - name: rfid_count_session_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable count-session key. NULL for free reads.
  - name: shipment_line_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: Nullable FK to shipment_line when a receiving read carries an EPCIS business-transaction
      association.
    relationships:
    - to: shipment_line.shipment_line_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: logistics
      - property: enforced
        value: false
  - name: shipment_line_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable shipment-line business key. NULL for reads outside a receiving association.
  - name: event_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: true
    description: Business event time as a UTC instant.
  - name: first_seen_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: true
    description: First raw ping in the upstream collapse window (UTC).
    quality:
    - type: text
      dimension: validity
      severity: error
      description: CHECK (first_seen_ts <= event_ts AND event_ts <= last_seen_ts).
  - name: last_seen_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: true
    description: Last raw ping in the upstream collapse window (UTC); its business context wins.
  - name: store_timezone
    logicalType: string
    physicalType: STRING
    required: false
    description: IANA store timezone used to derive local business fields.
  - name: utc_offset_minutes
    logicalType: integer
    physicalType: SMALLINT
    required: true
    description: Store UTC offset in minutes at event_ts.
  - name: trading_date
    logicalType: date
    physicalType: DATE
    required: true
    description: Business date of event_ts. Logical join to fiscal_calendar.date_key.
  - name: hour_of_day
    logicalType: integer
    physicalType: TINYINT
    required: false
    description: Store-local event hour, 0 through 23.
    quality:
    - type: text
      dimension: validity
      severity: error
      description: CHECK (hour_of_day IS NULL OR hour_of_day BETWEEN 0 AND 23).
  - name: biz_step_uri
    logicalType: string
    physicalType: STRING
    required: false
    description: Full GS1 CBV business-step URI from the supported RFID subset.
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: https://ref.gs1.org/cbv/BizStep-commissioning, https://ref.gs1.org/cbv/BizStep-receiving,
        https://ref.gs1.org/cbv/BizStep-stocking, https://ref.gs1.org/cbv/BizStep-storing, https://ref.gs1.org/cbv/BizStep-retail_selling,
        https://ref.gs1.org/cbv/BizStep-cycle_counting, https://ref.gs1.org/cbv/BizStep-stock_taking,
        https://ref.gs1.org/cbv/BizStep-shipping, https://ref.gs1.org/cbv/BizStep-staging_outbound, https://ref.gs1.org/cbv/BizStep-inspecting,
        https://ref.gs1.org/cbv/BizStep-killing, https://ref.gs1.org/cbv/BizStep-decommissioning.'
  - name: disposition_uri
    logicalType: string
    physicalType: STRING
    required: false
    description: Full GS1 CBV disposition URI from the supported RFID subset.
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: https://ref.gs1.org/cbv/Disp-sellable_accessible, https://ref.gs1.org/cbv/Disp-sellable_not_accessible,
        https://ref.gs1.org/cbv/Disp-in_transit, https://ref.gs1.org/cbv/Disp-retail_sold, https://ref.gs1.org/cbv/Disp-damaged,
        https://ref.gs1.org/cbv/Disp-expired, https://ref.gs1.org/cbv/Disp-recalled, https://ref.gs1.org/cbv/Disp-stolen,
        https://ref.gs1.org/cbv/Disp-unavailable, https://ref.gs1.org/cbv/Disp-unknown.'
  - name: zone_source
    logicalType: string
    physicalType: STRING
    required: true
    description: 'How the read-point zone was resolved: device_placement, operator_declared, platform_localization.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: device_placement, operator_declared, platform_localization.'
  - name: direction_code
    logicalType: string
    physicalType: STRING
    required: true
    description: 'Observed movement direction: in, out, unknown, not_applicable.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: in, out, unknown, not_applicable.'
  - name: direction_confidence
    logicalType: number
    physicalType: DOUBLE
    required: false
    description: Directional attribution confidence in [0,1]. NULL when direction is not applicable.
    quality:
    - type: text
      dimension: validity
      severity: error
      description: CHECK ((direction_confidence IS NULL OR direction_confidence BETWEEN 0 AND 1) AND attribution_confidence
        BETWEEN 0 AND 1).
  - name: attribution_confidence
    logicalType: number
    physicalType: DOUBLE
    required: true
    description: Confidence in assigning the RF read to the stated read point, in [0,1].
  - name: is_stray_suspect
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: TRUE when RF bleed makes location attribution suspect; excluded from presence gold.
  - name: antenna_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Winning reader antenna identifier; provenance detail, not a separate registry.
  - name: read_count
    logicalType: integer
    physicalType: BIGINT
    required: true
    description: Number of raw RF pings collapsed into this visibility event.
    quality:
    - type: text
      dimension: validity
      severity: error
      description: CHECK (read_count > 0 AND (duplicate_delivery_count IS NULL OR duplicate_delivery_count
        >= 0)).
  - name: duplicate_delivery_count
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: Duplicate source deliveries suppressed for this event.
  - name: rssi_peak_dbm
    logicalType: number
    physicalType: DOUBLE
    required: false
    description: Peak received signal strength in dBm across collapsed pings.
  - name: raw_data_uri
    logicalType: string
    physicalType: STRING
    required: false
    description: Pointer to raw RF-ping evidence in Bronze.
  - name: ingest_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: true
    description: When the event arrived in the lakehouse (UTC); may be much later than event_ts for offline
      readers.
  - name: record_source
    logicalType: string
    physicalType: STRING
    required: false
    description: Originating system of record (vendor-neutral label).
  - name: load_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When this row was loaded (UTC).
  quality:
  - name: rre_grain_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: rre_grain_unique
    query: 'SELECT rfid_read_event_id, COUNT(*) AS n

      FROM connected_store_signals.rfid_read_event

      GROUP BY rfid_read_event_id

      HAVING COUNT(*) > 1'
  - name: rre_sk_collision
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: rre_sk_collision
    query: 'SELECT rfid_read_event_sk, COUNT(DISTINCT rfid_read_event_id) AS durable_id_count

      FROM connected_store_signals.rfid_read_event

      GROUP BY rfid_read_event_sk

      HAVING COUNT(DISTINCT rfid_read_event_id) > 1'
  - name: rre_durable_id_wellformed
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: rre_durable_id_wellformed
    query: "SELECT *\nFROM connected_store_signals.rfid_read_event\nWHERE rfid_read_event_id <>\n    \
      \  concat(tagged_item_id, '|', unix_timestamp(event_ts), '|', sensor_device_id)"
  - name: rre_registration_pairing
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: rre_registration_pairing
    query: "SELECT e.*\nFROM connected_store_signals.rfid_read_event e\nLEFT JOIN connected_store_signals.tagged_item\
      \ i\n  ON e.tagged_item_sk = i.tagged_item_sk\nWHERE (e.is_unregistered_epc = TRUE AND (\n     \
      \    e.tagged_item_sk IS NOT NULL OR e.product_sk IS NOT NULL OR e.product_id IS NOT NULL\n    \
      \   ))\n   OR (e.is_unregistered_epc = FALSE AND (\n         e.tagged_item_sk IS NULL\n        \
      \ OR i.tagged_item_sk IS NULL\n         OR (e.product_sk IS NULL) <> (e.product_id IS NULL)\n  \
      \       OR (i.epc_scheme = 'sgtin' AND (\n              e.product_sk IS NULL\n              OR e.product_sk\
      \ <> i.product_sk\n              OR e.product_id <> i.product_id\n            ))\n       ))"
  - name: rre_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: rre_fk_orphan
    query: "SELECT e.*\nFROM connected_store_signals.rfid_read_event e\nLEFT JOIN connected_store_signals.tagged_item\
      \ i ON e.tagged_item_sk = i.tagged_item_sk\nLEFT JOIN product.product p ON e.product_sk = p.product_sk\n\
      LEFT JOIN store.store st ON e.store_sk = st.store_sk\nLEFT JOIN connected_store_signals.store_zone\
      \ z ON e.store_zone_sk = z.store_zone_sk\nLEFT JOIN connected_store_signals.sensor_device d ON e.sensor_device_sk\
      \ = d.sensor_device_sk\nLEFT JOIN connected_store_signals.sensing_deployment dep\n  ON e.sensing_deployment_sk\
      \ = dep.sensing_deployment_sk\nLEFT JOIN connected_store_signals.rfid_count_session s\n  ON e.rfid_count_session_sk\
      \ = s.rfid_count_session_sk\nLEFT JOIN logistics.shipment_line sl\n  ON e.shipment_line_sk = sl.shipment_line_sk\n\
      WHERE (e.tagged_item_sk IS NOT NULL AND (\n         i.tagged_item_sk IS NULL OR i.tagged_item_id\
      \ <> e.tagged_item_id\n       ))\n   OR (e.product_sk IS NOT NULL AND (\n         p.product_sk IS\
      \ NULL OR p.product_id <> e.product_id\n       ))\n   OR st.store_sk IS NULL OR st.store_id <> e.store_id\n\
      \   OR z.store_zone_sk IS NULL OR z.store_zone_id <> e.store_zone_id\n   OR d.sensor_device_sk IS\
      \ NULL OR d.sensor_device_id <> e.sensor_device_id\n   OR dep.sensing_deployment_sk IS NULL\n  \
      \ OR dep.sensing_deployment_id <> e.sensing_deployment_id\n   OR (e.rfid_count_session_sk IS NULL)\
      \ <> (e.rfid_count_session_id IS NULL)\n   OR (e.rfid_count_session_sk IS NOT NULL AND (\n     \
      \    s.rfid_count_session_sk IS NULL\n         OR s.rfid_count_session_id <> e.rfid_count_session_id\n\
      \         OR s.store_id <> e.store_id\n       ))\n   OR (e.shipment_line_sk IS NULL) <> (e.shipment_line_id\
      \ IS NULL)\n   OR (e.shipment_line_sk IS NOT NULL AND (\n         sl.shipment_line_sk IS NULL\n\
      \         OR sl.shipment_line_id <> e.shipment_line_id\n         OR sl.product_id <> e.product_id\n\
      \       ))"
  - name: rre_calendar_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: rre_calendar_orphan
    query: "SELECT e.rfid_read_event_id, e.trading_date\nFROM connected_store_signals.rfid_read_event\
      \ e\nLEFT JOIN calendar.fiscal_calendar c\n  ON e.trading_date = c.date_key\nWHERE c.date_key IS\
      \ NULL"
  - name: rre_session_integrity
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: rre_session_integrity
    query: "SELECT e.rfid_read_event_id, e.rfid_count_session_id\nFROM connected_store_signals.rfid_read_event\
      \ e\nJOIN connected_store_signals.rfid_count_session s\n  ON e.rfid_count_session_sk = s.rfid_count_session_sk\n\
      WHERE e.store_id <> s.store_id\n   OR e.event_ts < s.started_at_ts - INTERVAL 5 MINUTES\n   OR e.event_ts\
      \ > s.ended_at_ts + INTERVAL 5 MINUTES"
  - name: rre_header_before_event
    type: sql
    dimension: accuracy
    severity: warning
    mustBe: 0
    unit: rows
    description: rre_header_before_event
    query: "SELECT e.rfid_read_event_id, e.ingest_timestamp, s.ingest_timestamp AS session_ingest_timestamp\n\
      FROM connected_store_signals.rfid_read_event e\nJOIN connected_store_signals.rfid_count_session\
      \ s\n  ON e.rfid_count_session_sk = s.rfid_count_session_sk\nWHERE s.ingest_timestamp IS NOT NULL\n\
      \  AND e.ingest_timestamp < s.ingest_timestamp"
  - name: rre_zone_source_honesty
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: rre_zone_source_honesty
    query: "SELECT e.rfid_read_event_id, e.zone_source, d.is_mobile_platform\nFROM connected_store_signals.rfid_read_event\
      \ e\nJOIN connected_store_signals.sensor_device d ON e.sensor_device_sk = d.sensor_device_sk\nWHERE\
      \ (d.is_mobile_platform = TRUE\n       AND e.zone_source NOT IN ('operator_declared', 'platform_localization'))\n\
      \   OR (COALESCE(d.is_mobile_platform, FALSE) = FALSE\n       AND e.zone_source <> 'device_placement')"
  - name: rre_directionality_consistent
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: rre_directionality_consistent
    query: "SELECT e.rfid_read_event_id, e.direction_code, e.direction_confidence\nFROM connected_store_signals.rfid_read_event\
      \ e\nJOIN connected_store_signals.sensor_device d ON e.sensor_device_sk = d.sensor_device_sk\nWHERE\
      \ COALESCE(d.is_directional, FALSE) = FALSE\n  AND (e.direction_code <> 'not_applicable' OR e.direction_confidence\
      \ IS NOT NULL)"
  - name: rre_retail_sold_context
    type: sql
    dimension: accuracy
    severity: warning
    mustBe: 0
    unit: rows
    description: rre_retail_sold_context
    query: "SELECT e.rfid_read_event_id, e.store_zone_id, z.zone_code, z.zone_type\nFROM connected_store_signals.rfid_read_event\
      \ e\nLEFT JOIN connected_store_signals.store_zone z\n  ON e.store_zone_sk = z.store_zone_sk\nWHERE\
      \ e.disposition_uri = 'https://ref.gs1.org/cbv/Disp-retail_sold'\n  AND NOT (\n    lower(COALESCE(z.zone_code,\
      \ '')) = 'checkout'\n    OR z.zone_type IN ('entrance', 'perimeter')\n  )"
  - name: rre_event_not_future
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: rre_event_not_future
    query: 'SELECT *

      FROM connected_store_signals.rfid_read_event

      WHERE event_ts > current_timestamp() + INTERVAL 5 MINUTES'
  - name: rre_before_commission
    type: sql
    dimension: accuracy
    severity: warning
    mustBe: 0
    unit: rows
    description: rre_before_commission
    query: 'SELECT e.rfid_read_event_id, e.event_ts, i.commissioned_at_ts

      FROM connected_store_signals.rfid_read_event e

      JOIN connected_store_signals.tagged_item i ON e.tagged_item_sk = i.tagged_item_sk

      WHERE e.event_ts < i.commissioned_at_ts'
  - name: rre_post_kill_reads
    type: sql
    dimension: accuracy
    severity: info
    description: rre_post_kill_reads
    query: "WITH killed AS (\n  SELECT tagged_item_id, MIN(event_ts) AS killed_at_ts\n  FROM connected_store_signals.rfid_read_event\n\
      \  WHERE biz_step_uri = 'https://ref.gs1.org/cbv/BizStep-killing'\n  GROUP BY tagged_item_id\n)\n\
      SELECT e.store_id, e.tagged_item_id, COUNT(*) AS post_kill_read_count\nFROM connected_store_signals.rfid_read_event\
      \ e\nJOIN killed k ON e.tagged_item_id = k.tagged_item_id\nWHERE e.event_ts > k.killed_at_ts\nGROUP\
      \ BY e.store_id, e.tagged_item_id"
  - name: rre_unregistered_epc_rate
    type: sql
    dimension: accuracy
    severity: warning
    mustBe: 0
    unit: rows
    description: rre_unregistered_epc_rate
    query: "SELECT store_id, trading_date,\n       SUM(CASE WHEN is_unregistered_epc THEN 1 ELSE 0 END)\
      \ / NULLIF(COUNT(*), 0) AS unregistered_epc_rate\nFROM connected_store_signals.rfid_read_event\n\
      GROUP BY store_id, trading_date\nHAVING SUM(CASE WHEN is_unregistered_epc THEN 1 ELSE 0 END) / NULLIF(COUNT(*),\
      \ 0) > 0.05"
  - name: rre_delivery_quality
    type: sql
    dimension: accuracy
    severity: info
    description: rre_delivery_quality
    query: "SELECT store_id, trading_date,\n       SUM(COALESCE(duplicate_delivery_count, 0)) AS duplicate_deliveries,\n\
      \       percentile_approx(timestampdiff(SECOND, event_ts, ingest_timestamp), 0.95) AS arrival_lag_seconds_p95\n\
      FROM connected_store_signals.rfid_read_event\nGROUP BY store_id, trading_date"
- name: sensing_deployment
  physicalName: connected_store_signals.sensing_deployment
  physicalType: table
  description: Connected Store Signals -- governance dimension for in-store sensing deployments (SCD2).
    ADR 0031.
  tags:
  - master
  authoritativeDefinitions:
  - url: outcome-packages/connected-store-signals/README.md
    type: businessDefinition
  - url: outcome-packages/connected-store-signals/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: sensing_deployment_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Surrogate key. Unique per SCD2 version.
  - name: sensing_deployment_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable natural/business key for the deployment.
  - name: store_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to store.store_sk.
    relationships:
    - to: store.store_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: store
      - property: enforced
        value: false
  - name: store_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable store business key.
  - name: deployment_name
    logicalType: string
    physicalType: STRING
    required: false
    description: Human-readable deployment name, e.g. "Front-of-store thermal counters, UK estate".
  - name: sensing_method_code
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Sensing technology -- the legal analysis differs per method. Allowed values: ir_beam,
      thermal, video_cv, stereo_vision, time_of_flight, wifi_probe, ble_probe, rfid, weight, door_contact,
      environmental.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: ir_beam, thermal, video_cv, stereo_vision, time_of_flight, wifi_probe,
        ble_probe, rfid, weight, door_contact, environmental.'
  - name: sensing_purpose_code
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Declared purpose. Allowed values: people_counting, occupancy_safety, queue_management,
      layout_optimisation, cold_chain_compliance, shelf_availability, asset_tracking, energy_management.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: people_counting, occupancy_safety, queue_management, layout_optimisation,
        cold_chain_compliance, shelf_availability, asset_tracking, energy_management.'
  - name: lawful_basis_code
    logicalType: string
    physicalType: STRING
    required: false
    description: 'GDPR Art. 6 basis or equivalent. Allowed values: legitimate_interest, consent, legal_obligation,
      vital_interest, not_personal_data.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: legitimate_interest, consent, legal_obligation, vital_interest, not_personal_data.'
  - name: jurisdiction_code
    logicalType: string
    physicalType: STRING
    required: false
    description: ISO 3166-1 alpha-2 country, or country-subdivision for state-level regimes (e.g. US-IL
      for BIPA, US-TX for CUBI).
  - name: dpia_completed_flag
    logicalType: boolean
    physicalType: BOOLEAN
    required: false
    description: TRUE if a data protection impact assessment has been completed for this deployment.
  - name: dpia_reference
    logicalType: string
    physicalType: STRING
    required: false
    description: Pointer to the DPIA artefact (document id or URI).
  - name: dpia_covers_employees_flag
    logicalType: boolean
    physicalType: BOOLEAN
    required: false
    description: TRUE if the DPIA explicitly assessed risks to employees, not only customers.
  - name: dpia_review_due_date
    logicalType: date
    physicalType: DATE
    required: false
    description: 'When the DPIA must be reassessed. EDPB 02/2026: anonymity is not a one-time determination.'
  - name: signage_posted_flag
    logicalType: boolean
    physicalType: BOOLEAN
    required: false
    description: TRUE if on-premises notice is posted at every point of entry to the sensed area.
  - name: ai_act_notice_status
    logicalType: string
    physicalType: STRING
    required: false
    description: 'AI Act Art. 50(3) deployer notice status. Allowed values: not_applicable, required_posted,
      required_not_posted.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: not_applicable, required_posted, required_not_posted.'
  - name: works_council_consulted_flag
    logicalType: boolean
    physicalType: BOOLEAN
    required: false
    description: TRUE if employee representatives were consulted before deployment, where the jurisdiction
      requires it.
  - name: consultation_reference
    logicalType: string
    physicalType: STRING
    required: false
    description: Pointer to the consultation record (document id or URI).
  - name: consent_required_flag
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Whether the method requires consent. Allowed values: required, not_required, under_review.
      TRUE-equivalent (required) for wifi_probe and ble_probe.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: required, not_required, under_review.'
  - name: optout_mechanism_code
    logicalType: string
    physicalType: STRING
    required: false
    description: 'How a data subject objects. Allowed values: none, signage_contact, in_store_kiosk, web_portal,
      not_applicable.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: none, signage_contact, in_store_kiosk, web_portal, not_applicable.'
  - name: retention_days_max
    logicalType: integer
    physicalType: INT
    required: false
    description: Maximum retention for personal data from this deployment, in days. A ceiling, not an
      entitlement.
    quality:
    - type: text
      dimension: validity
      severity: error
      description: CHECK (retention_days_max IS NULL OR retention_days_max > 0).
  - name: retention_basis
    logicalType: string
    physicalType: STRING
    required: false
    description: Why this retention -- the statutory or policy source.
  - name: staff_exclusion_method
    logicalType: string
    physicalType: STRING
    required: false
    description: 'How staff are excluded. Allowed values: none, exclusion_line, zone_button, patterned_tag,
      fabric_tag, uniform_ml, reidentification, fixed_count_subtraction, scaling_factor.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: none, exclusion_line, zone_button, patterned_tag, fabric_tag, uniform_ml,
        reidentification, fixed_count_subtraction, scaling_factor.'
  - name: staff_exclusion_stage
    logicalType: string
    physicalType: STRING
    required: false
    description: 'WHERE exclusion is applied -- without this you cannot tell whether a received number
      was already corrected, so double-correction is inevitable. Allowed values: none, at_sensor, at_aggregation.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: none, at_sensor, at_aggregation.'
  - name: external_disclosure_policy_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK lineage to the policy version current when this deployment version was written; shared
      views resolve controls through the durable id and fact date.
    relationships:
    - to: sensing_disclosure_policy.sensing_disclosure_policy_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: connected_store_signals
      - property: enforced
        value: false
  - name: external_disclosure_policy_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable disclosure-policy id for SCD2-safe resolution.
  - name: deployment_status
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Allowed values: planned, active, suspended, decommissioned.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: planned, active, suspended, decommissioned.'
  - name: deployed_date
    logicalType: date
    physicalType: DATE
    required: false
    description: When sensing began at this deployment.
  - name: decommissioned_date
    logicalType: date
    physicalType: DATE
    required: false
    description: When sensing ceased. NULL while active.
  - name: effective_from_date
    logicalType: date
    physicalType: DATE
    required: true
    description: 'SCD2: inclusive start date this version became effective.'
  - name: effective_to_date
    logicalType: date
    physicalType: DATE
    required: false
    description: 'SCD2: exclusive end date; NULL for the current version.'
  - name: is_current
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: 'SCD2: TRUE for the currently active version.'
  - name: created_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When the record was created in the source system (UTC, ISO 8601).
  - name: source_updated_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When the record was last modified in the source system (UTC, ISO 8601).
  - name: record_source
    logicalType: string
    physicalType: STRING
    required: false
    description: Originating system of record (vendor-neutral label).
  - name: load_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When this row was loaded (UTC, ISO 8601).
  quality:
  - name: sdep_grain_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sdep_grain_unique
    query: SELECT sensing_deployment_id, effective_from_date, COUNT(*) AS n FROM connected_store_signals.sensing_deployment
      GROUP BY sensing_deployment_id, effective_from_date HAVING COUNT(*) > 1
  - name: sdep_keys_not_null
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sdep_keys_not_null
    query: SELECT * FROM connected_store_signals.sensing_deployment WHERE sensing_deployment_sk IS NULL
      OR sensing_deployment_id IS NULL OR effective_from_date IS NULL OR is_current IS NULL
  - name: sdep_single_current
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sdep_single_current
    query: SELECT sensing_deployment_id, COUNT(*) AS n FROM connected_store_signals.sensing_deployment
      WHERE is_current = TRUE GROUP BY sensing_deployment_id HAVING COUNT(*) > 1
  - name: sdep_dpia_before_active
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sdep_dpia_before_active
    query: 'SELECT * FROM connected_store_signals.sensing_deployment

      WHERE is_current = TRUE AND deployment_status = ''active'' AND lawful_basis_code <> ''not_personal_data''
      AND COALESCE(dpia_completed_flag, FALSE) = FALSE'
  - name: sdep_dpia_covers_employees
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sdep_dpia_covers_employees
    query: 'SELECT * FROM connected_store_signals.sensing_deployment

      WHERE is_current = TRUE AND deployment_status = ''active'' AND staff_exclusion_method NOT IN (''none'')
      AND COALESCE(dpia_covers_employees_flag, FALSE) = FALSE'
  - name: sdep_consultation_recorded
    type: sql
    dimension: accuracy
    severity: warning
    mustBe: 0
    unit: rows
    description: sdep_consultation_recorded
    query: "SELECT * FROM connected_store_signals.sensing_deployment\nWHERE is_current = TRUE AND deployment_status\
      \ = 'active' AND staff_exclusion_method NOT IN ('none')\n  AND jurisdiction_code IN ('DE', 'FR',\
      \ 'IT', 'PL', 'NL', 'ES', 'AT', 'BE')\n  AND COALESCE(works_council_consulted_flag, FALSE) = FALSE"
  - name: sdep_ai_act_notice_posted
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sdep_ai_act_notice_posted
    query: 'SELECT * FROM connected_store_signals.sensing_deployment

      WHERE is_current = TRUE AND deployment_status = ''active'' AND ai_act_notice_status = ''required_not_posted''
      AND current_date() >= DATE''2026-08-02'''
  - name: sdep_signage_posted
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sdep_signage_posted
    query: 'SELECT * FROM connected_store_signals.sensing_deployment

      WHERE is_current = TRUE AND deployment_status = ''active'' AND lawful_basis_code <> ''not_personal_data''
      AND COALESCE(signage_posted_flag, FALSE) = FALSE'
  - name: sdep_optout_operable
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sdep_optout_operable
    query: 'SELECT * FROM connected_store_signals.sensing_deployment

      WHERE is_current = TRUE AND deployment_status = ''active'' AND consent_required_flag = ''required''
      AND optout_mechanism_code IN (''none'')'
  - name: sdep_retention_ceiling_present
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sdep_retention_ceiling_present
    query: 'SELECT * FROM connected_store_signals.sensing_deployment

      WHERE is_current = TRUE AND deployment_status = ''active'' AND lawful_basis_code <> ''not_personal_data''
      AND retention_days_max IS NULL'
  - name: sdep_dpia_review_due
    type: sql
    dimension: accuracy
    severity: warning
    mustBe: 0
    unit: rows
    description: sdep_dpia_review_due
    query: SELECT * FROM connected_store_signals.sensing_deployment WHERE is_current = TRUE AND deployment_status
      = 'active' AND dpia_review_due_date IS NOT NULL AND dpia_review_due_date < current_date()
  - name: sdep_store_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sdep_store_fk_orphan
    query: SELECT p.* FROM connected_store_signals.sensing_deployment p LEFT JOIN store.store s ON p.store_sk
      = s.store_sk WHERE p.store_sk IS NOT NULL AND s.store_sk IS NULL
  - name: sdep_external_policy_present
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sdep_external_policy_present
    query: "SELECT * FROM connected_store_signals.sensing_deployment\nWHERE is_current = TRUE\n  AND deployment_status\
      \ = 'active'\n  AND sensing_purpose_code IN ('people_counting', 'occupancy_safety', 'queue_management',\
      \ 'layout_optimisation')\n  AND (\n    external_disclosure_policy_sk IS NULL\n    OR external_disclosure_policy_id\
      \ IS NULL\n  )"
  - name: sdep_disclosure_policy_key_pair
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sdep_disclosure_policy_key_pair
    query: "SELECT d.sensing_deployment_id\nFROM connected_store_signals.sensing_deployment d\nJOIN connected_store_signals.sensing_disclosure_policy\
      \ p\n  ON d.external_disclosure_policy_sk = p.sensing_disclosure_policy_sk\nWHERE d.external_disclosure_policy_id\
      \ IS NULL\n   OR d.external_disclosure_policy_id <> p.sensing_disclosure_policy_id"
  - name: sdep_disclosure_policy_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sdep_disclosure_policy_orphan
    query: "SELECT d.sensing_deployment_id\nFROM connected_store_signals.sensing_deployment d\nLEFT JOIN\
      \ connected_store_signals.sensing_disclosure_policy p\n  ON d.external_disclosure_policy_sk = p.sensing_disclosure_policy_sk\n\
      WHERE d.external_disclosure_policy_sk IS NOT NULL\n  AND p.sensing_disclosure_policy_sk IS NULL"
- name: sensing_disclosure_policy
  physicalName: connected_store_signals.sensing_disclosure_policy
  physicalType: table
  description: Connected Store Signals -- effective-dated disclosure policy for explicit shared projections.
  tags:
  - master
  authoritativeDefinitions:
  - url: outcome-packages/connected-store-signals/README.md
    type: businessDefinition
  - url: outcome-packages/connected-store-signals/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: sensing_disclosure_policy_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Surrogate key for this effective-dated policy version.
  - name: sensing_disclosure_policy_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable policy business key.
  - name: audience_code
    logicalType: string
    physicalType: STRING
    required: true
    description: Intended disclosure audience, such as external or partner.
  - name: k_threshold
    logicalType: integer
    physicalType: INT
    required: true
    description: Minimum count published to this audience. Zero disables below-k suppression so suppress_zero_flag
      can govern measured zeros independently.
    quality:
    - type: text
      dimension: validity
      severity: error
      description: CHECK (k_threshold >= 0).
  - name: suppress_zero_flag
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: TRUE when measured zero cells are suppressed for this audience.
  - name: minimum_interval_minutes
    logicalType: integer
    physicalType: INT
    required: true
    description: Minimum publishable time window. Finer canonical rows must be aggregated before threshold
      evaluation.
    quality:
    - type: text
      dimension: validity
      severity: error
      description: CHECK (minimum_interval_minutes > 0).
  - name: effective_from_date
    logicalType: date
    physicalType: DATE
    required: true
    description: Inclusive policy-effective date.
  - name: effective_to_date
    logicalType: date
    physicalType: DATE
    required: false
    description: Exclusive policy-effective date; NULL for current.
    quality:
    - type: text
      dimension: validity
      severity: error
      description: CHECK (effective_to_date IS NULL OR effective_to_date > effective_from_date).
  - name: is_current
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: TRUE for the current policy version.
  - name: policy_basis
    logicalType: string
    physicalType: STRING
    required: false
    description: Governance or policy basis for the configured disclosure controls.
  - name: record_source
    logicalType: string
    physicalType: STRING
    required: false
    description: Originating system of record.
  - name: load_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When this policy version was loaded (UTC).
  quality:
  - name: shared_minimum_interval_granularity
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: shared_minimum_interval_granularity
    query: "SELECT *\nFROM connected_store_signals.sensing_disclosure_policy\nWHERE is_current = TRUE\n\
      \  AND minimum_interval_minutes > 1440"
  - name: sdp_grain_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sdp_grain_unique
    query: SELECT sensing_disclosure_policy_id, effective_from_date, COUNT(*) AS n FROM connected_store_signals.sensing_disclosure_policy
      GROUP BY sensing_disclosure_policy_id, effective_from_date HAVING COUNT(*) > 1
  - name: sdp_keys_not_null
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sdp_keys_not_null
    query: SELECT * FROM connected_store_signals.sensing_disclosure_policy WHERE sensing_disclosure_policy_sk
      IS NULL OR sensing_disclosure_policy_id IS NULL OR audience_code IS NULL OR effective_from_date
      IS NULL OR is_current IS NULL
  - name: sdp_single_current
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sdp_single_current
    query: SELECT sensing_disclosure_policy_id, COUNT(*) AS n FROM connected_store_signals.sensing_disclosure_policy
      WHERE is_current = TRUE GROUP BY sensing_disclosure_policy_id HAVING COUNT(*) > 1
  - name: sdp_valid_controls
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sdp_valid_controls
    query: "SELECT * FROM connected_store_signals.sensing_disclosure_policy\nWHERE k_threshold < 0\n \
      \  OR minimum_interval_minutes <= 0"
  - name: sdp_effective_window_overlap
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sdp_effective_window_overlap
    query: "SELECT a.sensing_disclosure_policy_id, a.sensing_disclosure_policy_sk AS left_sk,\n      \
      \ b.sensing_disclosure_policy_sk AS right_sk\nFROM connected_store_signals.sensing_disclosure_policy\
      \ a\nJOIN connected_store_signals.sensing_disclosure_policy b\n  ON a.sensing_disclosure_policy_id\
      \ = b.sensing_disclosure_policy_id\n AND a.sensing_disclosure_policy_sk < b.sensing_disclosure_policy_sk\n\
      \ AND a.effective_from_date < COALESCE(b.effective_to_date, DATE'9999-12-31')\n AND b.effective_from_date\
      \ < COALESCE(a.effective_to_date, DATE'9999-12-31')"
- name: sensor_device
  physicalName: connected_store_signals.sensor_device
  physicalType: table
  description: Connected Store Signals -- physical sensing/actuating device registry (SCD2), anchored
    on Brick 1.4.4 + QUDT.
  tags:
  - master
  authoritativeDefinitions:
  - url: outcome-packages/connected-store-signals/README.md
    type: businessDefinition
  - url: outcome-packages/connected-store-signals/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: sensor_device_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Surrogate key. Unique per SCD2 version.
  - name: sensor_device_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable natural/business key for the device. Stable across SCD2 versions and across firmware
      upgrades.
  - name: store_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to store.store_sk.
    relationships:
    - to: store.store_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: store
      - property: enforced
        value: false
  - name: store_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable store business key.
  - name: store_zone_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to store_zone.store_zone_sk -- where the device is installed.
    relationships:
    - to: store_zone.store_zone_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: connected_store_signals
      - property: enforced
        value: false
  - name: store_zone_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable zone id. The SCD2-safe join key.
  - name: device_type
    logicalType: string
    physicalType: STRING
    required: false
    description: 'What the device is. Allowed values: people_counter, occupancy_sensor, temperature, humidity,
      co2, illuminance, energy_meter, door_contact, rfid_reader, shelf_sensor, camera, esl_gateway.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: people_counter, occupancy_sensor, temperature, humidity, co2, illuminance,
        energy_meter, door_contact, rfid_reader, shelf_sensor, camera, esl_gateway.'
  - name: sensing_technology
    logicalType: string
    physicalType: STRING
    required: false
    description: 'How it senses -- drives the accuracy and privacy profile. Allowed values: ir_beam, thermal,
      video_cv, stereo_vision, time_of_flight, wifi_probe, ble_probe, rfid_uhf, load_cell, thermistor,
      thermocouple, ndir, contact.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: ir_beam, thermal, video_cv, stereo_vision, time_of_flight, wifi_probe,
        ble_probe, rfid_uhf, load_cell, thermistor, thermocouple, ndir, contact.'
  - name: device_role
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Allowed values: sense, actuate, both. ESL gateways actuate; counters sense.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: sense, actuate, both.'
  - name: manufacturer
    logicalType: string
    physicalType: STRING
    required: false
    description: Device manufacturer.
  - name: model
    logicalType: string
    physicalType: STRING
    required: false
    description: Device model designation.
  - name: serial_number
    logicalType: string
    physicalType: STRING
    required: false
    description: Manufacturer serial number.
  - name: firmware_version
    logicalType: string
    physicalType: STRING
    required: false
    description: Current firmware version. Changes here are a common cause of a step change in counting
      behaviour, so it is versioned via SCD2.
  - name: is_directional
    logicalType: boolean
    physicalType: BOOLEAN
    required: false
    description: TRUE if the device distinguishes entry from exit. FALSE means exit_count must be NULL,
      never 0.
  - name: supports_dwell
    logicalType: boolean
    physicalType: BOOLEAN
    required: false
    description: TRUE if the device measures dwell time.
  - name: supports_occupancy
    logicalType: boolean
    physicalType: BOOLEAN
    required: false
    description: TRUE if the device reports occupancy directly rather than by entry/exit balance.
  - name: is_mobile_platform
    logicalType: boolean
    physicalType: BOOLEAN
    required: false
    description: TRUE for a reader mounted on a moving handheld or robotic platform. Mobile readers resolve
      event zones from operator declaration or platform localization, not installed device placement.
  - name: detection_limit_count
    logicalType: integer
    physicalType: INT
    required: false
    description: Hardware detection ceiling, where the vendor publishes one. A peak at this value is capped,
      not exact.
  - name: battery_powered
    logicalType: boolean
    physicalType: BOOLEAN
    required: false
    description: TRUE if battery powered -- a capability, not a level. The battery LEVEL is a fast-moving
      measure and belongs on gold_css_device_health, not on an SCD2 dimension.
  - name: brick_class_iri
    logicalType: string
    physicalType: STRING
    required: false
    description: Brick Schema 1.4.4 class IRI, e.g. https://brickschema.org/schema/Brick#Occupancy_Count_Sensor.
  - name: unit_iri
    logicalType: string
    physicalType: STRING
    required: false
    description: QUDT unit IRI for the device native unit, e.g. http://qudt.org/vocab/unit/DEG_C. The
      internal canonical unit reference.
  - name: uom_code
    logicalType: string
    physicalType: STRING
    required: false
    description: UN/CEFACT Recommendation 20 common code for the native unit, e.g. CEL, KWH, WTT, H87,
      P1. The interchange form.
  - name: bacnet_device_id
    logicalType: string
    physicalType: STRING
    required: false
    description: BACnet device instance, for building-automation-sourced devices (ANSI/ASHRAE 135-2024).
  - name: bacnet_object_ref
    logicalType: string
    physicalType: STRING
    required: false
    description: BACnet object reference, e.g. the Access Zone object (Clause 12.32) backing an occupancy
      count.
  - name: bacnet_out_of_service
    logicalType: boolean
    physicalType: BOOLEAN
    required: false
    description: BACnet Out_Of_Service. When TRUE the Present_Value is SIMULATED -- without carrying this
      you silently ingest fabricated readings during commissioning.
  - name: opc_ua_node_id
    logicalType: string
    physicalType: STRING
    required: false
    description: OPC UA NodeId, for industrial/refrigeration controllers.
  - name: sparkplug_edge_node_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Sparkplug B (ISO/IEC 20237:2023) edge node id. Session identity is (edge_node_id, bdSeq).
  - name: calibration_certificate_id
    logicalType: string
    physicalType: STRING
    required: false
    description: NIST-traceable Certificate of Calibration Testing identifier.
  - name: calibration_valid_from
    logicalType: date
    physicalType: DATE
    required: false
    description: Start of the current calibration validity window.
  - name: calibration_valid_to
    logicalType: date
    physicalType: DATE
    required: false
    description: End of the current calibration validity window. Past-due active devices are flagged by
      sd_calibration_current.
    quality:
    - type: text
      dimension: validity
      severity: error
      description: CHECK (calibration_valid_to IS NULL OR calibration_valid_from IS NULL OR calibration_valid_to
        >= calibration_valid_from).
  - name: accuracy_tolerance
    logicalType: number
    physicalType: DOUBLE
    required: false
    description: Rated accuracy in the device native unit, e.g. 0.5 for +/-0.5 degC. CDC/VFC requires
      +/-0.5 degC for vaccine storage.
    quality:
    - type: text
      dimension: validity
      severity: error
      description: CHECK (accuracy_tolerance IS NULL OR accuracy_tolerance >= 0).
  - name: probe_type
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Allowed values: buffered, air, glycol, surface, none. CDC/VFC requires a BUFFERED probe
      for vaccine storage; an air probe reacts to door openings and produces false excursions.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: buffered, air, glycol, surface, none.'
  - name: is_backup_device
    logicalType: boolean
    physicalType: BOOLEAN
    required: false
    description: TRUE if this is the staggered-calibration backup unit required for vaccine storage.
  - name: sensing_deployment_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to sensing_deployment.sensing_deployment_sk -- the governance record for this installation.
    relationships:
    - to: sensing_deployment.sensing_deployment_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: connected_store_signals
      - property: enforced
        value: false
  - name: sensing_deployment_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable deployment id. The SCD2-safe join key.
  - name: equipment_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to equipment.equipment_sk when the device monitors a maintained asset. NULL for ambient/space
      sensing.
    relationships:
    - to: equipment.equipment_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: equipment
      - property: enforced
        value: false
  - name: equipment_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable equipment business key. NULL for ambient/space sensing.
  - name: device_status
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Allowed values: active, inactive, faulty, maintenance, decommissioned.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: active, inactive, faulty, maintenance, decommissioned.'
  - name: installed_date
    logicalType: date
    physicalType: DATE
    required: false
    description: When the device was installed.
  - name: decommissioned_date
    logicalType: date
    physicalType: DATE
    required: false
    description: When the device was removed. NULL while in service.
  - name: effective_from_date
    logicalType: date
    physicalType: DATE
    required: true
    description: 'SCD2: inclusive start date this version became effective.'
  - name: effective_to_date
    logicalType: date
    physicalType: DATE
    required: false
    description: 'SCD2: exclusive end date; NULL for the current version.'
  - name: is_current
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: 'SCD2: TRUE for the currently active version.'
  - name: created_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When the record was created in the source system (UTC, ISO 8601).
  - name: source_updated_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When the record was last modified in the source system (UTC, ISO 8601).
  - name: record_source
    logicalType: string
    physicalType: STRING
    required: false
    description: Originating system of record (vendor-neutral label).
  - name: load_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When this row was loaded (UTC, ISO 8601).
  quality:
  - name: sd_grain_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sd_grain_unique
    query: SELECT sensor_device_id, effective_from_date, COUNT(*) AS n FROM connected_store_signals.sensor_device
      GROUP BY sensor_device_id, effective_from_date HAVING COUNT(*) > 1
  - name: sd_keys_not_null
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sd_keys_not_null
    query: SELECT * FROM connected_store_signals.sensor_device WHERE sensor_device_sk IS NULL OR sensor_device_id
      IS NULL OR effective_from_date IS NULL OR is_current IS NULL
  - name: sd_single_current
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sd_single_current
    query: SELECT sensor_device_id, COUNT(*) AS n FROM connected_store_signals.sensor_device WHERE is_current
      = TRUE GROUP BY sensor_device_id HAVING COUNT(*) > 1
  - name: sd_deployment_present
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sd_deployment_present
    query: SELECT * FROM connected_store_signals.sensor_device WHERE is_current = TRUE AND device_status
      = 'active' AND sensing_deployment_id IS NULL
  - name: sd_calibration_current
    type: sql
    dimension: accuracy
    severity: warning
    mustBe: 0
    unit: rows
    description: sd_calibration_current
    query: SELECT * FROM connected_store_signals.sensor_device WHERE is_current = TRUE AND device_status
      = 'active' AND calibration_valid_to IS NOT NULL AND calibration_valid_to < current_date()
  - name: sd_vaccine_probe_buffered
    type: sql
    dimension: accuracy
    severity: warning
    mustBe: 0
    unit: rows
    description: sd_vaccine_probe_buffered
    query: SELECT * FROM connected_store_signals.sensor_device WHERE device_type = 'temperature' AND accuracy_tolerance
      IS NOT NULL AND accuracy_tolerance <= 0.5 AND probe_type = 'air'
  - name: sd_out_of_service_not_reporting
    type: sql
    dimension: accuracy
    severity: warning
    mustBe: 0
    unit: rows
    description: sd_out_of_service_not_reporting
    query: 'SELECT d.sensor_device_id, COUNT(*) AS reporting_rows

      FROM connected_store_signals.sensor_device d

      JOIN connected_store_signals.sensor_report_interval f ON f.sensor_device_id = d.sensor_device_id

      WHERE d.is_current = TRUE AND d.bacnet_out_of_service = TRUE AND f.measurement_validity = ''valid''

      GROUP BY d.sensor_device_id'
  - name: sd_zone_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sd_zone_fk_orphan
    query: SELECT d.* FROM connected_store_signals.sensor_device d LEFT JOIN connected_store_signals.store_zone
      z ON d.store_zone_sk = z.store_zone_sk WHERE d.store_zone_sk IS NOT NULL AND z.store_zone_sk IS
      NULL
  - name: sd_store_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sd_store_fk_orphan
    query: SELECT d.* FROM connected_store_signals.sensor_device d LEFT JOIN store.store s ON d.store_sk
      = s.store_sk WHERE d.store_sk IS NOT NULL AND s.store_sk IS NULL
  - name: sd_deployment_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sd_deployment_fk_orphan
    query: SELECT d.* FROM connected_store_signals.sensor_device d LEFT JOIN connected_store_signals.sensing_deployment
      sd ON d.sensing_deployment_sk = sd.sensing_deployment_sk WHERE d.sensing_deployment_sk IS NOT NULL
      AND sd.sensing_deployment_sk IS NULL
  - name: sd_equipment_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sd_equipment_fk_orphan
    query: SELECT d.* FROM connected_store_signals.sensor_device d LEFT JOIN equipment.equipment e ON
      d.equipment_sk = e.equipment_sk WHERE d.equipment_sk IS NOT NULL AND e.equipment_sk IS NULL
- name: sensor_report_interval
  physicalName: connected_store_signals.sensor_report_interval
  physicalType: table
  description: Connected Store Signals -- reusable interval envelope, EPCIS 2.0 sensorReport-shaped and
    discriminated by report_type + subject_type. Type-specific measures use one-to-one extensions. ADR
    0032.
  tags:
  - transactional
  authoritativeDefinitions:
  - url: outcome-packages/connected-store-signals/README.md
    type: businessDefinition
  - url: outcome-packages/connected-store-signals/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: sensor_report_interval_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: 'Surrogate key: xxhash64(sensor_report_interval_id). NOT an identity column -- see ADR
      0028, Hash surrogate keys for high-volume gold event facts. The durable _id is the authoritative
      key; this is a join convenience guarded by sri_sk_collision.'
  - name: sensor_report_interval_id
    logicalType: string
    physicalType: STRING
    required: true
    description: 'Durable grain key: subject_type|subject_id|report_type|aggregation_level|interval_minutes|unix_timestamp(interval_start_ts)|sensor_device_id.
      Every namespace and varying grain component is present. The interval is EPOCH SECONDS, not a rendered
      timestamp: TIMESTAMP is LTZ, so a rendered form would make the durable id depend on the writer session
      timezone and a restatement under a different zone would insert rather than update.'
  - name: subject_type
    logicalType: string
    physicalType: STRING
    required: true
    description: 'What kind of thing was measured. Allowed values: epc, gln, grai, point, space. Foot
      traffic is space.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: epc, gln, grai, point, space.'
  - name: subject_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Identifier of the measured subject, interpreted per subject_type.
  - name: store_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to store.store_sk.
    relationships:
    - to: store.store_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: store
      - property: enforced
        value: false
  - name: store_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable store business key.
  - name: store_zone_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to store_zone.store_zone_sk.
    relationships:
    - to: store_zone.store_zone_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: connected_store_signals
      - property: enforced
        value: false
  - name: store_zone_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable zone id. The SCD2-safe join key (ADR 0025).
  - name: product_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to product.product_sk. NULL for space subjects; populated for item- or shelf-scoped
      reports.
    relationships:
    - to: product.product_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: product
      - property: enforced
        value: false
  - name: product_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable product business key. NULL for space subjects.
  - name: equipment_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to equipment.equipment_sk when the reported subject is a maintained asset (a refrigeration
      case, an HVAC unit). NULL for space subjects and ambient sensing.
    relationships:
    - to: equipment.equipment_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: equipment
      - property: enforced
        value: false
  - name: equipment_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable equipment business key. NULL for space subjects and ambient sensing.
  - name: report_type
    logicalType: string
    physicalType: STRING
    required: true
    description: 'GS1 CBV sensor-property CURIE. Allowed values: gs1:Count, gs1:Temperature, gs1:RelativeHumidity,
      gs1:Power, gs1:Energy, gs1:Mass, gs1:Illuminance, gs1:VolumeFraction. Foot traffic is gs1:Count.
      NOTE there is no CBV type for CO2 -- use gs1:VolumeFraction with the substance identified, never
      an invented air_quality_co2.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: gs1:Count, gs1:Temperature, gs1:RelativeHumidity, gs1:Power, gs1:Energy,
        gs1:Mass, gs1:Illuminance, gs1:VolumeFraction.'
  - name: value
    logicalType: number
    physicalType: DOUBLE
    required: false
    description: The reported value for report_type over the interval.
  - name: min_value
    logicalType: number
    physicalType: DOUBLE
    required: false
    description: EPCIS minValue over the interval.
  - name: max_value
    logicalType: number
    physicalType: DOUBLE
    required: false
    description: EPCIS maxValue over the interval.
  - name: mean_value
    logicalType: number
    physicalType: DOUBLE
    required: false
    description: EPCIS meanValue over the interval.
  - name: s_dev
    logicalType: number
    physicalType: DOUBLE
    required: false
    description: EPCIS sDev. Valid only alongside mean_value (sri_epcis_field_pairing).
  - name: perc_rank
    logicalType: number
    physicalType: DOUBLE
    required: false
    description: EPCIS percRank -- the percentile requested.
  - name: perc_value
    logicalType: number
    physicalType: DOUBLE
    required: false
    description: EPCIS percValue -- the value at perc_rank. Valid only alongside perc_rank.
  - name: string_value
    logicalType: string
    physicalType: STRING
    required: false
    description: EPCIS stringValue, for non-numeric reports.
  - name: boolean_value
    logicalType: boolean
    physicalType: BOOLEAN
    required: false
    description: EPCIS booleanValue, for binary reports such as door open/closed.
  - name: uom
    logicalType: string
    physicalType: STRING
    required: false
    description: UN/CEFACT Recommendation 20 common code, e.g. CEL, KWH, WTT, H87, P1. The interchange
      form.
  - name: unit_iri
    logicalType: string
    physicalType: STRING
    required: false
    description: QUDT unit IRI. The internal canonical unit reference -- UN/CEFACT codes are ambiguous
      across contexts, QUDT is not.
  - name: aggregation_level
    logicalType: string
    physicalType: STRING
    required: true
    description: 'The level this row is measured AT -- never sum across values of this column. Allowed
      values: site, entrance, area, device, subject. A store total requires aggregation_level = site,
      NOT a SUM over area rows.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: site, entrance, area, device, subject.'
  - name: source_observation_count
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: Number of source observations received for this interval. Derived from source cadence
      and delivery completeness, never from the measured value or shopper count.
    quality:
    - type: text
      dimension: validity
      severity: error
      description: CHECK ((source_observation_count IS NULL OR source_observation_count >= 0) AND (expected_observation_count
        IS NULL OR expected_observation_count >= 0)).
  - name: expected_observation_count
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: Number of source observations expected under the effective source cadence for this interval.
  - name: interval_start_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: true
    description: Interval start as a UTC instant. The ONLY safe ordering and join key.
  - name: interval_end_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: Interval end as a UTC instant (EPCIS endTime).
  - name: interval_minutes
    logicalType: integer
    physicalType: INT
    required: true
    description: Canonical interval length in minutes and part of the grain key. A series has one non-overlapping
      cadence; alternate vendor rollups remain outside this additive fact.
    quality:
    - type: text
      dimension: validity
      severity: error
      description: CHECK (interval_minutes > 0).
  - name: store_timezone
    logicalType: string
    physicalType: STRING
    required: false
    description: IANA timezone name, e.g. America/New_York. Not an offset -- the zone, so DST history
      is derivable.
  - name: utc_offset_minutes
    logicalType: integer
    physicalType: SMALLINT
    required: true
    description: 'Offset from UTC in minutes at interval_start_ts, e.g. -240 vs -300. THE DST FIX: it
      makes the autumn fold unambiguous, so the duplicated hour yields two distinct rows instead of colliding
      once a year. No people-counting vendor publishes a DST convention, so this is ours to define.'
  - name: trading_date
    logicalType: date
    physicalType: DATE
    required: true
    description: Business date of the interval. Joins to fiscal_calendar.date_key as a LOGICAL join, not
      an FK -- see relationships.sql.
  - name: trading_day_offset
    logicalType: integer
    physicalType: SMALLINT
    required: false
    description: -1 / 0 / +1. Non-zero for stores trading past midnight, where the calendar date and the
      trading date diverge.
  - name: hour_of_day
    logicalType: integer
    physicalType: INT
    required: false
    description: Local hour 0-23, derived from interval_start_ts + utc_offset_minutes.
  - name: day_part
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Allowed values: pre_open, morning, midday, afternoon, evening, late.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: pre_open, morning, midday, afternoon, evening, late.'
  - name: is_partial_interval
    logicalType: boolean
    physicalType: BOOLEAN
    required: false
    description: TRUE if the interval is not yet closed, or was truncated by opening/closing hours.
  - name: is_dst_transition
    logicalType: boolean
    physicalType: BOOLEAN
    required: false
    description: Convenience flag for the DST fold/gap. No longer load-bearing now that utc_offset_minutes
      is present.
  - name: time_mode
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Allowed values: within_operating_hours, all_day. Vendors expose this per metric rather
      than per feed, so it belongs on the row.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: within_operating_hours, all_day.'
  - name: measurement_validity
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Was the sensor telling the truth. Allowed values: valid, degraded, invalid, imputed.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: valid, degraded, invalid, imputed.'
  - name: arrival_completeness
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Has the data landed. Allowed values: complete, incomplete, late_arrived, precheck.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: complete, incomplete, late_arrived, precheck.'
  - name: is_imputed
    logicalType: boolean
    physicalType: BOOLEAN
    required: false
    description: TRUE if the value was modelled rather than measured. Only one surveyed vendor documents
      that it imputes at all; model it explicitly rather than inheriting it silently.
  - name: uptime_ratio
    logicalType: number
    physicalType: DOUBLE
    required: false
    description: Fraction of the interval the device was online, [0,1].
    quality:
    - type: text
      dimension: validity
      severity: error
      description: CHECK ((uptime_ratio IS NULL OR (uptime_ratio BETWEEN 0 AND 1)) AND (coverage_ratio
        IS NULL OR (coverage_ratio BETWEEN 0 AND 1)) AND (confidence_score IS NULL OR (confidence_score
        BETWEEN 0 AND 1))).
  - name: coverage_ratio
    logicalType: number
    physicalType: DOUBLE
    required: false
    description: Fraction of the subject expected sensors that reported, [0,1].
  - name: confidence_score
    logicalType: number
    physicalType: DOUBLE
    required: false
    description: Vendor or model confidence, [0,1], where supplied.
  - name: sensor_online_flag
    logicalType: boolean
    physicalType: BOOLEAN
    required: false
    description: TRUE if the device was online for the interval.
  - name: is_capped
    logicalType: boolean
    physicalType: BOOLEAN
    required: false
    description: TRUE if the value hit the device detection ceiling. A capped peak is NOT an exact peak.
  - name: capped_count_limit
    logicalType: integer
    physicalType: INT
    required: false
    description: The ceiling that was hit, when is_capped is TRUE.
  - name: ingest_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When the row was ingested (UTC). With interval_start_ts this gives arrival latency.
  - name: latency_seconds
    logicalType: integer
    physicalType: INT
    required: false
    description: Seconds between interval end and ingest. Feeds gold_css_device_health.
  - name: restatement_version
    logicalType: integer
    physicalType: INT
    required: false
    description: 'Monotonic per grain key. These feeds are NOT append-only: vendors publish a late-data
      status that later resolves, and document sensors checking in with data hours or days old.'
  - name: restated_at_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When this version of the row was written (UTC). NULL for the first version.
  - name: sensor_device_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to sensor_device.sensor_device_sk. NULL for a cross-device aggregate.
    relationships:
    - to: sensor_device.sensor_device_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: connected_store_signals
      - property: enforced
        value: false
  - name: sensor_device_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable device id, and part of the grain key. A cross-device aggregate uses the explicit
      sentinel _ALL, NEVER NULL -- a NULL inside a concatenated key silently collapses rows.
  - name: sensing_deployment_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to sensing_deployment.sensing_deployment_sk -- the governance record that applied
      at measurement time (ADR 0031).
    relationships:
    - to: sensing_deployment.sensing_deployment_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: connected_store_signals
      - property: enforced
        value: false
  - name: sensing_deployment_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable deployment id. The SCD2-safe join key.
  - name: device_metadata_uri
    logicalType: string
    physicalType: STRING
    required: false
    description: EPCIS deviceMetadata -- calibration and accuracy context for this reading.
  - name: raw_data_uri
    logicalType: string
    physicalType: STRING
    required: false
    description: EPCIS rawData -- pointer to the sub-interval pulses in bronze, outside ORDM. EPCIS itself
      states it SHOULD NOT carry raw sensor data; this is the sanctioned pattern.
  - name: data_processing_method_uri
    logicalType: string
    physicalType: STRING
    required: false
    description: EPCIS dataProcessingMethod -- how raw observations became this aggregate.
  - name: biz_rules_uri
    logicalType: string
    physicalType: STRING
    required: false
    description: EPCIS bizRules -- the threshold or rule that was applied, e.g. the excursion rule version.
  - name: source_session_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Source session identifier effective for the interval, when one session covers the interval.
  - name: source_message_count
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: Number of source messages delivered for the interval.
  - name: sequence_gap_count
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: Number of source messages inferred missing from sequence gaps.
  - name: duplicate_delivery_count
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: Number of duplicate source-message deliveries in the interval.
  - name: historical_message_count
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: Number of delivered source messages marked as buffered or historical.
  - name: bad_quality_message_count
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: Number of delivered source messages carrying bad or stale source quality.
  - name: record_source
    logicalType: string
    physicalType: STRING
    required: false
    description: Originating system of record (vendor-neutral label).
  - name: load_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When this row was loaded (UTC, ISO 8601).
  quality:
  - name: ftid_space_count_requires_detail
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: ftid_space_count_requires_detail
    query: "SELECT f.sensor_report_interval_id\nFROM connected_store_signals.sensor_report_interval f\n\
      LEFT JOIN connected_store_signals.foot_traffic_interval_detail t\n  ON f.sensor_report_interval_sk\
      \ = t.sensor_report_interval_sk\nWHERE f.report_type = 'gs1:Count'\n  AND f.subject_type = 'space'\n\
      GROUP BY f.sensor_report_interval_id\nHAVING COUNT(t.sensor_report_interval_sk) <> 1"
  - name: ftid_noncount_report_forbids_detail
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: ftid_noncount_report_forbids_detail
    query: "SELECT f.sensor_report_interval_id\nFROM connected_store_signals.sensor_report_interval f\n\
      JOIN connected_store_signals.foot_traffic_interval_detail t\n  ON f.sensor_report_interval_sk =\
      \ t.sensor_report_interval_sk\nWHERE f.report_type <> 'gs1:Count' OR f.subject_type <> 'space'"
  - name: sri_grain_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sri_grain_unique
    query: SELECT sensor_report_interval_id, COUNT(*) AS n FROM connected_store_signals.sensor_report_interval
      GROUP BY sensor_report_interval_id HAVING COUNT(*) > 1
  - name: sri_sk_collision
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sri_sk_collision
    query: SELECT sensor_report_interval_sk, COUNT(DISTINCT sensor_report_interval_id) AS n FROM connected_store_signals.sensor_report_interval
      GROUP BY sensor_report_interval_sk HAVING COUNT(DISTINCT sensor_report_interval_id) > 1
  - name: sri_keys_not_null
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sri_keys_not_null
    query: SELECT * FROM connected_store_signals.sensor_report_interval WHERE sensor_report_interval_sk
      IS NULL OR sensor_report_interval_id IS NULL OR subject_type IS NULL OR subject_id IS NULL OR report_type
      IS NULL OR aggregation_level IS NULL OR interval_start_ts IS NULL OR interval_minutes IS NULL OR
      trading_date IS NULL
  - name: sri_device_id_sentinel
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sri_device_id_sentinel
    query: SELECT * FROM connected_store_signals.sensor_report_interval WHERE sensor_device_id IS NULL
  - name: sri_grain_key_wellformed
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sri_grain_key_wellformed
    query: 'SELECT * FROM connected_store_signals.sensor_report_interval

      WHERE sensor_report_interval_id <> concat_ws(''|'', subject_type, subject_id, report_type, aggregation_level,
      CAST(interval_minutes AS STRING), CAST(unix_timestamp(interval_start_ts) AS STRING), sensor_device_id)'
  - name: sri_sk_matches_id
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sri_sk_matches_id
    query: SELECT * FROM connected_store_signals.sensor_report_interval WHERE sensor_report_interval_sk
      <> xxhash64(sensor_report_interval_id)
  - name: sri_canonical_interval_overlap
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sri_canonical_interval_overlap
    query: "SELECT\n  a.sensor_report_interval_id AS left_id,\n  b.sensor_report_interval_id AS right_id\n\
      FROM connected_store_signals.sensor_report_interval a\nJOIN connected_store_signals.sensor_report_interval\
      \ b\n ON a.subject_type = b.subject_type\n AND a.subject_id = b.subject_id\n AND a.report_type =\
      \ b.report_type\n AND a.aggregation_level = b.aggregation_level\n AND a.sensor_report_interval_id\
      \ < b.sensor_report_interval_id\n AND a.interval_start_ts < b.interval_end_ts\n AND b.interval_start_ts\
      \ < a.interval_end_ts"
  - name: ftid_counting_convention_uniform
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: ftid_counting_convention_uniform
    query: "SELECT f.store_id, f.trading_date, f.aggregation_level, f.store_zone_sk,\n       COUNT(DISTINCT\
      \ counting_unit) AS units,\n       COUNT(DISTINCT group_counting_enabled) AS grp,\n       COUNT(DISTINCT\
      \ staff_exclusion_enabled) AS staff,\n       COUNT(DISTINCT staff_exclusion_stage) AS stage,\n \
      \      COUNT(DISTINCT time_mode) AS modes\nFROM connected_store_signals.sensor_report_interval f\n\
      JOIN connected_store_signals.foot_traffic_interval_detail t\n  ON f.sensor_report_interval_sk =\
      \ t.sensor_report_interval_sk\nWHERE f.report_type = 'gs1:Count'\nGROUP BY f.store_id, f.trading_date,\
      \ f.aggregation_level, f.store_zone_sk\nHAVING COUNT(DISTINCT counting_unit) > 1 OR COUNT(DISTINCT\
      \ group_counting_enabled) > 1\n    OR COUNT(DISTINCT staff_exclusion_enabled) > 1 OR COUNT(DISTINCT\
      \ staff_exclusion_stage) > 1\n    OR COUNT(DISTINCT time_mode) > 1"
  - name: sri_time_agreement
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sri_time_agreement
    query: "SELECT * FROM connected_store_signals.sensor_report_interval\nWHERE utc_offset_minutes IS\
      \ NOT NULL\n  AND trading_date <> date_add(\n        date_from_unix_date(\n          CAST(FLOOR((unix_timestamp(interval_start_ts)\
      \ + utc_offset_minutes * 60) / 86400) AS INT)),\n        -COALESCE(trading_day_offset, 0))"
  - name: sri_utc_offset_present
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sri_utc_offset_present
    query: SELECT * FROM connected_store_signals.sensor_report_interval WHERE utc_offset_minutes IS NULL
  - name: sri_interval_end_after_start
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sri_interval_end_after_start
    query: SELECT * FROM connected_store_signals.sensor_report_interval WHERE interval_end_ts IS NOT NULL
      AND interval_end_ts <= interval_start_ts
  - name: sri_interval_duration_agreement
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sri_interval_duration_agreement
    query: "SELECT *\nFROM connected_store_signals.sensor_report_interval\nWHERE interval_end_ts IS NULL\n\
      \   OR unix_timestamp(interval_end_ts) - unix_timestamp(interval_start_ts)\n      <> interval_minutes\
      \ * 60"
  - name: sri_series_gap_metric
    type: sql
    dimension: accuracy
    severity: info
    description: sri_series_gap_metric
    query: "WITH sequenced AS (\n  SELECT\n    subject_type,\n    subject_id,\n    report_type,\n    aggregation_level,\n\
      \    sensor_device_id,\n    interval_start_ts,\n    LAG(interval_end_ts) OVER (\n      PARTITION\
      \ BY subject_type, subject_id, report_type, aggregation_level, sensor_device_id\n      ORDER BY\
      \ interval_start_ts\n    ) AS previous_interval_end_ts\n  FROM connected_store_signals.sensor_report_interval\n\
      )\nSELECT\n  subject_type,\n  subject_id,\n  report_type,\n  aggregation_level,\n  sensor_device_id,\n\
      \  SUM(\n    GREATEST(\n      unix_timestamp(interval_start_ts) - unix_timestamp(previous_interval_end_ts),\n\
      \      0\n    )\n  ) AS uncovered_seconds\nFROM sequenced\nWHERE previous_interval_end_ts IS NOT\
      \ NULL\nGROUP BY subject_type, subject_id, report_type, aggregation_level, sensor_device_id"
  - name: sri_source_observation_bounds
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sri_source_observation_bounds
    query: "SELECT *\nFROM connected_store_signals.sensor_report_interval\nWHERE source_observation_count\
      \ IS NOT NULL\n  AND expected_observation_count IS NOT NULL\n  AND (\n    source_observation_count\
      \ < 0\n    OR expected_observation_count < 0\n    OR source_observation_count > expected_observation_count\n\
      \  )"
  - name: sri_source_message_summary_bounds
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sri_source_message_summary_bounds
    query: "SELECT *\nFROM connected_store_signals.sensor_report_interval\nWHERE COALESCE(source_message_count,\
      \ 0) < 0\n   OR COALESCE(sequence_gap_count, 0) < 0\n   OR COALESCE(duplicate_delivery_count, 0)\
      \ < 0\n   OR COALESCE(historical_message_count, 0) < 0\n   OR COALESCE(bad_quality_message_count,\
      \ 0) < 0"
  - name: sri_calendar_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sri_calendar_orphan
    query: 'SELECT f.* FROM connected_store_signals.sensor_report_interval f

      LEFT JOIN calendar.fiscal_calendar c ON f.trading_date = c.date_key

      WHERE c.date_key IS NULL'
  - name: ftid_entry_exit_reconciliation
    type: sql
    dimension: accuracy
    severity: warning
    mustBe: 0
    unit: rows
    description: ftid_entry_exit_reconciliation
    query: "SELECT f.store_id, f.trading_date, SUM(t.entry_count) AS entries, SUM(t.exit_count) AS exits\n\
      FROM connected_store_signals.sensor_report_interval f\nJOIN connected_store_signals.foot_traffic_interval_detail\
      \ t\n  ON f.sensor_report_interval_sk = t.sensor_report_interval_sk\nWHERE f.report_type = 'gs1:Count'\
      \ AND f.aggregation_level = 'site' AND t.directionality <> 'none'\nGROUP BY f.store_id, f.trading_date\n\
      HAVING SUM(entry_count) > 0 AND ABS(SUM(entry_count) - SUM(exit_count)) > 0.05 * SUM(entry_count)"
  - name: ftid_occupancy_within_capacity
    type: sql
    dimension: accuracy
    severity: warning
    mustBe: 0
    unit: rows
    description: ftid_occupancy_within_capacity
    query: "SELECT f.sensor_report_interval_id, t.occupancy_max, z.capacity_persons\nFROM connected_store_signals.sensor_report_interval\
      \ f\nJOIN connected_store_signals.foot_traffic_interval_detail t\n  ON f.sensor_report_interval_sk\
      \ = t.sensor_report_interval_sk\nJOIN connected_store_signals.store_zone z ON f.store_zone_id =\
      \ z.store_zone_id AND z.is_current = TRUE\nWHERE t.occupancy_max IS NOT NULL AND z.capacity_persons\
      \ IS NOT NULL AND t.occupancy_max > z.capacity_persons"
  - name: sri_epcis_field_pairing
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sri_epcis_field_pairing
    query: "SELECT * FROM connected_store_signals.sensor_report_interval\nWHERE (s_dev IS NOT NULL AND\
      \ mean_value IS NULL)\n   OR (perc_value IS NOT NULL AND perc_rank IS NULL)"
  - name: sri_uom_present
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sri_uom_present
    query: SELECT * FROM connected_store_signals.sensor_report_interval WHERE value IS NOT NULL AND report_type
      <> 'gs1:Count' AND uom IS NULL AND unit_iri IS NULL
  - name: sri_zero_vs_missing
    type: sql
    dimension: accuracy
    severity: info
    description: sri_zero_vs_missing
    query: "SELECT trading_date, store_id,\n       COUNT(*) AS rows_present,\n       SUM(CASE WHEN t.is_zero_observed\
      \ THEN 1 ELSE 0 END) AS observed_zeros,\n       SUM(CASE WHEN arrival_completeness = 'incomplete'\
      \ THEN 1 ELSE 0 END) AS incomplete_rows,\n       AVG(COALESCE(coverage_ratio, 0)) AS avg_coverage\n\
      FROM connected_store_signals.sensor_report_interval f\nJOIN connected_store_signals.foot_traffic_interval_detail\
      \ t\n  ON f.sensor_report_interval_sk = t.sensor_report_interval_sk\nWHERE f.report_type = 'gs1:Count'\n\
      GROUP BY f.trading_date, f.store_id"
  - name: sri_capped_limit_present
    type: sql
    dimension: accuracy
    severity: warning
    mustBe: 0
    unit: rows
    description: sri_capped_limit_present
    query: SELECT * FROM connected_store_signals.sensor_report_interval WHERE is_capped = TRUE AND capped_count_limit
      IS NULL
  - name: sri_store_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sri_store_fk_orphan
    query: SELECT f.* FROM connected_store_signals.sensor_report_interval f LEFT JOIN store.store s ON
      f.store_sk = s.store_sk WHERE f.store_sk IS NOT NULL AND s.store_sk IS NULL
  - name: sri_zone_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sri_zone_fk_orphan
    query: SELECT f.* FROM connected_store_signals.sensor_report_interval f LEFT JOIN connected_store_signals.store_zone
      z ON f.store_zone_sk = z.store_zone_sk WHERE f.store_zone_sk IS NOT NULL AND z.store_zone_sk IS
      NULL
  - name: sri_device_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sri_device_fk_orphan
    query: SELECT f.* FROM connected_store_signals.sensor_report_interval f LEFT JOIN connected_store_signals.sensor_device
      d ON f.sensor_device_sk = d.sensor_device_sk WHERE f.sensor_device_sk IS NOT NULL AND d.sensor_device_sk
      IS NULL
  - name: sri_deployment_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sri_deployment_fk_orphan
    query: SELECT f.* FROM connected_store_signals.sensor_report_interval f LEFT JOIN connected_store_signals.sensing_deployment
      p ON f.sensing_deployment_sk = p.sensing_deployment_sk WHERE f.sensing_deployment_sk IS NOT NULL
      AND p.sensing_deployment_sk IS NULL
  - name: sri_product_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sri_product_fk_orphan
    query: SELECT f.* FROM connected_store_signals.sensor_report_interval f LEFT JOIN product.product
      p ON f.product_sk = p.product_sk WHERE f.product_sk IS NOT NULL AND p.product_sk IS NULL
  - name: sri_equipment_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sri_equipment_fk_orphan
    query: SELECT f.* FROM connected_store_signals.sensor_report_interval f LEFT JOIN equipment.equipment
      e ON f.equipment_sk = e.equipment_sk WHERE f.equipment_sk IS NOT NULL AND e.equipment_sk IS NULL
  - name: sri_equipment_agrees_with_device
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sri_equipment_agrees_with_device
    query: 'SELECT f.sensor_report_interval_id, f.equipment_sk AS fact_equipment_sk, d.equipment_sk AS
      device_equipment_sk

      FROM connected_store_signals.sensor_report_interval f

      JOIN connected_store_signals.sensor_device d ON f.sensor_device_sk = d.sensor_device_sk

      WHERE f.equipment_sk IS NOT NULL AND d.equipment_sk IS NOT NULL AND f.equipment_sk <> d.equipment_sk'
  - name: sd_session_continuity
    type: sql
    dimension: accuracy
    severity: info
    description: sd_session_continuity
    query: "SELECT sensor_device_id, trading_date, COUNT(*) AS rows_present,\n       COUNT(DISTINCT source_session_id)\
      \ AS sessions,\n       SUM(sequence_gap_count) AS sequence_gap_count,\n       SUM(duplicate_delivery_count)\
      \ AS duplicate_delivery_count\nFROM connected_store_signals.sensor_report_interval\nWHERE source_session_id\
      \ IS NOT NULL\nGROUP BY sensor_device_id, trading_date"
  - name: sd_directionality_consistent
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sd_directionality_consistent
    query: "SELECT f.sensor_report_interval_id, d.sensor_device_id\nFROM connected_store_signals.sensor_report_interval\
      \ f\nJOIN connected_store_signals.sensor_device d ON f.sensor_device_id = d.sensor_device_id AND\
      \ d.is_current = TRUE\nJOIN connected_store_signals.foot_traffic_interval_detail t\n  ON f.sensor_report_interval_sk\
      \ = t.sensor_report_interval_sk\nWHERE d.is_directional = FALSE AND t.exit_count IS NOT NULL"
  - name: sdep_disclosure_policy_effective
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sdep_disclosure_policy_effective
    query: "SELECT f.sensor_report_interval_id, d.external_disclosure_policy_id\nFROM connected_store_signals.sensor_report_interval\
      \ f\nJOIN connected_store_signals.sensing_deployment d\n  ON f.sensing_deployment_sk = d.sensing_deployment_sk\n\
      LEFT JOIN connected_store_signals.sensing_disclosure_policy p\n  ON d.external_disclosure_policy_id\
      \ = p.sensing_disclosure_policy_id\n AND f.trading_date >= p.effective_from_date\n AND (p.effective_to_date\
      \ IS NULL OR f.trading_date < p.effective_to_date)\nWHERE f.report_type = 'gs1:Count'\n  AND p.sensing_disclosure_policy_sk\
      \ IS NULL"
- name: shelf_position_assignment
  physicalName: connected_store_signals.shelf_position_assignment
  physicalType: table
  description: 'Connected Store Signals slot-level expected shelf state (SCD2): product, expected and
    minimum facings per shelf-position zone. Execution contract for Smart Shelf compliance; distinct from
    BMV planogram allocation intent (ADR-B).'
  tags:
  - association
  authoritativeDefinitions:
  - url: outcome-packages/connected-store-signals/README.md
    type: businessDefinition
  - url: outcome-packages/connected-store-signals/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: shelf_position_assignment_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Surrogate key. Unique per SCD2 version.
  - name: shelf_position_assignment_id
    logicalType: string
    physicalType: STRING
    required: true
    description: 'Durable natural key: store_zone_id|product_id. One current version per shelf-position
      zone and product.'
  - name: store_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    description: FK to the store version in effect when this version was written.
    relationships:
    - to: store.store_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: store
      - property: enforced
        value: false
  - name: store_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable store business key.
  - name: store_zone_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    description: FK to the shelf-position zone version (store_zone.zone_type = shelf_position).
    relationships:
    - to: store_zone.store_zone_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: connected_store_signals
      - property: enforced
        value: false
  - name: store_zone_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable shelf-position zone id. The zone carries the aisle/bay ancestry via hierarchy_path.
  - name: product_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    description: FK to the product version in effect when this version was written.
    relationships:
    - to: product.product_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: product
      - property: enforced
        value: false
  - name: product_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable product business key expected at this position.
  - name: expected_facing_count
    logicalType: integer
    physicalType: INT
    required: false
    description: Facings this product should present at this position per the expected state.
    quality:
    - type: text
      dimension: validity
      severity: error
      description: CHECK ((expected_facing_count IS NULL OR expected_facing_count >= 0) AND (min_facing_count
        IS NULL OR min_facing_count >= 0) AND (min_facing_count IS NULL OR expected_facing_count IS NULL
        OR min_facing_count <= expected_facing_count)).
  - name: min_facing_count
    logicalType: integer
    physicalType: INT
    required: false
    description: 'Low-stock threshold: observed facings below this and above zero classify as low_stock
      at evaluation time.'
  - name: facing_sequence
    logicalType: integer
    physicalType: INT
    required: false
    description: Optional left-to-right sequence of this product within its bay, where the source system
      provides it.
  - name: assignment_source
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Provenance of the expected state. Allowed values: planogram, manual, vendor. Adopters
      without slot-level planograms operate on manual or vendor.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: planogram, manual, vendor.'
  - name: planogram_id
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Logical reference to the BMV planogram business key this assignment was derived from,
      when assignment_source = planogram. Not a FK: BMV planogram is allocation intent at a different
      grain (ADR-B); reconciliation is read-only gold-to-gold (ADR 0024).'
  - name: assignment_status
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Allowed values: active, suspended, retired.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: active, suspended, retired.'
  - name: valid_from_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: true
    description: Inclusive UTC instant this version became the expected state. The version grain key.
  - name: valid_to_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: Exclusive UTC instant this version stopped applying; NULL for the current version.
  - name: effective_from_date
    logicalType: date
    physicalType: DATE
    required: true
    description: 'SCD2: inclusive start date this version became effective. Derived: CAST(valid_from_ts
      AS DATE).'
  - name: effective_to_date
    logicalType: date
    physicalType: DATE
    required: false
    description: 'SCD2: exclusive end date; NULL for the current version. Derived from valid_to_ts.'
  - name: is_current
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: 'SCD2: TRUE for the currently active version.'
  - name: created_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When the record was created in the source system (UTC, ISO 8601).
  - name: source_updated_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When the record was last modified in the source system (UTC, ISO 8601).
  - name: record_source
    logicalType: string
    physicalType: STRING
    required: false
    description: Originating system of record (vendor-neutral label).
  - name: load_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When this row was loaded (UTC, ISO 8601).
  quality:
  - name: ssa_grain_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: ssa_grain_unique
    query: SELECT shelf_position_assignment_id, valid_from_ts, COUNT(*) AS n FROM connected_store_signals.shelf_position_assignment
      GROUP BY shelf_position_assignment_id, valid_from_ts HAVING COUNT(*) > 1
  - name: ssa_keys_not_null
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: ssa_keys_not_null
    query: SELECT * FROM connected_store_signals.shelf_position_assignment WHERE shelf_position_assignment_sk
      IS NULL OR shelf_position_assignment_id IS NULL OR store_id IS NULL OR store_zone_id IS NULL OR
      product_id IS NULL OR valid_from_ts IS NULL OR effective_from_date IS NULL OR is_current IS NULL
  - name: ssa_nonoverlapping_validity
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: ssa_nonoverlapping_validity
    query: "SELECT a.shelf_position_assignment_id, a.shelf_position_assignment_sk, b.shelf_position_assignment_sk\
      \ AS overlapping_sk\nFROM connected_store_signals.shelf_position_assignment a\nJOIN connected_store_signals.shelf_position_assignment\
      \ b\n  ON a.shelf_position_assignment_id = b.shelf_position_assignment_id\n AND a.shelf_position_assignment_sk\
      \ < b.shelf_position_assignment_sk\n AND a.valid_from_ts < COALESCE(b.valid_to_ts, TIMESTAMP'9999-12-31\
      \ 00:00:00')\n AND b.valid_from_ts < COALESCE(a.valid_to_ts, TIMESTAMP'9999-12-31 00:00:00')"
  - name: ssa_dates_derive_from_ts
    type: sql
    dimension: accuracy
    severity: warning
    mustBe: 0
    unit: rows
    description: ssa_dates_derive_from_ts
    query: "SELECT * FROM connected_store_signals.shelf_position_assignment\nWHERE effective_from_date\
      \ <> CAST(valid_from_ts AS DATE)\n   OR (valid_to_ts IS NULL AND effective_to_date IS NOT NULL)\n\
      \   OR (valid_to_ts IS NOT NULL AND\n       (effective_to_date IS NULL OR effective_to_date <> CAST(valid_to_ts\
      \ AS DATE)))"
  - name: ssa_scd2_consistent
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: ssa_scd2_consistent
    query: "SELECT * FROM connected_store_signals.shelf_position_assignment\nWHERE (is_current = TRUE\
      \ AND (valid_to_ts IS NOT NULL OR effective_to_date IS NOT NULL))\n   OR (is_current = FALSE AND\
      \ (valid_to_ts IS NULL OR effective_to_date IS NULL))\n   OR (valid_to_ts IS NOT NULL AND valid_to_ts\
      \ <= valid_from_ts)"
  - name: ssa_single_current
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: ssa_single_current
    query: SELECT shelf_position_assignment_id, COUNT(*) AS n FROM connected_store_signals.shelf_position_assignment
      WHERE is_current = TRUE GROUP BY shelf_position_assignment_id HAVING COUNT(*) > 1
  - name: ssa_store_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: ssa_store_fk_orphan
    query: SELECT a.* FROM connected_store_signals.shelf_position_assignment a LEFT JOIN store.store s
      ON a.store_sk = s.store_sk WHERE a.store_sk IS NOT NULL AND s.store_sk IS NULL
  - name: ssa_zone_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: ssa_zone_fk_orphan
    query: SELECT a.* FROM connected_store_signals.shelf_position_assignment a LEFT JOIN connected_store_signals.store_zone
      z ON a.store_zone_sk = z.store_zone_sk WHERE a.store_zone_sk IS NOT NULL AND z.store_zone_sk IS
      NULL
  - name: ssa_product_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: ssa_product_fk_orphan
    query: SELECT a.* FROM connected_store_signals.shelf_position_assignment a LEFT JOIN product.product
      p ON a.product_sk = p.product_sk WHERE a.product_sk IS NOT NULL AND p.product_sk IS NULL
  - name: ssa_reference_key_agreement
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: ssa_reference_key_agreement
    query: "SELECT a.shelf_position_assignment_id\nFROM connected_store_signals.shelf_position_assignment\
      \ a\nJOIN store.store s ON a.store_sk = s.store_sk\nJOIN connected_store_signals.store_zone z ON\
      \ a.store_zone_sk = z.store_zone_sk\nJOIN product.product p ON a.product_sk = p.product_sk\nWHERE\
      \ a.store_id <> s.store_id\n   OR a.store_zone_id <> z.store_zone_id\n   OR a.product_id <> p.product_id"
  - name: ssa_zone_is_shelf_position
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: ssa_zone_is_shelf_position
    query: "SELECT a.shelf_position_assignment_id, z.store_zone_id, z.zone_type\nFROM connected_store_signals.shelf_position_assignment\
      \ a\nJOIN connected_store_signals.store_zone z\n  ON a.store_zone_sk = z.store_zone_sk\nWHERE z.zone_type\
      \ <> 'shelf_position'"
  - name: ssa_zone_has_bay_aisle_ancestry
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: ssa_zone_has_bay_aisle_ancestry
    query: "SELECT a.shelf_position_assignment_id, z.store_zone_id,\n       b.store_zone_id AS parent_zone_id,\
      \ ai.store_zone_id AS grandparent_zone_id\nFROM connected_store_signals.shelf_position_assignment\
      \ a\nJOIN connected_store_signals.store_zone z\n  ON a.store_zone_sk = z.store_zone_sk\nLEFT JOIN\
      \ connected_store_signals.store_zone b\n  ON z.parent_zone_id = b.store_zone_id AND b.is_current\
      \ = TRUE\nLEFT JOIN connected_store_signals.store_zone ai\n  ON b.parent_zone_id = ai.store_zone_id\
      \ AND ai.is_current = TRUE\nWHERE a.is_current = TRUE\n  AND (b.store_zone_id IS NULL OR b.zone_type\
      \ <> 'bay'\n       OR ai.store_zone_id IS NULL OR ai.zone_type <> 'aisle')"
- name: shelf_state_observation
  physicalName: connected_store_signals.shelf_state_observation
  physicalType: table
  description: Connected Store Signals restatable positional shelf-state fact at shelf-position zone ×
    product × capture instant × device grain. Outside the sensor_report_interval envelope by design (draft
    ADR-A / ADR 0036).
  tags:
  - transactional
  authoritativeDefinitions:
  - url: outcome-packages/connected-store-signals/README.md
    type: businessDefinition
  - url: outcome-packages/connected-store-signals/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: shelf_state_observation_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: 'Surrogate join key: xxhash64(shelf_state_observation_id). The durable id is authoritative
      and collision-guarded.'
  - name: shelf_state_observation_id
    logicalType: string
    physicalType: STRING
    required: true
    description: 'Durable grain key: store_zone_id|product_id|sensor_device_id|source_capture_id. product_id
      uses the _ALL sentinel only for a position-level capture that cannot resolve a product.'
  - name: source_capture_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Platform identifier for the physical capture (CV frame/inference id, weight-event window
      id, sweep-pass segment). Groups the several product rows one capture may yield (two-row misplacement
      model) and keeps restatement idempotent under CV re-inference.
  - name: shelf_position_assignment_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to the expected-state assignment version in effect at observation time. NULL only
      when the position had no current assignment.
    relationships:
    - to: shelf_position_assignment.shelf_position_assignment_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: connected_store_signals
      - property: enforced
        value: false
  - name: shelf_position_assignment_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable assignment key captured at observation time, so compliance stays evaluable after
      the assignment re-versions (ADR 0025).
  - name: store_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    description: FK to the store version in effect at observation time.
    relationships:
    - to: store.store_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: store
      - property: enforced
        value: false
  - name: store_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable store business key.
  - name: store_zone_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    description: FK to the shelf-position zone version observed.
    relationships:
    - to: store_zone.store_zone_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: connected_store_signals
      - property: enforced
        value: false
  - name: store_zone_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable shelf-position zone id (store_zone.zone_type = shelf_position).
  - name: product_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: Product version resolved at write. NULL when product_id carries the _ALL sentinel or
      resolution failed.
    relationships:
    - to: product.product_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: product
      - property: enforced
        value: false
  - name: product_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable product business key observed or expected at this position; _ALL sentinel for
      unresolved position-level captures.
  - name: sensor_device_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    description: FK to the capturing device version in effect at observation time.
    relationships:
    - to: sensor_device.sensor_device_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: connected_store_signals
      - property: enforced
        value: false
  - name: sensor_device_id
    logicalType: string
    physicalType: STRING
    required: true
    description: 'Durable capturing device business key. Provenance is part of identity: two platforms
      may observe the same position at the same instant.'
  - name: sensing_deployment_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    description: FK to the governing sensing deployment version (ADR 0031).
    relationships:
    - to: sensing_deployment.sensing_deployment_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: connected_store_signals
      - property: enforced
        value: false
  - name: sensing_deployment_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable sensing deployment business key.
  - name: observation_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: true
    description: Capture or sweep-completion instant as UTC. Observations are instants, not intervals;
      cadence gaps are measured in gold, never imputed here.
  - name: store_timezone
    logicalType: string
    physicalType: STRING
    required: false
    description: IANA store timezone used to derive local business fields.
  - name: utc_offset_minutes
    logicalType: integer
    physicalType: SMALLINT
    required: true
    description: Store UTC offset in minutes at observation_ts.
  - name: trading_date
    logicalType: date
    physicalType: DATE
    required: true
    description: Business date of observation_ts. Logical join to fiscal_calendar.date_key.
  - name: hour_of_day
    logicalType: integer
    physicalType: TINYINT
    required: false
    description: Store-local observation hour, 0 through 23.
  - name: shelf_state
    logicalType: string
    physicalType: STRING
    required: true
    description: 'Evaluated state at capture: in_stock, low_stock, out_of_stock, misplaced, unknown. low_stock
      uses min_facing_threshold recorded on this row; misplaced means the product on THIS row was detected
      at a position assigned to a different product (the captured assignment names the violated expectation);
      unknown means the platform could not evaluate and all measures are NULL, never zero.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: in_stock, low_stock, out_of_stock, misplaced, unknown.'
  - name: observed_facing_count
    logicalType: integer
    physicalType: INT
    required: false
    description: Facings visibly presented at capture. NULL when shelf_state = unknown.
    quality:
    - type: text
      dimension: validity
      severity: error
      description: CHECK ((observed_facing_count IS NULL OR observed_facing_count >= 0) AND (min_facing_threshold
        IS NULL OR min_facing_threshold >= 0) AND (estimated_unit_count IS NULL OR estimated_unit_count
        >= 0) AND (estimated_weight_grams IS NULL OR estimated_weight_grams >= 0) AND (pick_count_since_prior
        IS NULL OR pick_count_since_prior >= 0) AND (put_count_since_prior IS NULL OR put_count_since_prior
        >= 0)).
  - name: min_facing_threshold
    logicalType: integer
    physicalType: INT
    required: false
    description: The assignment min_facing_count evaluated at write, recorded so the low_stock classification
      stays explainable after the assignment re-versions.
  - name: estimated_unit_count
    logicalType: number
    physicalType: DOUBLE
    required: false
    description: Weight-derived unit estimate (total weight / calibrated per-SKU unit weight). An estimate
      carrying uncertainty, not a count; NULL for platforms without declared unit-estimation capability.
  - name: estimated_weight_grams
    logicalType: number
    physicalType: DOUBLE
    required: false
    description: Observed net weight in grams. NULL for non-weight platforms.
  - name: pick_count_since_prior
    logicalType: integer
    physicalType: INT
    required: false
    description: Pick events since the prior capture of this position by this device. NULL for platforms
      that cannot detect events (mirrors ftid_nondirectional_exits_null honesty). Raw events stay in Bronze
      behind raw_data_uri.
  - name: put_count_since_prior
    logicalType: integer
    physicalType: INT
    required: false
    description: Putback events since the prior capture of this position by this device. NULL for platforms
      that cannot detect events.
  - name: is_gap_detected
    logicalType: boolean
    physicalType: BOOLEAN
    required: false
    description: TRUE when the platform flagged a visible gap/void at this position.
  - name: is_misplaced_detected
    logicalType: boolean
    physicalType: BOOLEAN
    required: false
    description: 'On an expected-product row: TRUE when something else was detected sitting at this position
      (the detected product gets its own misplaced-state row sharing this source_capture_id).'
  - name: is_price_tag_mismatch_detected
    logicalType: boolean
    physicalType: BOOLEAN
    required: false
    description: TRUE when shelf CV flagged the displayed price tag against the expected one. Bridges
      to the ESL layer; the authoritative price comparison lives in esl_price_observation.
  - name: zone_source
    logicalType: string
    physicalType: STRING
    required: true
    description: 'How the position zone was attributed: device_placement, operator_declared, platform_localization.
      Fixed sensors use device_placement; robot sweeps use platform_localization (RFID vocabulary reused).'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: device_placement, operator_declared, platform_localization.'
  - name: attribution_confidence
    logicalType: number
    physicalType: DOUBLE
    required: true
    description: Confidence in assigning the capture to the stated position zone, in [0,1]. 1.0 for fixed
      device placement.
    quality:
    - type: text
      dimension: validity
      severity: error
      description: CHECK ((attribution_confidence BETWEEN 0 AND 1) AND (confidence_score IS NULL OR (confidence_score
        BETWEEN 0 AND 1)) AND (coverage_ratio IS NULL OR (coverage_ratio BETWEEN 0 AND 1))).
  - name: measurement_validity
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Was the sensor telling the truth. Allowed values: valid, degraded, invalid, imputed.
      Occluded captures are never valid.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: valid, degraded, invalid, imputed.'
  - name: arrival_completeness
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Has the data landed. Allowed values: complete, incomplete, late_arrived, precheck.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: complete, incomplete, late_arrived, precheck.'
  - name: confidence_score
    logicalType: number
    physicalType: DOUBLE
    required: false
    description: Detector confidence for this capture, [0,1], where supplied.
  - name: is_occluded
    logicalType: boolean
    physicalType: BOOLEAN
    required: false
    description: TRUE when the view of the position was blocked at capture (CV platforms).
  - name: coverage_ratio
    logicalType: number
    physicalType: DOUBLE
    required: false
    description: Fraction of the expected extent for this position actually observed in this capture,
      [0,1]. Matters most for mobile sweeps with partial coverage.
  - name: restatement_version
    logicalType: integer
    physicalType: INT
    required: false
    description: Monotonic per grain key. CV pipelines re-infer past captures after model retrains; this
      fact is restatable, not append-only.
  - name: restated_at_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When this version of the row was written (UTC). NULL for the first version.
  - name: raw_data_uri
    logicalType: string
    physicalType: STRING
    required: false
    description: Pointer to raw capture evidence (image crops, weight event stream) in Bronze, outside
      ORDM.
  - name: ingest_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When the observation arrived in the lakehouse (UTC).
  - name: record_source
    logicalType: string
    physicalType: STRING
    required: false
    description: Originating system of record (vendor-neutral label).
  - name: load_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When this row was loaded (UTC).
  quality:
  - name: sso_grain_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sso_grain_unique
    query: SELECT shelf_state_observation_id, COUNT(*) AS n FROM connected_store_signals.shelf_state_observation
      GROUP BY shelf_state_observation_id HAVING COUNT(*) > 1
  - name: sso_sk_collision
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sso_sk_collision
    query: 'SELECT shelf_state_observation_sk, COUNT(DISTINCT shelf_state_observation_id) AS durable_id_count

      FROM connected_store_signals.shelf_state_observation

      GROUP BY shelf_state_observation_sk

      HAVING COUNT(DISTINCT shelf_state_observation_id) > 1'
  - name: sso_keys_not_null
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sso_keys_not_null
    query: SELECT * FROM connected_store_signals.shelf_state_observation WHERE shelf_state_observation_sk
      IS NULL OR shelf_state_observation_id IS NULL OR source_capture_id IS NULL OR store_id IS NULL OR
      store_zone_id IS NULL OR product_id IS NULL OR sensor_device_id IS NULL OR sensing_deployment_id
      IS NULL OR observation_ts IS NULL OR utc_offset_minutes IS NULL OR trading_date IS NULL OR shelf_state
      IS NULL OR zone_source IS NULL OR attribution_confidence IS NULL
  - name: sso_assignment_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sso_assignment_fk_orphan
    query: SELECT o.* FROM connected_store_signals.shelf_state_observation o LEFT JOIN connected_store_signals.shelf_position_assignment
      a ON o.shelf_position_assignment_sk = a.shelf_position_assignment_sk WHERE o.shelf_position_assignment_sk
      IS NOT NULL AND a.shelf_position_assignment_sk IS NULL
  - name: sso_assignment_key_pair
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sso_assignment_key_pair
    query: "SELECT * FROM connected_store_signals.shelf_state_observation\nWHERE (shelf_position_assignment_sk\
      \ IS NULL AND shelf_position_assignment_id IS NOT NULL)\n   OR (shelf_position_assignment_sk IS\
      \ NOT NULL AND shelf_position_assignment_id IS NULL)"
  - name: sso_assignment_context_consistent
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sso_assignment_context_consistent
    query: "SELECT o.shelf_state_observation_id, o.observation_ts,\n       o.store_id AS observed_store,\
      \ a.store_id AS assignment_store,\n       o.store_zone_id AS observed_zone, a.store_zone_id AS assignment_zone,\n\
      \       o.product_id AS observed_product, a.product_id AS assignment_product\nFROM connected_store_signals.shelf_state_observation\
      \ o\nJOIN connected_store_signals.shelf_position_assignment a\n  ON o.shelf_position_assignment_sk\
      \ = a.shelf_position_assignment_sk\nWHERE o.store_id <> a.store_id\n   OR o.store_zone_id <> a.store_zone_id\n\
      \   OR (o.shelf_state <> 'misplaced' AND o.product_id <> a.product_id)\n   OR o.observation_ts <\
      \ a.valid_from_ts\n   OR (a.valid_to_ts IS NOT NULL AND o.observation_ts >= a.valid_to_ts)"
  - name: sso_store_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sso_store_fk_orphan
    query: SELECT o.* FROM connected_store_signals.shelf_state_observation o LEFT JOIN store.store s ON
      o.store_sk = s.store_sk WHERE o.store_sk IS NOT NULL AND s.store_sk IS NULL
  - name: sso_zone_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sso_zone_fk_orphan
    query: SELECT o.* FROM connected_store_signals.shelf_state_observation o LEFT JOIN connected_store_signals.store_zone
      z ON o.store_zone_sk = z.store_zone_sk WHERE o.store_zone_sk IS NOT NULL AND z.store_zone_sk IS
      NULL
  - name: sso_product_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sso_product_fk_orphan
    query: SELECT o.* FROM connected_store_signals.shelf_state_observation o LEFT JOIN product.product
      p ON o.product_sk = p.product_sk WHERE o.product_sk IS NOT NULL AND p.product_sk IS NULL
  - name: sso_device_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sso_device_fk_orphan
    query: SELECT o.* FROM connected_store_signals.shelf_state_observation o LEFT JOIN connected_store_signals.sensor_device
      d ON o.sensor_device_sk = d.sensor_device_sk WHERE o.sensor_device_sk IS NOT NULL AND d.sensor_device_sk
      IS NULL
  - name: sso_deployment_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sso_deployment_fk_orphan
    query: SELECT o.* FROM connected_store_signals.shelf_state_observation o LEFT JOIN connected_store_signals.sensing_deployment
      dep ON o.sensing_deployment_sk = dep.sensing_deployment_sk WHERE o.sensing_deployment_sk IS NOT
      NULL AND dep.sensing_deployment_sk IS NULL
  - name: sso_reference_key_agreement
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sso_reference_key_agreement
    query: "SELECT o.shelf_state_observation_id\nFROM connected_store_signals.shelf_state_observation\
      \ o\nJOIN store.store s ON o.store_sk = s.store_sk\nJOIN connected_store_signals.store_zone z ON\
      \ o.store_zone_sk = z.store_zone_sk\nJOIN connected_store_signals.sensor_device d ON o.sensor_device_sk\
      \ = d.sensor_device_sk\nJOIN connected_store_signals.sensing_deployment dep\n  ON o.sensing_deployment_sk\
      \ = dep.sensing_deployment_sk\nLEFT JOIN connected_store_signals.shelf_position_assignment a\n \
      \ ON o.shelf_position_assignment_sk = a.shelf_position_assignment_sk\nLEFT JOIN product.product\
      \ p ON o.product_sk = p.product_sk\nWHERE o.store_id <> s.store_id\n   OR o.store_zone_id <> z.store_zone_id\n\
      \   OR o.sensor_device_id <> d.sensor_device_id\n   OR o.sensing_deployment_id <> dep.sensing_deployment_id\n\
      \   OR (o.shelf_position_assignment_sk IS NOT NULL\n       AND o.shelf_position_assignment_id <>\
      \ a.shelf_position_assignment_id)\n   OR (o.product_sk IS NOT NULL AND o.product_id <> p.product_id)"
  - name: sso_zone_is_shelf_position
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sso_zone_is_shelf_position
    query: 'SELECT o.shelf_state_observation_id, z.store_zone_id, z.zone_type

      FROM connected_store_signals.shelf_state_observation o

      JOIN connected_store_signals.store_zone z ON o.store_zone_sk = z.store_zone_sk

      WHERE z.zone_type <> ''shelf_position'''
  - name: sso_state_oos_zero_facings
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sso_state_oos_zero_facings
    query: 'SELECT * FROM connected_store_signals.shelf_state_observation

      WHERE shelf_state = ''out_of_stock'' AND (observed_facing_count IS NULL OR observed_facing_count
      <> 0)'
  - name: sso_state_low_stock_band
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sso_state_low_stock_band
    query: "SELECT * FROM connected_store_signals.shelf_state_observation\nWHERE shelf_state = 'low_stock'\n\
      \  AND (observed_facing_count IS NULL OR min_facing_threshold IS NULL\n       OR observed_facing_count\
      \ <= 0 OR observed_facing_count >= min_facing_threshold)"
  - name: sso_state_in_stock_meets_threshold
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sso_state_in_stock_meets_threshold
    query: "SELECT * FROM connected_store_signals.shelf_state_observation\nWHERE shelf_state = 'in_stock'\
      \ AND min_facing_threshold IS NOT NULL\n  AND (observed_facing_count IS NULL OR observed_facing_count\
      \ < min_facing_threshold)"
  - name: sso_state_unknown_measures_null
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sso_state_unknown_measures_null
    query: "SELECT * FROM connected_store_signals.shelf_state_observation\nWHERE shelf_state = 'unknown'\n\
      \  AND (observed_facing_count IS NOT NULL OR estimated_unit_count IS NOT NULL\n       OR estimated_weight_grams\
      \ IS NOT NULL OR pick_count_since_prior IS NOT NULL\n       OR put_count_since_prior IS NOT NULL)"
  - name: sso_state_misplaced_semantics
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sso_state_misplaced_semantics
    query: "SELECT o.shelf_state_observation_id, o.product_id AS detected_product, a.product_id AS expected_product\n\
      FROM connected_store_signals.shelf_state_observation o\nLEFT JOIN connected_store_signals.shelf_position_assignment\
      \ a\n  ON o.shelf_position_assignment_sk = a.shelf_position_assignment_sk\nWHERE o.shelf_state =\
      \ 'misplaced'\n  AND (o.shelf_position_assignment_sk IS NULL\n       OR o.product_sk IS NULL OR\
      \ o.product_id = '_ALL'\n       OR a.product_id = o.product_id)"
  - name: sso_misplaced_sibling_present
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sso_misplaced_sibling_present
    query: "SELECT m.shelf_state_observation_id, m.source_capture_id, a.product_id AS expected_product\n\
      FROM connected_store_signals.shelf_state_observation m\nJOIN connected_store_signals.shelf_position_assignment\
      \ a\n  ON m.shelf_position_assignment_sk = a.shelf_position_assignment_sk\nLEFT JOIN connected_store_signals.shelf_state_observation\
      \ s\n  ON s.source_capture_id = m.source_capture_id\n AND s.sensor_device_id = m.sensor_device_id\n\
      \ AND s.store_id = m.store_id\n AND s.store_zone_id = m.store_zone_id\n AND s.product_id = a.product_id\n\
      \ AND s.shelf_state = 'out_of_stock'\n AND COALESCE(s.is_misplaced_detected, FALSE) = TRUE\nWHERE\
      \ m.shelf_state = 'misplaced'\n  AND s.shelf_state_observation_id IS NULL"
  - name: sso_unit_estimate_capability
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sso_unit_estimate_capability
    query: "SELECT o.shelf_state_observation_id, d.sensor_device_id, d.sensing_technology\nFROM connected_store_signals.shelf_state_observation\
      \ o\nJOIN connected_store_signals.sensor_device d ON o.sensor_device_sk = d.sensor_device_sk\nWHERE\
      \ (o.estimated_unit_count IS NOT NULL OR o.estimated_weight_grams IS NOT NULL)\n  AND (d.sensing_technology\
      \ IS NULL OR d.sensing_technology <> 'load_cell')"
  - name: sso_event_count_capability
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sso_event_count_capability
    query: "SELECT o.shelf_state_observation_id, d.sensor_device_id, d.sensing_technology\nFROM connected_store_signals.shelf_state_observation\
      \ o\nJOIN connected_store_signals.sensor_device d ON o.sensor_device_sk = d.sensor_device_sk\nWHERE\
      \ (o.pick_count_since_prior IS NOT NULL OR o.put_count_since_prior IS NOT NULL)\n  AND (d.sensing_technology\
      \ IS NULL OR\n       d.sensing_technology NOT IN ('load_cell', 'video_cv', 'stereo_vision'))"
  - name: sso_occluded_not_valid
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sso_occluded_not_valid
    query: 'SELECT * FROM connected_store_signals.shelf_state_observation

      WHERE COALESCE(is_occluded, FALSE) = TRUE AND measurement_validity = ''valid'''
  - name: sso_time_agreement
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sso_time_agreement
    query: "SELECT * FROM connected_store_signals.shelf_state_observation\nWHERE utc_offset_minutes IS\
      \ NOT NULL\n  AND trading_date <> date_from_unix_date(\n        CAST(FLOOR((unix_timestamp(observation_ts)\
      \ + utc_offset_minutes * 60) / 86400) AS INT))"
  - name: sso_observation_not_future
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sso_observation_not_future
    query: 'SELECT * FROM connected_store_signals.shelf_state_observation

      WHERE observation_ts > current_timestamp()'
  - name: sso_unassigned_observation_rate
    type: sql
    dimension: accuracy
    severity: info
    description: sso_unassigned_observation_rate
    query: "SELECT COUNT(CASE WHEN shelf_position_assignment_id IS NULL THEN 1 END) AS unassigned_observations,\n\
      \       COUNT(*) AS total_observations\nFROM connected_store_signals.shelf_state_observation"
  - name: sso_position_cadence_gap
    type: sql
    dimension: accuracy
    severity: info
    description: sso_position_cadence_gap
    query: "SELECT COUNT(*) AS stale_positions\nFROM (\n  SELECT store_zone_id, MAX(observation_ts) AS\
      \ latest_ts\n  FROM connected_store_signals.shelf_state_observation\n  GROUP BY store_zone_id\n\
      ) p\nCROSS JOIN (SELECT MAX(observation_ts) AS estate_latest FROM connected_store_signals.shelf_state_observation)\
      \ e\nWHERE p.latest_ts < e.estate_latest - INTERVAL 24 HOURS"
- name: store_zone
  physicalName: connected_store_signals.store_zone
  physicalType: table
  description: Connected Store Signals -- conformed in-store zone dimension (SCD2), recursive store->zone->aisle->bay->shelf_position.
  tags:
  - master
  authoritativeDefinitions:
  - url: outcome-packages/connected-store-signals/README.md
    type: businessDefinition
  - url: outcome-packages/connected-store-signals/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: store_zone_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Surrogate key. Unique per SCD2 version.
  - name: store_zone_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable natural/business key for the zone. Stable across SCD2 versions.
  - name: store_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to store.store_sk (SCD2 version current at load).
    relationships:
    - to: store.store_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: store
      - property: enforced
        value: false
  - name: store_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable store business key. Use this for SCD2-safe joins (ADR 0025).
  - name: zone_code
    logicalType: string
    physicalType: STRING
    required: false
    description: Zone code as emitted by the source system. Replaces the bare store_zone_code string the
      CMN fact carried.
  - name: zone_name
    logicalType: string
    physicalType: STRING
    required: false
    description: Human-readable zone name for display and Genie.
  - name: zone_type
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Depth in the spatial hierarchy. Allowed values: site, entrance, area, department, aisle,
      bay, shelf_position, queue, fitting_room, perimeter, back_of_house.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: site, entrance, area, department, aisle, bay, shelf_position, queue,
        fitting_room, perimeter, back_of_house.'
  - name: parent_zone_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to store_zone.store_zone_sk -- the containing zone. NULL for the site row.
    relationships:
    - to: store_zone.store_zone_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: connected_store_signals
      - property: enforced
        value: false
  - name: parent_zone_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable id of the containing zone. The SCD2-safe join key; prefer this over parent_zone_sk.
  - name: hierarchy_depth
    logicalType: integer
    physicalType: INT
    required: false
    description: Materialised depth (0 = site). Avoids a recursive CTE in every consumer.
    quality:
    - type: text
      dimension: validity
      severity: error
      description: CHECK (hierarchy_depth IS NULL OR hierarchy_depth >= 0).
  - name: hierarchy_path
    logicalType: string
    physicalType: STRING
    required: false
    description: Materialised ancestry path, e.g. /site/area-grocery/aisle-07. Denormalised for filtering.
  - name: area_sqm
    logicalType: number
    physicalType: DECIMAL(12,2)
    required: false
    description: Zone floor area in square metres. Denominator for traffic and occupancy density.
    quality:
    - type: text
      dimension: validity
      severity: error
      description: CHECK (area_sqm IS NULL OR area_sqm > 0).
  - name: capacity_persons
    logicalType: integer
    physicalType: INT
    required: false
    description: Safe/design occupancy in persons, where known. Used to warn on implausible occupancy,
      never to clamp it.
    quality:
    - type: text
      dimension: validity
      severity: error
      description: CHECK (capacity_persons IS NULL OR capacity_persons > 0).
  - name: is_sales_floor
    logicalType: boolean
    physicalType: BOOLEAN
    required: false
    description: TRUE if the zone is customer-accessible selling space. FALSE for back-of-house.
  - name: is_countable
    logicalType: boolean
    physicalType: BOOLEAN
    required: false
    description: TRUE if this zone is instrumented for people counting. FALSE zones exist for spatial
      structure only.
  - name: effective_from_date
    logicalType: date
    physicalType: DATE
    required: true
    description: 'SCD2: inclusive start date this version became effective.'
  - name: effective_to_date
    logicalType: date
    physicalType: DATE
    required: false
    description: 'SCD2: exclusive end date; NULL for the current version.'
  - name: is_current
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: 'SCD2: TRUE for the currently active version.'
  - name: created_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When the record was created in the source system (UTC, ISO 8601).
  - name: source_updated_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When the record was last modified in the source system (UTC, ISO 8601).
  - name: record_source
    logicalType: string
    physicalType: STRING
    required: false
    description: Originating system of record (vendor-neutral label).
  - name: load_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When this row was loaded (UTC, ISO 8601).
  quality:
  - name: sz_grain_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sz_grain_unique
    query: SELECT store_zone_id, effective_from_date, COUNT(*) AS n FROM connected_store_signals.store_zone
      GROUP BY store_zone_id, effective_from_date HAVING COUNT(*) > 1
  - name: sz_keys_not_null
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sz_keys_not_null
    query: SELECT * FROM connected_store_signals.store_zone WHERE store_zone_sk IS NULL OR store_zone_id
      IS NULL OR effective_from_date IS NULL OR is_current IS NULL
  - name: sz_single_current
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sz_single_current
    query: SELECT store_zone_id, COUNT(*) AS n FROM connected_store_signals.store_zone WHERE is_current
      = TRUE GROUP BY store_zone_id HAVING COUNT(*) > 1
  - name: sz_parent_resolves_current
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sz_parent_resolves_current
    query: 'SELECT z.store_zone_id, z.parent_zone_id

      FROM connected_store_signals.store_zone z

      LEFT JOIN connected_store_signals.store_zone p ON z.parent_zone_id = p.store_zone_id AND p.is_current
      = TRUE

      WHERE z.parent_zone_id IS NOT NULL AND p.store_zone_id IS NULL'
  - name: sz_no_self_parent
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sz_no_self_parent
    query: SELECT * FROM connected_store_signals.store_zone WHERE parent_zone_id = store_zone_id
  - name: sz_root_is_site
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sz_root_is_site
    query: SELECT * FROM connected_store_signals.store_zone WHERE parent_zone_id IS NULL AND zone_type
      <> 'site'
  - name: sz_store_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sz_store_fk_orphan
    query: SELECT z.* FROM connected_store_signals.store_zone z LEFT JOIN store.store s ON z.store_sk
      = s.store_sk WHERE z.store_sk IS NOT NULL AND s.store_sk IS NULL
  - name: ssa_position_coverage
    type: sql
    dimension: accuracy
    severity: info
    description: ssa_position_coverage
    query: "SELECT COUNT(DISTINCT a.store_zone_id) AS assigned_positions,\n       COUNT(DISTINCT z.store_zone_id)\
      \ AS shelf_position_zones\nFROM connected_store_signals.store_zone z\nLEFT JOIN connected_store_signals.shelf_position_assignment\
      \ a\n  ON a.store_zone_id = z.store_zone_id AND a.is_current = TRUE\nWHERE z.zone_type = 'shelf_position'\
      \ AND z.is_current = TRUE"
- name: tagged_item
  physicalName: connected_store_signals.tagged_item
  physicalType: table
  description: 'Connected Store Signals serialized-item registry: EPC identity, product resolution, current
    carrier and tag privacy state.'
  tags:
  - master
  authoritativeDefinitions:
  - url: outcome-packages/connected-store-signals/README.md
    type: businessDefinition
  - url: outcome-packages/connected-store-signals/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: tagged_item_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: 'Surrogate join key: xxhash64(tagged_item_id). The durable id remains authoritative;
      guarded by ti_sk_collision.'
  - name: tagged_item_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable serialized-item key, valued as a GS1 EPC Pure Identity URI such as urn:epc:id:sgtin:0614141.107346.2017.
  - name: epc_scheme
    logicalType: string
    physicalType: STRING
    required: true
    description: 'EPC identity scheme. Allowed values: sgtin, grai.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: sgtin, grai.'
  - name: gtin
    logicalType: string
    physicalType: STRING
    required: false
    description: GTIN decomposed from an SGTIN EPC. NULL for schemes without a GTIN component.
  - name: serial_number
    logicalType: string
    physicalType: STRING
    required: false
    description: Serialized-unit component of an SGTIN EPC. Required for epc_scheme = sgtin.
  - name: current_tid_hex
    logicalType: string
    physicalType: STRING
    required: false
    description: Current physical RFID tag-chip identifier in hexadecimal. Carrier evidence, not serialized-item
      identity.
  - name: product_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to the product version resolved when the item was commissioned. NULL when the EPC
      cannot be resolved to a product.
    relationships:
    - to: product.product_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: product
      - property: enforced
        value: false
  - name: product_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable product business key. Retained with product_sk for portable joins.
  - name: lot_number
    logicalType: string
    physicalType: STRING
    required: false
    description: Optional source lot identifier for fresh or regulated categories; not a conformed lot
      entity.
  - name: expiry_date
    logicalType: date
    physicalType: DATE
    required: false
    description: Optional item expiry date for fresh or regulated categories.
  - name: tag_privacy_state
    logicalType: string
    physicalType: STRING
    required: true
    description: 'Current tag privacy state. Allowed values: active, protected, killed, detached.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: active, protected, killed, detached.'
  - name: commissioned_at_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: true
    description: UTC instant when this EPC was commissioned for the serialized item.
  - name: decommissioned_at_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: UTC instant when this EPC left active service. NULL while active.
    quality:
    - type: text
      dimension: validity
      severity: error
      description: CHECK (decommissioned_at_ts IS NULL OR decommissioned_at_ts >= commissioned_at_ts).
  - name: created_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When the registry record was created in the source system (UTC).
  - name: source_updated_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When the Type 1 registry row was last changed in the source system (UTC).
  - name: record_source
    logicalType: string
    physicalType: STRING
    required: false
    description: Originating system of record (vendor-neutral label).
  - name: load_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When this row was loaded (UTC).
  quality:
  - name: ti_grain_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: ti_grain_unique
    query: 'SELECT tagged_item_id, COUNT(*) AS n

      FROM connected_store_signals.tagged_item

      GROUP BY tagged_item_id

      HAVING COUNT(*) > 1'
  - name: ti_sk_collision
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: ti_sk_collision
    query: 'SELECT tagged_item_sk, COUNT(DISTINCT tagged_item_id) AS durable_id_count

      FROM connected_store_signals.tagged_item

      GROUP BY tagged_item_sk

      HAVING COUNT(DISTINCT tagged_item_id) > 1'
  - name: ti_keys_not_null
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: ti_keys_not_null
    query: 'SELECT *

      FROM connected_store_signals.tagged_item

      WHERE tagged_item_sk IS NULL OR tagged_item_id IS NULL'
  - name: ti_identity_contract
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: ti_identity_contract
    query: "SELECT *\nFROM connected_store_signals.tagged_item\nWHERE (epc_scheme = 'sgtin' AND (\n  \
      \       tagged_item_id NOT LIKE 'urn:epc:id:sgtin:%'\n         OR serial_number IS NULL\n      \
      \   OR gtin IS NULL\n         OR product_sk IS NULL\n         OR product_id IS NULL\n       ))\n\
      \   OR (epc_scheme = 'grai' AND tagged_item_id NOT LIKE 'urn:epc:id:grai:%')"
  - name: ti_product_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: ti_product_fk_orphan
    query: "SELECT i.*\nFROM connected_store_signals.tagged_item i\nLEFT JOIN product.product p ON i.product_sk\
      \ = p.product_sk\nWHERE i.product_sk IS NOT NULL\n  AND p.product_sk IS NULL"
  - name: ti_product_gtin_agreement
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: ti_product_gtin_agreement
    query: "SELECT i.tagged_item_id, i.gtin AS item_gtin, p.gtin AS product_gtin\nFROM connected_store_signals.tagged_item\
      \ i\nJOIN product.product p ON i.product_sk = p.product_sk\nWHERE i.gtin IS NOT NULL\n  AND p.gtin\
      \ IS NOT NULL\n  AND i.gtin <> p.gtin"
- name: gold_count_session_summary
  physicalName: connected_store_signals.gold_count_session_summary
  physicalType: view
  description: 'GRAIN: one row per RFID count session. full_store plans derive from active non-site zones
    at session start; partial sessions make no plan claim.'
  tags:
  - gold
  authoritativeDefinitions:
  - url: outcome-packages/connected-store-signals/README.md
    type: businessDefinition
  - url: outcome-packages/connected-store-signals/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: rfid_count_session_sk
    logicalType: integer
    physicalType: BIGINT
  - name: rfid_count_session_id
    logicalType: string
    physicalType: STRING
  - name: source_session_id
    logicalType: string
    physicalType: STRING
  - name: store_sk
    logicalType: integer
    physicalType: BIGINT
  - name: store_id
    logicalType: string
    physicalType: STRING
  - name: primary_sensor_device_sk
    logicalType: integer
    physicalType: BIGINT
  - name: primary_sensor_device_id
    logicalType: string
    physicalType: STRING
  - name: count_method
    logicalType: string
    physicalType: STRING
  - name: scope_type
    logicalType: string
    physicalType: STRING
  - name: started_at_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
  - name: ended_at_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
  - name: trading_date
    logicalType: date
    physicalType: DATE
  - name: duration_minutes
    logicalType: integer
    physicalType: INT
  - name: planned_zones
    logicalType: integer
    physicalType: BIGINT
    description: Active non-site zones derived at session start for full_store sessions; NULL for partial
      scope.
  - name: zones_covered
    logicalType: integer
    physicalType: BIGINT
  - name: zones_missed
    logicalType: integer
    physicalType: BIGINT
  - name: zone_coverage_rate
    logicalType: number
    physicalType: DOUBLE
    description: Observed zones divided by derived planned zones for full_store sessions only.
  - name: units_observed
    logicalType: integer
    physicalType: BIGINT
  - name: devices_observed
    logicalType: integer
    physicalType: BIGINT
  - name: first_event_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
  - name: last_event_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
  - name: fresh_as_of_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
- name: gold_css_automation_response
  physicalName: connected_store_signals.gold_css_automation_response
  physicalType: view
  description: 'GRAIN: one row per realised automation firing (one execution_log row), decorated with
    the action that ran, the rule that fired it, the actuator it hit (when the target is a device), the
    observing device, and the sensor_report_interval whose reading breached the threshold. This is the
    consumable that makes the sense -> evaluate -> act -> log loop READ AS BUILT: it is the one row a
    responder, an auditor and a reliability review all read, closing the loop from the firing back to
    the observation that caused it.'
  tags:
  - gold
  authoritativeDefinitions:
  - url: outcome-packages/connected-store-signals/README.md
    type: businessDefinition
  - url: outcome-packages/connected-store-signals/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: store_id
    logicalType: string
    physicalType: STRING
    description: Durable store business key of the device that fired the loop.
  - name: store_zone_id
    logicalType: string
    physicalType: STRING
    description: Durable id of the zone the observing device is installed in.
  - name: sensor_device_id
    logicalType: string
    physicalType: STRING
    description: Durable id of the observing device whose reading breached the rule, resolved from the
      triggering interval version-in-effect. This is the device that CAUSED the firing.
  - name: device_type
    logicalType: string
    physicalType: STRING
    description: Kind of device that triggered the firing, e.g. temperature for the cold-chain excursion
      loop.
  - name: device_status
    logicalType: string
    physicalType: STRING
  - name: execution_log_id
    logicalType: string
    physicalType: STRING
    description: Durable id of the firing. Identifies the action-that-ran-against-its-triggering-observation,
      not merely the observation -- one breaching interval can fire several actions.
  - name: triggered_at_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    description: When the action fired (UTC). The ledger ordering key.
  - name: trading_date
    logicalType: date
    physicalType: DATE
    description: Business date of the breach that fired the loop, from the triggering interval; the firing
      date is the fallback when the trigger was not a canonical interval. The day-grain key for rollups.
  - name: execution_status
    logicalType: string
    physicalType: STRING
    description: 'Outcome of the firing: success, failure, pending, timeout or skipped.'
  - name: latency_ms
    logicalType: integer
    physicalType: BIGINT
    description: Milliseconds from the breaching observation to the firing. Automation RESPONSE latency,
      NOT ingest latency -- do not compare it to sensor_report_interval.latency_seconds.
  - name: response_latency_band
    logicalType: string
    physicalType: STRING
    description: fast (<= 250 ms), normal (<= 1000 ms), slow (> 1000 ms), or unknown. A responsiveness
      band, not a data-quality one.
  - name: response_payload
    logicalType: string
    physicalType: STRING
  - name: automation_action_id
    logicalType: string
    physicalType: STRING
  - name: action_type
    logicalType: string
    physicalType: STRING
    description: 'What kind of action fired: system_command, notification, webhook, ticket or log_only.
      One breach can fan out to several action types.'
  - name: target_entity_type
    logicalType: string
    physicalType: STRING
    description: The kind of thing the action targeted -- actuator, role, person or external_system. Only
      the actuator target carries a typed actuator FK (§A.5).
  - name: target_entity_id
    logicalType: string
    physicalType: STRING
    description: Durable id of the target, interpreted per target_entity_type.
  - name: action_is_enabled
    logicalType: boolean
    physicalType: BOOLEAN
    description: TRUE if the action version that fired was live. A disabled action leaves its rule firing
      but takes no effect.
  - name: payload_template
    logicalType: string
    physicalType: STRING
  - name: evaluation_rule_id
    logicalType: string
    physicalType: STRING
    description: Durable id of the rule whose breach fired the action.
  - name: rule_name
    logicalType: string
    physicalType: STRING
    description: Human-readable rule name, e.g. an over-temperature excursion on a named device.
  - name: report_type
    logicalType: string
    physicalType: STRING
    description: GS1 CBV property the rule watches, e.g. gs1:Temperature. Shared vocabulary with sensor_report_interval.report_type.
  - name: condition_operator
    logicalType: string
    physicalType: STRING
  - name: severity
    logicalType: string
    physicalType: STRING
    description: 'Operational severity of the breach: info, warning or critical.'
  - name: threshold_value_numeric
    logicalType: number
    physicalType: DOUBLE
    description: The threshold the observed value was compared against, in the rule unit, AS OF the firing.
      DOUBLE, matching sensor_report_interval.value (§A.6).
  - name: threshold_value_upper
    logicalType: number
    physicalType: DOUBLE
  - name: time_window_seconds
    logicalType: integer
    physicalType: INT
  - name: rule_uom_code
    logicalType: string
    physicalType: STRING
  - name: actuator_capability_id
    logicalType: string
    physicalType: STRING
    description: Durable id of the actuator the command hit. NULL for non-actuator actions or a retired
      actuator.
  - name: command_type
    logicalType: string
    physicalType: STRING
    description: What the actuator was commanded to do, e.g. toggle_power. NULL for a non-actuator action
      such as a notification.
  - name: actuator_status
    logicalType: string
    physicalType: STRING
  - name: equipment_id
    logicalType: string
    physicalType: STRING
    description: Durable business key of the asset the actuator drives, e.g. the refrigeration unit. NULL
      for ambient or digital-only actuation.
  - name: sensor_report_interval_sk
    logicalType: integer
    physicalType: BIGINT
    description: The reading interval that breached the rule, closing the loop back to the observation.
      NULL if the trigger was not a single canonical interval.
  - name: sensor_report_interval_id
    logicalType: string
    physicalType: STRING
  - name: breach_value
    logicalType: number
    physicalType: DOUBLE
    description: The observed value that breached the rule, in breach_uom. For the cold-chain loop this
      is the temperature that exceeded the limit.
  - name: breach_uom
    logicalType: string
    physicalType: STRING
  - name: interval_end_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
  - name: breach_margin
    logicalType: number
    physicalType: DOUBLE
    description: Signed difference of breach_value from threshold_value_numeric, in the rule unit. Positive
      means above threshold -- how far past the limit the reading was. A cross-operator magnitude is left
      to the consumer.
  - name: fresh_as_of_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
- name: gold_css_device_health
  physicalName: connected_store_signals.gold_css_device_health
  physicalType: view
  description: 'GRAIN: one row per device × report_type × aggregation_level × trading_date.'
  tags:
  - gold
  authoritativeDefinitions:
  - url: outcome-packages/connected-store-signals/README.md
    type: businessDefinition
  - url: outcome-packages/connected-store-signals/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: store_id
    logicalType: string
    physicalType: STRING
  - name: device_type
    logicalType: string
    physicalType: STRING
    description: The dimension that lets ONE view serve the whole estate. IoT, RFID and Smart Shelf add
      rows here, not new views.
  - name: trading_date
  - name: report_type
    logicalType: string
    physicalType: STRING
  - name: aggregation_level
    logicalType: string
    physicalType: STRING
  - name: sensor_device_id
    logicalType: string
    physicalType: STRING
  - name: sensor_device_sk
  - name: sensing_technology
    logicalType: string
    physicalType: STRING
    description: How the device senses. Drives both the accuracy and the privacy profile.
  - name: device_status
    logicalType: string
    physicalType: STRING
  - name: store_zone_id
    logicalType: string
    physicalType: STRING
  - name: manufacturer
    logicalType: string
    physicalType: STRING
  - name: model
    logicalType: string
    physicalType: STRING
  - name: firmware_version
    logicalType: string
    physicalType: STRING
    description: Current firmware. A common cause of a STEP CHANGE in counting behaviour, so group by
      it when investigating a discontinuity.
  - name: battery_powered
    logicalType: boolean
    physicalType: BOOLEAN
  - name: intervals_reported
  - name: observations_expected
    logicalType: integer
    physicalType: BIGINT
  - name: observations_received
  - name: missing_observation_rate
    logicalType: number
    physicalType: DOUBLE
    description: '1 - (observations_received / observations_expected). The primary fleet KPI. Re-aggregate
      it by summing the two component columns, never by averaging this ratio: an average lets a device
      expecting 4 observations outvote one expecting 400, which understates a fleet-wide outage.'
  - name: avg_uptime_ratio
    logicalType: number
    physicalType: DOUBLE
  - name: avg_coverage_ratio
    logicalType: number
    physicalType: DOUBLE
  - name: valid_intervals
    description: Count of intervals whose measurement was valid. Retained with invalid_intervals so valid-interval
      share can be re-aggregated from summed components.
  - name: valid_interval_share
  - name: invalid_intervals
    logicalType: integer
    physicalType: BIGINT
  - name: imputed_intervals
    logicalType: integer
    physicalType: BIGINT
  - name: observed_zero_intervals
    logicalType: integer
    physicalType: BIGINT
    description: Intervals with a MEASURED zero, as distinct from an absent row. Most vendors emit no
      row for either a zero-traffic interval or an offline sensor, which makes the two indistinguishable
      without this.
  - name: capped_intervals
    logicalType: integer
    physicalType: BIGINT
    description: Intervals that hit the hardware detection ceiling. A capped peak is NOT an exact peak.
  - name: late_arrived_intervals
    description: Intervals that landed after their window closed. These feeds are NOT append-only; vendors
      document data arriving hours or days late.
  - name: historical_message_count
    description: Delivered source messages marked as buffered or historical.
  - name: bad_quality_message_count
    logicalType: integer
    physicalType: BIGINT
    description: Delivered source messages marked bad or stale by the source.
  - name: max_restatement_version
    logicalType: integer
    physicalType: INT
  - name: last_interval_end_ts
  - name: last_ingest_ts
  - name: avg_latency_seconds
  - name: max_latency_seconds
  - name: feed_age_minutes
    logicalType: integer
    physicalType: INT
    description: Minutes since this device last landed data.
  - name: feed_freshness_status
    logicalType: string
    physicalType: STRING
    description: fresh (<= 60 min), delayed (<= 6 hr), stale (> 6 hr).
  - name: session_count
    logicalType: integer
    physicalType: BIGINT
    description: Distinct source_session_id values in the device-day.
  - name: had_session_restart
    logicalType: boolean
    physicalType: BOOLEAN
    description: TRUE when more than one source session appears in the device-day.
  - name: source_message_count
  - name: sequence_gap_count
    logicalType: integer
    physicalType: BIGINT
    description: Source messages inferred missing within source sessions, summed from interval-level summaries.
  - name: duplicate_delivery_count
    logicalType: integer
    physicalType: BIGINT
    description: Duplicate source-message deliveries, summed independently from sequence gaps.
  - name: calibration_valid_to
    logicalType: date
    physicalType: DATE
  - name: calibration_certificate_id
    logicalType: string
    physicalType: STRING
  - name: accuracy_tolerance
    logicalType: number
    physicalType: DOUBLE
    description: Rated accuracy in the device native unit. CDC/VFC requires +/-0.5 degC for vaccine storage.
  - name: probe_type
    logicalType: string
    physicalType: STRING
    description: buffered, air, glycol, surface or none. Vaccine storage requires BUFFERED; an air probe
      reacts to door openings and manufactures false excursions.
  - name: is_backup_device
    logicalType: boolean
    physicalType: BOOLEAN
    description: TRUE for the staggered-calibration backup unit required for vaccine storage.
  - name: calibration_status
    logicalType: string
    physicalType: STRING
    description: current, expiring_soon (<= 30 days), expired, or unknown. For vaccine storage an expiry
      is a compliance failure, not a maintenance backlog item.
  - name: bacnet_out_of_service
    logicalType: boolean
    physicalType: BOOLEAN
    description: BACnet Out_Of_Service. When TRUE the Present_Value is SIMULATED, so every reading from
      this device is fabricated.
  - name: sensing_deployment_id
    logicalType: string
    physicalType: STRING
  - name: sensing_method_code
    logicalType: string
    physicalType: STRING
  - name: deployment_status
    logicalType: string
    physicalType: STRING
  - name: dpia_completed_flag
    logicalType: boolean
    physicalType: BOOLEAN
    description: Whether the governing deployment has a completed impact assessment. Surfaced beside fleet
      health because the two are reviewed by different people who need the same row.
  - name: ai_act_notice_status
    logicalType: string
    physicalType: STRING
    description: AI Act Art. 50(3) deployer notice status. Applies from 2026-08-02 and was not postponed
      by the Digital Omnibus.
  - name: fresh_as_of_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
  quality:
  - name: css_device_health_grain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: css_device_health_grain
    query: 'SELECT sensor_device_sk, trading_date, report_type, aggregation_level, COUNT(*) AS n

      FROM connected_store_signals.gold_css_device_health

      GROUP BY sensor_device_sk, trading_date, report_type, aggregation_level

      HAVING COUNT(*) > 1'
- name: gold_inventory_accuracy_daily
  physicalName: connected_store_signals.gold_inventory_accuracy_daily
  physicalType: view
  description: 'GRAIN: count session × store × product × session trading date. Only full-store sessions
    closing in the reference EOD alignment window (20:00-02:59 local) receive the `aligned_eod` basis
    and inventory-accuracy label. Other sessions expose observed-to-book agreement only. `reconciliation_date`
    is the EOD inventory snapshot date. For sessions ending between 00:00 and 02:59 local it is the preceding
    local calendar date; it is deliberately distinct from the session''s declared `trading_date`. RFID
    eligibility is a documented heuristic: an active commissioned item for the product was observed at
    the store during the preceding 90 days.'
  tags:
  - gold
  authoritativeDefinitions:
  - url: outcome-packages/connected-store-signals/README.md
    type: businessDefinition
  - url: outcome-packages/connected-store-signals/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: rfid_count_session_sk
    logicalType: integer
    physicalType: BIGINT
  - name: rfid_count_session_id
    logicalType: string
    physicalType: STRING
  - name: store_sk
    logicalType: integer
    physicalType: BIGINT
  - name: store_id
    logicalType: string
    physicalType: STRING
  - name: product_sk
    logicalType: integer
    physicalType: BIGINT
  - name: product_id
    logicalType: string
    physicalType: STRING
  - name: trading_date
    logicalType: date
    physicalType: DATE
  - name: session_end_local_date
  - name: reconciliation_date
    description: EOD inventory snapshot date used for the comparison. Sessions ending 00:00-02:59 local
      reconcile to the preceding local date.
  - name: department
    logicalType: string
    physicalType: STRING
  - name: category
