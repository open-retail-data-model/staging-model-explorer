  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: store_id
    logicalType: string
    physicalType: STRING
  - name: store_zone_id
    logicalType: string
    physicalType: STRING
    description: Durable zone business key -- the SCD2-safe join key. Prefer this over the surrogate.
  - name: latest_store_zone_sk
  - name: zone_code
    description: Zone code as emitted by the source system.
  - name: zone_name
  - name: zone_type
    description: 'Depth in the spatial hierarchy: entrance, area, department, aisle, bay, shelf_position,
      queue, fitting_room.'
  - name: parent_zone_id
    description: Durable id of the containing zone.
  - name: hierarchy_depth
    description: Materialised depth (0 = site), so consumers avoid a recursive CTE.
  - name: is_sales_floor
  - name: trading_date
    logicalType: date
    physicalType: DATE
  - name: fiscal_year
    logicalType: integer
    physicalType: INT
  - name: fiscal_week_id
    logicalType: integer
    physicalType: INT
  - name: day_of_week
    logicalType: integer
    physicalType: INT
  - name: footfall_count
    logicalType: integer
    physicalType: BIGINT
    description: Zone footfall for the day. Additive over TIME within the zone; NOT additive across zones.
  - name: entry_count
    logicalType: integer
    physicalType: BIGINT
  - name: exit_count
    logicalType: integer
    physicalType: BIGINT
  - name: passersby_count
    logicalType: integer
    physicalType: BIGINT
    description: Pass-by traffic. Vendors define this two OPPOSITE ways (including or excluding entrants),
      so it is only comparable within one convention.
  - name: peak_occupancy
    logicalType: integer
    physicalType: BIGINT
    description: Zone peak occupancy. A STORE peak is not the MAX of these -- it comes from the site row.
  - name: avg_occupancy
    logicalType: number
    physicalType: DOUBLE
    description: Duration-weighted mean occupancy for the zone.
  - name: dwell_seconds_total
    logicalType: integer
    physicalType: BIGINT
  - name: dwell_count
    logicalType: integer
    physicalType: BIGINT
  - name: avg_dwell_seconds
    logicalType: number
    physicalType: DOUBLE
  - name: engaged_count
    logicalType: integer
    physicalType: BIGINT
    description: Dwell observations exceeding the engagement threshold.
  - name: passing_count
    logicalType: integer
    physicalType: BIGINT
    description: Dwell observations below the engagement threshold. Distinct from passersby_count, which
      is storefront traffic rather than a dwell bucket.
  - name: engagement_rate
    logicalType: number
    physicalType: DOUBLE
    description: engaged_count / dwell_count.
  - name: area_sqm_minutes
    logicalType: number
    physicalType: DECIMAL(12, 2)
    description: Zone area multiplied by the duration of intervals where area was known; numerator for
      re-aggregating effective area.
  - name: area_interval_minutes_total
    logicalType: integer
    physicalType: BIGINT
    description: Duration of intervals with a recorded zone area; denominator for area_sqm.
  - name: area_sqm
    logicalType: number
    physicalType: DECIMAL
    description: Duration-weighted effective zone floor area in square metres for the zone-day.
  - name: capacity_persons
    logicalType: number
    physicalType: DOUBLE
    description: Duration-weighted effective safe or design occupancy for the zone-day.
  - name: capacity_interval_minutes_total
    logicalType: integer
    physicalType: BIGINT
    description: Duration of intervals with a recorded zone capacity; denominator for capacity_persons.
  - name: footfall_per_sqm
    logicalType: number
    physicalType: DECIMAL
    description: 'Traffic density for THIS zone-day: footfall / area_sqm. Re-aggregating over several
      days divides by the summed area of the grouped zone-days, which yields an AVERAGE DAILY density
      rather than a period total -- mv_zone_foot_traffic names the measure avg_daily_footfall_per_sqm
      for that reason.'
  - name: occupancy_per_sqm
    logicalType: number
    physicalType: DOUBLE
    description: 'Occupancy density: avg_occupancy / area_sqm.'
  - name: peak_capacity_utilisation
    logicalType: number
    physicalType: DOUBLE
    description: peak_occupancy / capacity_persons. Above 1 is either a safety event or a broken counter.
  - name: counting_unit
    logicalType: string
    physicalType: STRING
  - name: staff_exclusion_enabled
    logicalType: boolean
    physicalType: BOOLEAN
  - name: avg_uptime_ratio
    logicalType: number
    physicalType: DOUBLE
  - name: avg_coverage_ratio
    logicalType: number
    physicalType: DOUBLE
  - name: valid_interval_share
    logicalType: number
    physicalType: DOUBLE
  - name: is_zero_observed
    logicalType: boolean
    physicalType: BOOLEAN
  - name: interval_count
    logicalType: integer
    physicalType: BIGINT
  - name: interval_minutes_total
    logicalType: integer
    physicalType: BIGINT
    description: Total duration of valid traffic intervals. This generic duration is not the denominator
      for measures reported on only some intervals.
  - name: occupancy_interval_minutes_total
    logicalType: integer
    physicalType: BIGINT
    description: Duration of valid intervals with a reported occupancy average; the re-aggregation denominator
      for avg_occupancy.
  - name: uptime_interval_minutes_total
    logicalType: integer
    physicalType: BIGINT
    description: Duration of intervals with a reported uptime ratio; the re-aggregation denominator for
      avg_uptime_ratio.
  - name: coverage_interval_minutes_total
    logicalType: integer
    physicalType: BIGINT
    description: Duration of intervals with a reported coverage ratio; the re-aggregation denominator
      for avg_coverage_ratio.
  - name: aggregation_level
    logicalType: string
    physicalType: STRING
    description: Always area for this view. NEVER sum footfall across rows of this view to get a store
      total -- use gold_store_traffic_daily_current.
  - name: fresh_as_of_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
  quality:
  - name: css_zone_traffic_grain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: css_zone_traffic_grain
    query: 'SELECT store_zone_id, trading_date, COUNT(*) AS n

      FROM connected_store_signals.gold_zone_traffic_current

      GROUP BY store_zone_id, trading_date

      HAVING COUNT(*) > 1'
- name: gold_zone_traffic_interval_shared
  physicalName: connected_store_signals.gold_zone_traffic_interval_shared
  physicalType: view
  description: 'GRAIN: one disclosure-approved canonical area interval.'
  tags:
  - gold
  authoritativeDefinitions:
  - url: outcome-packages/connected-store-signals/README.md
    type: businessDefinition
  - url: outcome-packages/connected-store-signals/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: shared_zone_traffic_interval_sk
    logicalType: integer
    physicalType: BIGINT
    description: Deterministic hash of the disclosure-safe shared interval id; it contains no device identity.
  - name: shared_zone_traffic_interval_id
    logicalType: string
    physicalType: STRING
    description: Disclosure-safe interval id built from store, zone, UTC start epoch, and duration; it
      contains no device identity.
  - name: store_sk
    logicalType: integer
    physicalType: BIGINT
    description: Store surrogate carried by the canonical interval.
  - name: store_id
    logicalType: string
    physicalType: STRING
    description: Durable store business key.
  - name: store_zone_id
    logicalType: string
    physicalType: STRING
    description: Durable zone business key.
  - name: zone_code
    logicalType: string
    physicalType: STRING
    description: Zone code from the exact dimension version referenced by the interval.
  - name: interval_start_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
    description: UTC start instant of the published canonical interval.
  - name: interval_end_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
    description: UTC end instant of the published canonical interval.
  - name: trading_date
    logicalType: date
    physicalType: DATE
    description: Business date used to resolve the effective disclosure policy.
  - name: interval_minutes
    logicalType: integer
    physicalType: INT
    description: Canonical interval duration. Rows below the policy minimum are omitted.
  - name: footfall_count
    logicalType: integer
    physicalType: BIGINT
    description: Zone footfall for an interval that cleared the effective threshold. Suppressed intervals
      are omitted rather than emitted with NULL.
  - name: dwell_seconds_total
    logicalType: integer
    physicalType: BIGINT
    description: Dwell numerator for a disclosure-approved interval.
  - name: dwell_count
    logicalType: integer
    physicalType: BIGINT
    description: Dwell denominator for a disclosure-approved interval.
  - name: avg_dwell_seconds
    logicalType: number
    physicalType: DOUBLE
    description: dwell_seconds_total / dwell_count for a disclosure-approved interval.
  - name: sensing_disclosure_policy_id
    logicalType: string
    physicalType: STRING
    description: Durable policy assignment whose effective version admitted this interval.
  quality:
  - name: shared_interval_policy_enforced
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: shared_interval_policy_enforced
    query: "SELECT s.shared_zone_traffic_interval_id\nFROM connected_store_signals.gold_zone_traffic_interval_shared\
      \ s\nJOIN connected_store_signals.sensor_report_interval f\n  ON s.shared_zone_traffic_interval_id\
      \ = CONCAT_WS(\n    '|',\n    f.store_id,\n    f.store_zone_id,\n    CAST(UNIX_TIMESTAMP(f.interval_start_ts)\
      \ AS STRING),\n    CAST(f.interval_minutes AS STRING)\n  )\nJOIN connected_store_signals.foot_traffic_interval_detail\
      \ t\n  ON f.sensor_report_interval_sk = t.sensor_report_interval_sk\nJOIN connected_store_signals.sensing_deployment\
      \ d\n  ON f.sensing_deployment_sk = d.sensing_deployment_sk\nJOIN connected_store_signals.sensing_disclosure_policy\
      \ p\n  ON d.external_disclosure_policy_id = p.sensing_disclosure_policy_id\n AND f.trading_date\
      \ >= p.effective_from_date\n AND (p.effective_to_date IS NULL OR f.trading_date < p.effective_to_date)\n\
      WHERE COALESCE(f.measurement_validity, 'valid') = 'invalid'\n   OR f.interval_minutes < p.minimum_interval_minutes\n\
      \   OR t.footfall_count IS NULL\n   OR (t.footfall_count = 0 AND p.suppress_zero_flag)\n   OR t.footfall_count\
      \ < p.k_threshold"
- name: gold_zone_traffic_shared
  physicalName: connected_store_signals.gold_zone_traffic_shared
  physicalType: view
  description: 'GRAIN: one row per durable store zone × trading_date, for an explicitly shared audience.
    Suppression is evaluated after canonical intervals have been aggregated to a day. Every traffic-derived
    measure is NULL together; operational truth remains in gold_zone_traffic_current.'
  tags:
