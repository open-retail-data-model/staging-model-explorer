  - name: store_id
    logicalType: string
    physicalType: STRING
    description: Durable store business key.
  - name: trading_date
    logicalType: date
    physicalType: DATE
    description: Business date whose effective disclosure policy governs this shared cell.
  - name: fiscal_year
    logicalType: integer
    physicalType: INT
    description: NRF fiscal year for the trading date.
  - name: fiscal_period
    logicalType: integer
    physicalType: INT
    description: NRF fiscal period for the trading date.
  - name: fiscal_week
