- name: gold_zone_traffic_current
  physicalName: connected_store_signals.gold_zone_traffic_current
  physicalType: view
  description: 'GRAIN: one row per store × zone × trading_date.'
  tags:
  - gold
  authoritativeDefinitions:
  - url: outcome-packages/connected-store-signals/README.md
    type: businessDefinition
  - url: outcome-packages/connected-store-signals/glossary.md
