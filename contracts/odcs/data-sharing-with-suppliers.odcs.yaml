    required: true
    description: 'SCD2: TRUE for the currently active version.'
  - name: created_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When the record was created in the source system (UTC, ISO 8601).
  - name: source_updated_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When the record was last modified in the source system (UTC, ISO 8601).
  - name: record_source
    logicalType: string
    physicalType: STRING
    required: false
    description: Originating system of record (vendor-neutral label).
  - name: load_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When this row was loaded (UTC, ISO 8601).
  quality:
  - name: re_keys_not_null
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: re_keys_not_null
    query: "SELECT * FROM data_sharing_with_suppliers.reporting_entitlement\nWHERE reporting_entitlement_sk\
      \ IS NULL OR reporting_entitlement_id IS NULL OR principal_id IS NULL\n   OR effective_from_date\
      \ IS NULL OR is_current IS NULL"
  - name: re_business_key_unique_current
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: re_business_key_unique_current
    query: 'SELECT reporting_entitlement_id, COUNT(*) AS n

      FROM data_sharing_with_suppliers.reporting_entitlement

      WHERE is_current = true GROUP BY reporting_entitlement_id HAVING COUNT(*) > 1'
  - name: re_advertiser_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: re_advertiser_fk_orphan
    query: 'SELECT e.* FROM data_sharing_with_suppliers.reporting_entitlement e

      LEFT JOIN commerce_media_networks.advertiser sb ON e.advertiser_sk = sb.advertiser_sk

      WHERE e.advertiser_sk IS NOT NULL AND sb.advertiser_sk IS NULL'
  - name: re_campaign_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: The optional campaign scope must resolve to an existing campaign (guarded; NULL = brand-wide).
    query: 'SELECT e.* FROM data_sharing_with_suppliers.reporting_entitlement e

      LEFT JOIN commerce_media_networks.campaign c ON e.campaign_sk = c.campaign_sk

      WHERE e.campaign_sk IS NOT NULL AND c.campaign_sk IS NULL'
  - name: re_status_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: re_status_domain
    query: 'SELECT * FROM data_sharing_with_suppliers.reporting_entitlement

      WHERE entitlement_status IS NOT NULL AND entitlement_status NOT IN (''active'', ''suspended'', ''revoked'')'
  - name: re_scd2_current_open
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: re_scd2_current_open
    query: 'SELECT * FROM data_sharing_with_suppliers.reporting_entitlement

      WHERE (is_current = true AND effective_to_date IS NOT NULL) OR (is_current = false AND effective_to_date
      IS NULL)'
- name: supplier_media_report_snapshot
