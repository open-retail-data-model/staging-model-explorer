    physicalType: BIGINT
    required: false
    description: Impressions disclosed.
  - name: viewable_impressions
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: Viewable impressions disclosed.
  - name: clicks
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: Clicks disclosed.
  - name: conversions
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: Attributed conversions disclosed.
  - name: units
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: Attributed units disclosed.
  - name: media_spend_net
    logicalType: number
    physicalType: DECIMAL(18,2)
    required: false
    description: Net media spend disclosed, reporting/base currency.
  - name: attributed_net_sales
    logicalType: number
    physicalType: DECIMAL(18,2)
    required: false
    description: Attributed net sales disclosed, reporting/base currency.
  - name: new_to_brand_sales
    logicalType: number
    physicalType: DECIMAL(18,2)
    required: false
    description: New-to-brand sales disclosed, reporting/base currency.
  - name: incremental_sales
    logicalType: number
    physicalType: DECIMAL(18,2)
    required: false
    description: Incremental sales disclosed, reporting/base currency.
  - name: roas_net
    logicalType: number
    physicalType: DECIMAL(12,4)
    required: false
    description: Return on ad spend at publish time.
  - name: iroas_value
    logicalType: number
    physicalType: DECIMAL(12,4)
    required: false
