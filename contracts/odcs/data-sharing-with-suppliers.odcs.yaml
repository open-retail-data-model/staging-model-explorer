  - name: currency_code
    logicalType: string
    physicalType: STRING
    required: false
    description: Amount currency, ISO 4217 alpha-3 (single reporting currency).
  - name: threshold_suppressed_flag
    logicalType: boolean
    physicalType: BOOLEAN
    required: false
    description: TRUE if any measure was threshold-suppressed before disclosure.
  - name: record_source
    logicalType: string
    physicalType: STRING
    required: false
    description: Originating system of record (vendor-neutral label).
  - name: load_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When this row was loaded (UTC, ISO 8601).
  quality:
  - name: smrs_grain_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: 'Grain integrity: assert the DURABLE business key, not the IDENTITY surrogate (*_sk is
      generated per row and can never collide — a tautology).'
    query: 'SELECT supplier_media_report_snapshot_id, COUNT(*) AS n

      FROM data_sharing_with_suppliers.supplier_media_report_snapshot

      GROUP BY supplier_media_report_snapshot_id HAVING COUNT(*) > 1'
  - name: smrs_advertiser_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: smrs_advertiser_fk_orphan
    query: 'SELECT s.* FROM data_sharing_with_suppliers.supplier_media_report_snapshot s

      LEFT JOIN commerce_media_networks.advertiser sb ON s.advertiser_sk = sb.advertiser_sk

      WHERE s.advertiser_sk IS NOT NULL AND sb.advertiser_sk IS NULL'
  - name: smrs_campaign_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: The optional campaign scope must resolve to an existing campaign (guarded; NULL = brand-wide).
    query: 'SELECT s.* FROM data_sharing_with_suppliers.supplier_media_report_snapshot s

      LEFT JOIN commerce_media_networks.campaign c ON s.campaign_sk = c.campaign_sk

      WHERE s.campaign_sk IS NOT NULL AND c.campaign_sk IS NULL'
  - name: smrs_report_level_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: smrs_report_level_domain
    query: 'SELECT * FROM data_sharing_with_suppliers.supplier_media_report_snapshot

      WHERE report_level IS NOT NULL AND report_level NOT IN (''brand'', ''campaign'', ''product'')'
  - name: smrs_single_currency
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: smrs_single_currency
    query: SELECT * FROM (SELECT COUNT(DISTINCT currency_code) AS n FROM data_sharing_with_suppliers.supplier_media_report_snapshot
      WHERE currency_code IS NOT NULL) WHERE n > 1
- name: gold_category_growth
  physicalName: data_sharing_with_suppliers.gold_category_growth
  physicalType: view
  description: 'Category growth, one row per category x fiscal period (NRF 4-5-4). Phase-0 decision: INTERPRETATION
    A (collaborative) -- growth analysed WITH and attributed TO suppliers, integrating the promo-ROI,
    customer-LTV and supplier scorecards (each a MATERIALIZED VIEW, so this view reads precomputed tables,
    not the recomputed DAG). Upstream signals are LEFT JOINed, so the view returns rows (and NULLs those
    columns) if an upstream view yields nothing.'
  tags:
  - gold
  authoritativeDefinitions:
  - url: outcome-packages/data-sharing-with-suppliers/README.md
    type: businessDefinition
  - url: outcome-packages/data-sharing-with-suppliers/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: category
    logicalType: string
    physicalType: STRING
    description: Merchandising category.
  - name: fiscal_year
    logicalType: integer
    physicalType: INT
    description: NRF fiscal year.
  - name: fiscal_period
    logicalType: integer
    physicalType: INT
    description: NRF 4-5-4 fiscal period (1-12).
  - name: category_revenue
    logicalType: number
    physicalType: DECIMAL(18, 2)
    description: Category net revenue in the period.
  - name: category_units
    logicalType: integer
    physicalType: BIGINT
    description: Category units sold in the period.
  - name: category_margin
    logicalType: number
    physicalType: DECIMAL(18, 2)
    description: Category gross margin (revenue - units x unit_cost).
  - name: prior_period_revenue
    logicalType: number
    physicalType: DECIMAL(18, 2)
    description: Revenue in the prior fiscal period (period_index - 1).
  - name: delta_revenue
    logicalType: number
    physicalType: DECIMAL(18, 2)
    description: category_revenue - prior_period_revenue (the four effects reconcile to this).
  - name: pop_growth_pct
    logicalType: number
    physicalType: DECIMAL
    description: Period-over-period revenue growth %; NULL when no prior period.
  - name: prior_year_revenue
    logicalType: number
    physicalType: DECIMAL(18, 2)
    description: Revenue in the same fiscal period last year (period_index - 12).
  - name: yoy_growth_pct
    logicalType: number
    physicalType: DECIMAL
    description: Year-over-year revenue growth %; NULL when no prior-year period.
  - name: distribution_effect
    logicalType: number
    physicalType: DOUBLE
    description: Delta-revenue from changing the number of product x store selling points.
  - name: volume_effect
    logicalType: number
    physicalType: DOUBLE
    description: Delta-revenue from changing units per selling point (depth).
  - name: price_effect
    logicalType: number
    physicalType: DOUBLE
    description: Delta-revenue from like-for-like sub-category price change.
  - name: mix_effect
    logicalType: number
    physicalType: DOUBLE
    description: Delta-revenue from shifting the sub-category mix.
  - name: category_share
    logicalType: number
    physicalType: DECIMAL
    description: category_revenue / total period revenue (sums to ~1 across categories).
  - name: promo_contribution
    logicalType: number
    physicalType: DECIMAL(18, 2)
    description: Incremental margin from promotions in the category that period (NULL if the promo view
      is absent).
  - name: value_share_platinum
    logicalType: number
    physicalType: DECIMAL
    description: Share of customer-attributed category revenue from PLATINUM CLV customers.
  - name: value_share_gold
    logicalType: number
    physicalType: DECIMAL
    description: Share of customer-attributed category revenue from GOLD CLV customers.
  - name: value_share_silver
    logicalType: number
    physicalType: DECIMAL
    description: Share of customer-attributed category revenue from SILVER CLV customers.
  - name: value_share_bronze
    logicalType: number
    physicalType: DECIMAL
    description: Share of customer-attributed category revenue from BRONZE CLV customers.
  - name: top_supplier_id
    logicalType: string
    physicalType: STRING
    description: Supplier with the largest share of category procurement spend.
  - name: supplier_top_share
    logicalType: number
    physicalType: DECIMAL
    description: That supplier share of category procurement spend.
  - name: supplier_top_score
    logicalType: number
    physicalType: DOUBLE
    description: That supplier average scorecard composite (NULL if the scorecard is absent).
  quality:
  - name: growth_decomposition_reconciles
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: The four effects must sum to delta_revenue within tolerance (when a prior period exists).
    query: "SELECT * FROM data_sharing_with_suppliers.gold_category_growth\nWHERE delta_revenue IS NOT\
      \ NULL\n  AND ABS((distribution_effect + volume_effect + price_effect + mix_effect) - delta_revenue)\
      \ > 0.01"
  - name: category_share_sums_to_one
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: category_share must sum to ~1.0 across categories within each fiscal period.
    query: 'SELECT fiscal_year, fiscal_period, SUM(category_share) AS share_sum

      FROM data_sharing_with_suppliers.gold_category_growth

      GROUP BY fiscal_year, fiscal_period

      HAVING ABS(SUM(category_share) - 1.0) > 0.001'
  - name: growth_pct_null_only_when_prior_absent
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: pop_growth_pct may be NULL only when the prior period is absent or zero.
    query: 'SELECT * FROM data_sharing_with_suppliers.gold_category_growth

      WHERE pop_growth_pct IS NULL AND prior_period_revenue IS NOT NULL AND prior_period_revenue <> 0'
  - name: category_growth_rowcount
    type: sql
    dimension: accuracy
    severity: info
    description: category_growth_rowcount
    query: SELECT COUNT(*) AS rows FROM data_sharing_with_suppliers.gold_category_growth
  - name: promo_contribution_null_rate
    type: sql
    dimension: accuracy
    severity: info
    description: 'Reported only: NULL-rate of the promo signal (degraded if gold_promo_roi is absent).'
    query: 'SELECT ROUND(AVG(CASE WHEN promo_contribution IS NULL THEN 1.0 ELSE 0.0 END), 4) AS promo_null_rate

      FROM data_sharing_with_suppliers.gold_category_growth'
  - name: value_mix_null_rate
    type: sql
    dimension: accuracy
    severity: info
    description: 'Reported only: NULL-rate of the value-tier-mix signal (degraded if gold_customer_ltv
      is absent).'
    query: 'SELECT ROUND(AVG(CASE WHEN value_share_platinum IS NULL THEN 1.0 ELSE 0.0 END), 4) AS value_mix_null_rate

      FROM data_sharing_with_suppliers.gold_category_growth'
  - name: supplier_contribution_null_rate
    type: sql
    dimension: accuracy
    severity: info
    description: 'Reported only: NULL-rate of the supplier signal (degraded if procurement/scorecard is
      absent).'
    query: 'SELECT ROUND(AVG(CASE WHEN top_supplier_id IS NULL THEN 1.0 ELSE 0.0 END), 4) AS supplier_null_rate

      FROM data_sharing_with_suppliers.gold_category_growth'
- name: gold_demand_plan_exceptions
  physicalName: data_sharing_with_suppliers.gold_demand_plan_exceptions
  physicalType: view
  description: 'CPFR exception queue over gold_joint_demand_plan: the plan rows that need collaborative
    attention, ranked by demand value at risk. An exception is raised when the two parties disagree beyond
    a tolerance, when a party has not submitted a plan for a scope the other party (or the consensus)
    did, or when the agreed consensus diverges materially from the statistical baseline. Reads only the
    entitled joint plan, so it exposes no row a partner could not already see.'
  tags:
  - gold
  authoritativeDefinitions:
  - url: outcome-packages/data-sharing-with-suppliers/README.md
    type: businessDefinition
  - url: outcome-packages/data-sharing-with-suppliers/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: principal_id
    logicalType: string
    physicalType: STRING
    description: Governance principal entitled to see this row (row-filter key).
  - name: supplier_id
    logicalType: string
    physicalType: STRING
    description: Durable supplier business key.
  - name: supplier_name
    logicalType: string
    physicalType: STRING
    description: Supplier registered/legal name.
  - name: product_id
    logicalType: string
    physicalType: STRING
    description: Durable product business key.
  - name: product_name
    logicalType: string
    physicalType: STRING
    description: Product display name.
  - name: fiscal_week_id
    logicalType: integer
    physicalType: INT
    description: Fiscal week identifier = fiscal_year * 100 + fiscal_week.
  - name: plan_cycle_id
    logicalType: string
    physicalType: STRING
    description: CPFR plan cycle the exception was raised in.
  - name: exception_reason
    logicalType: string
    physicalType: STRING
    description: 'Why the row needs attention. One of: missing_retailer_plan, missing_supplier_plan, party_disagreement,
      consensus_baseline_divergence.'
  - name: retailer_qty
    logicalType: integer
    physicalType: BIGINT
    description: Latest retailer-submitted demand quantity for the week.
  - name: supplier_qty
    logicalType: integer
    physicalType: BIGINT
    description: Latest supplier-submitted demand quantity for the week.
  - name: consensus_qty
    logicalType: integer
    physicalType: BIGINT
    description: Agreed consensus demand quantity for the week.
  - name: statistical_forecast_qty
    logicalType: number
    physicalType: DECIMAL
    description: Statistical demand baseline from the Smarter Demand package (NULL if absent).
  - name: plan_variance_pct
    logicalType: number
    physicalType: DOUBLE
    description: Retailer-vs-supplier disagreement on the latest submissions.
  - name: consensus_vs_baseline_pct
    logicalType: number
    physicalType: DOUBLE
    description: Consensus lift over the statistical baseline.
  - name: demand_value_at_risk
    logicalType: number
    physicalType: DECIMAL(18, 2)
    description: Consensus net value used to rank the exception queue.
  - name: currency_code
    logicalType: string
    physicalType: STRING
    description: Amount currency, ISO 4217 alpha-3.
  - name: priority_rank
    logicalType: integer
    physicalType: BIGINT
    description: Rank within a principal by demand_value_at_risk (1 = highest).
  - name: fresh_as_of_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
    description: View evaluation timestamp (UTC).
- name: gold_joint_demand_plan
  physicalName: data_sharing_with_suppliers.gold_joint_demand_plan
  physicalType: view
  description: 'The ENTITLED joint demand plan (CPFR reconciliation): per supplier × product × fiscal
    week, the latest retailer submission, the latest supplier submission, and the latest published consensus,
    joined to demand_collaboration so every row carries the principal_id permitted to see it (supplier-wide
    or product-scoped). This is the row-filter source for partner sharing; pairs with consensus_forecast_snapshot
    (the immutable published freeze).'
  tags:
  - gold
  authoritativeDefinitions:
  - url: outcome-packages/data-sharing-with-suppliers/README.md
    type: businessDefinition
  - url: outcome-packages/data-sharing-with-suppliers/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: principal_id
    logicalType: string
    physicalType: STRING
    description: Governance principal entitled to see this row (row-filter key).
  - name: supplier_id
    logicalType: string
    physicalType: STRING
    description: Durable supplier business key.
  - name: supplier_name
    logicalType: string
    physicalType: STRING
    description: Supplier registered/legal name.
  - name: product_id
    logicalType: string
    physicalType: STRING
    description: Durable product business key.
  - name: product_name
    logicalType: string
    physicalType: STRING
    description: Product display name.
  - name: fiscal_week_id
    logicalType: integer
    physicalType: INT
    description: Fiscal week identifier = fiscal_year * 100 + fiscal_week.
  - name: plan_cycle_id
    logicalType: string
    physicalType: STRING
    description: CPFR plan cycle the consensus was agreed in.
  - name: retailer_qty
    logicalType: integer
    physicalType: BIGINT
    description: Latest retailer-submitted demand quantity for the week.
  - name: supplier_qty
    logicalType: integer
    physicalType: BIGINT
    description: Latest supplier-submitted demand quantity for the week.
  - name: consensus_qty
    logicalType: integer
    physicalType: BIGINT
    description: Agreed consensus demand quantity for the week.
  - name: retailer_value_net
    logicalType: number
    physicalType: DECIMAL(18, 2)
    description: Latest retailer-submitted net value for the week, reporting/base currency.
  - name: supplier_value_net
    logicalType: number
    physicalType: DECIMAL(18, 2)
    description: Latest supplier-submitted net value for the week, reporting/base currency.
  - name: consensus_value_net
    logicalType: number
    physicalType: DECIMAL(18, 2)
    description: Agreed consensus net value, reporting/base currency.
  - name: currency_code
    logicalType: string
    physicalType: STRING
    description: Amount currency, ISO 4217 alpha-3.
  - name: statistical_forecast_qty
    logicalType: number
    physicalType: DECIMAL
    description: Statistical demand baseline from the Smarter Demand package, allocated to this supplier
      by its demand share of the product x week (so a product shared by multiple suppliers does not fan
      the whole-product baseline onto every row). NULL if that package is absent.
  - name: plan_variance_pct
    logicalType: number
    physicalType: DOUBLE
    description: Retailer-vs-supplier disagreement recomputed LIVE from the latest submissions = (retailer_qty
      - supplier_qty) / supplier_qty. Live counterpart of the frozen consensus_forecast_snapshot.variance_pct.
  - name: consensus_vs_baseline_pct
    logicalType: number
    physicalType: DOUBLE
    description: Consensus lift over the statistical baseline = (consensus_qty - statistical_forecast_qty)
      / statistical_forecast_qty.
  - name: fresh_as_of_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
    description: View evaluation timestamp (UTC).
  quality:
  - name: jdp_variance_present
    type: sql
    dimension: accuracy
    severity: info
    description: 'Reported only: NULL-rate of the party-disagreement signal (both parties must submit).'
    query: 'SELECT ROUND(AVG(CASE WHEN plan_variance_pct IS NULL THEN 1.0 ELSE 0.0 END), 4) AS plan_variance_null_rate

      FROM data_sharing_with_suppliers.gold_joint_demand_plan'
  - name: jdp_baseline_null_rate
    type: sql
    dimension: accuracy
    severity: info
    description: 'Reported only: NULL-rate of the statistical-baseline signal (degraded if the Smarter
      Demand package is absent — expected NULL-safe behavior, never a failure).'
    query: 'SELECT ROUND(AVG(CASE WHEN statistical_forecast_qty IS NULL THEN 1.0 ELSE 0.0 END), 4) AS
      baseline_null_rate

      FROM data_sharing_with_suppliers.gold_joint_demand_plan'
- name: gold_supplier_media_report
