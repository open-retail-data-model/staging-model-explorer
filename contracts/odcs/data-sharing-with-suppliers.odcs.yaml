  - name: campaign_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable campaign business key; NULL for brand-level.
  - name: report_level
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Aggregation level of the report row. Allowed values: brand, campaign, product.'
    quality:
    - type: text
      dimension: validity
      severity: error
