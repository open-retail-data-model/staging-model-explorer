  - name: report_period_start
    logicalType: date
    physicalType: DATE
    required: false
    description: Reporting period start, inclusive (ISO 8601).
  - name: report_period_end
    logicalType: date
    physicalType: DATE
    required: false
    description: Reporting period end, inclusive (ISO 8601).
  - name: snapshot_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: true
    description: When this report was published/frozen (UTC, ISO 8601).
  - name: snapshot_date
    logicalType: date
    physicalType: DATE
    required: true
    description: Publish date (cluster key).
  - name: report_version
    logicalType: integer
    physicalType: INT
    required: false
    description: Monotonic publish version for this scope/period (immutable per version).
  - name: impressions
