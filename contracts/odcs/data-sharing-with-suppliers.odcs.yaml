  physicalType: table
  description: Data Sharing with Suppliers — immutable published supplier media report snapshot (append-only).
  tags:
  - transactional
  authoritativeDefinitions:
  - url: outcome-packages/data-sharing-with-suppliers/README.md
    type: businessDefinition
  - url: outcome-packages/data-sharing-with-suppliers/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: supplier_media_report_snapshot_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Surrogate key.
  - name: supplier_media_report_snapshot_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable natural/business key (grain hash incl. report_version).
  - name: advertiser_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to cmn.advertiser.advertiser_sk.
