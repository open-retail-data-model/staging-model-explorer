        value: commerce_media_networks
      - property: enforced
        value: false
  - name: advertiser_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable advertiser business key.
  - name: campaign_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to cmn.campaign.campaign_sk (or NULL for brand-level).
    relationships:
    - to: campaign.campaign_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: commerce_media_networks
      - property: enforced
