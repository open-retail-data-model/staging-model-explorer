    advertiser × campaign, joined to reporting_entitlement so every row carries the principal_id permitted
    to see it (brand-wide or campaign-scoped). Threshold-suppressed and below-threshold rows are excluded.
    No person-level data. This is the row-filter source for supplier sharing; pairs with supplier_media_report_snapshot
    (the immutable published freeze).'
  tags:
  - gold
  authoritativeDefinitions:
  - url: outcome-packages/data-sharing-with-suppliers/README.md
    type: businessDefinition
  - url: outcome-packages/data-sharing-with-suppliers/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: principal_id
    logicalType: string
    physicalType: STRING
    description: Governance principal entitled to see this row (row-filter key).
  - name: advertiser_id
    logicalType: string
    physicalType: STRING
    description: Durable advertiser business key.
  - name: brand_name
    logicalType: string
    physicalType: STRING
    description: Advertised brand name.
  - name: campaign_id
    logicalType: string
    physicalType: STRING
    description: Durable campaign business key.
  - name: campaign_name
    logicalType: string
    physicalType: STRING
    description: Campaign display name.
  - name: impressions
    logicalType: integer
    physicalType: BIGINT
    description: Impressions disclosed to the supplier.
  - name: viewable_impressions
    logicalType: integer
    physicalType: BIGINT
  - name: clicks
    logicalType: integer
    physicalType: BIGINT
  - name: conversions
    logicalType: integer
    physicalType: BIGINT
  - name: units
    logicalType: integer
    physicalType: BIGINT
  - name: media_spend_net
    logicalType: number
    physicalType: DECIMAL(18, 2)
    description: Net media spend, reporting/base currency.
  - name: attributed_net_sales
    logicalType: number
    physicalType: DECIMAL(18, 2)
    description: Attributed net sales, reporting/base currency.
  - name: new_to_brand_sales
    logicalType: number
    physicalType: DECIMAL(18, 2)
  - name: incremental_sales
    logicalType: number
    physicalType: DECIMAL(18, 2)
  - name: roas_net
    logicalType: number
    physicalType: DOUBLE
    description: Return on ad spend.
  - name: iroas
