- name: gold_category_growth
  physicalName: data_sharing_with_suppliers.gold_category_growth
  physicalType: view
  description: 'Category growth, one row per category x fiscal period (NRF 4-5-4). Phase-0 decision: INTERPRETATION
    A (collaborative) -- growth analysed WITH and attributed TO suppliers, integrating the promo-ROI,
    customer-LTV and supplier scorecards (each a MATERIALIZED VIEW, so this view reads precomputed tables,
    not the recomputed DAG). Upstream signals are LEFT JOINed, so the view returns rows (and NULLs those
    columns) if an upstream view yields nothing.'
  tags:
  - gold
  authoritativeDefinitions:
  - url: outcome-packages/data-sharing-with-suppliers/README.md
    type: businessDefinition
  - url: outcome-packages/data-sharing-with-suppliers/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: category
    logicalType: string
    physicalType: STRING
    description: Merchandising category.
  - name: fiscal_year
    logicalType: integer
    physicalType: INT
    description: NRF fiscal year.
  - name: fiscal_period
    logicalType: integer
    physicalType: INT
    description: NRF 4-5-4 fiscal period (1-12).
  - name: category_revenue
    logicalType: number
    physicalType: DECIMAL(18, 2)
    description: Category net revenue in the period.
  - name: category_units
    logicalType: integer
    physicalType: BIGINT
    description: Category units sold in the period.
  - name: category_margin
    logicalType: number
    physicalType: DECIMAL(18, 2)
    description: Category gross margin (revenue - units x unit_cost).
  - name: prior_period_revenue
    logicalType: number
    physicalType: DECIMAL(18, 2)
    description: Revenue in the prior fiscal period (period_index - 1).
  - name: delta_revenue
    logicalType: number
    physicalType: DECIMAL(18, 2)
    description: category_revenue - prior_period_revenue (the four effects reconcile to this).
  - name: pop_growth_pct
    logicalType: number
    physicalType: DECIMAL
    description: Period-over-period revenue growth %; NULL when no prior period.
  - name: prior_year_revenue
    logicalType: number
    physicalType: DECIMAL(18, 2)
    description: Revenue in the same fiscal period last year (period_index - 12).
  - name: yoy_growth_pct
    logicalType: number
    physicalType: DECIMAL
    description: Year-over-year revenue growth %; NULL when no prior-year period.
  - name: distribution_effect
    logicalType: number
    physicalType: DOUBLE
    description: Delta-revenue from changing the number of product x store selling points.
  - name: volume_effect
    logicalType: number
    physicalType: DOUBLE
    description: Delta-revenue from changing units per selling point (depth).
  - name: price_effect
    logicalType: number
    physicalType: DOUBLE
    description: Delta-revenue from like-for-like sub-category price change.
  - name: mix_effect
    logicalType: number
    physicalType: DOUBLE
    description: Delta-revenue from shifting the sub-category mix.
  - name: category_share
    logicalType: number
    physicalType: DECIMAL
    description: category_revenue / total period revenue (sums to ~1 across categories).
  - name: promo_contribution
    logicalType: number
    physicalType: DECIMAL(18, 2)
    description: Incremental margin from promotions in the category that period (NULL if the promo view
      is absent).
  - name: value_share_platinum
    logicalType: number
    physicalType: DECIMAL
    description: Share of customer-attributed category revenue from PLATINUM CLV customers.
  - name: value_share_gold
    logicalType: number
    physicalType: DECIMAL
    description: Share of customer-attributed category revenue from GOLD CLV customers.
  - name: value_share_silver
    logicalType: number
    physicalType: DECIMAL
    description: Share of customer-attributed category revenue from SILVER CLV customers.
  - name: value_share_bronze
    logicalType: number
    physicalType: DECIMAL
    description: Share of customer-attributed category revenue from BRONZE CLV customers.
  - name: top_supplier_id
    logicalType: string
    physicalType: STRING
    description: Supplier with the largest share of category procurement spend.
  - name: supplier_top_share
    logicalType: number
    physicalType: DECIMAL
    description: That supplier share of category procurement spend.
  - name: supplier_top_score
    logicalType: number
    physicalType: DOUBLE
    description: That supplier average scorecard composite (NULL if the scorecard is absent).
  quality:
  - name: growth_decomposition_reconciles
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: The four effects must sum to delta_revenue within tolerance (when a prior period exists).
    query: "SELECT * FROM data_sharing_with_suppliers.gold_category_growth\nWHERE delta_revenue IS NOT\
      \ NULL\n  AND ABS((distribution_effect + volume_effect + price_effect + mix_effect) - delta_revenue)\
      \ > 0.01"
  - name: category_share_sums_to_one
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: category_share must sum to ~1.0 across categories within each fiscal period.
    query: 'SELECT fiscal_year, fiscal_period, SUM(category_share) AS share_sum

      FROM data_sharing_with_suppliers.gold_category_growth

      GROUP BY fiscal_year, fiscal_period

      HAVING ABS(SUM(category_share) - 1.0) > 0.001'
  - name: growth_pct_null_only_when_prior_absent
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: pop_growth_pct may be NULL only when the prior period is absent or zero.
    query: 'SELECT * FROM data_sharing_with_suppliers.gold_category_growth

      WHERE pop_growth_pct IS NULL AND prior_period_revenue IS NOT NULL AND prior_period_revenue <> 0'
  - name: category_growth_rowcount
    type: sql
    dimension: accuracy
    severity: info
    description: category_growth_rowcount
    query: SELECT COUNT(*) AS rows FROM data_sharing_with_suppliers.gold_category_growth
  - name: promo_contribution_null_rate
    type: sql
    dimension: accuracy
    severity: info
    description: 'Reported only: NULL-rate of the promo signal (degraded if gold_promo_roi is absent).'
    query: 'SELECT ROUND(AVG(CASE WHEN promo_contribution IS NULL THEN 1.0 ELSE 0.0 END), 4) AS promo_null_rate

      FROM data_sharing_with_suppliers.gold_category_growth'
  - name: value_mix_null_rate
    type: sql
    dimension: accuracy
    severity: info
    description: 'Reported only: NULL-rate of the value-tier-mix signal (degraded if gold_customer_ltv
      is absent).'
    query: 'SELECT ROUND(AVG(CASE WHEN value_share_platinum IS NULL THEN 1.0 ELSE 0.0 END), 4) AS value_mix_null_rate

      FROM data_sharing_with_suppliers.gold_category_growth'
  - name: supplier_contribution_null_rate
    type: sql
    dimension: accuracy
    severity: info
    description: 'Reported only: NULL-rate of the supplier signal (degraded if procurement/scorecard is
      absent).'
    query: 'SELECT ROUND(AVG(CASE WHEN top_supplier_id IS NULL THEN 1.0 ELSE 0.0 END), 4) AS supplier_null_rate

      FROM data_sharing_with_suppliers.gold_category_growth'
- name: gold_supplier_media_report
