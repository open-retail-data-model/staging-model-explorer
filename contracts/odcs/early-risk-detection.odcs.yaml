    physicalType: STRING
  - name: store_sk
    logicalType: integer
    physicalType: BIGINT
  - name: units_on_hand_eod
    logicalType: number
    physicalType: DECIMAL(12, 3)
  - name: units_in_transit
    logicalType: number
    physicalType: DECIMAL(12, 3)
  - name: is_stockout
    logicalType: boolean
    physicalType: BOOLEAN
  - name: stockout_pct_day
    logicalType: number
    physicalType: DECIMAL(5, 4)
  - name: snapshot_date
    logicalType: date
    physicalType: DATE
  - name: trailing_units_sold
    logicalType: integer
    physicalType: BIGINT
  - name: avg_daily_sales
    logicalType: number
    physicalType: DOUBLE
    description: Trailing 14-day average daily unit sales.
  - name: days_of_supply
    logicalType: number
    physicalType: DOUBLE
    description: units_on_hand_eod / avg_daily_sales. NULL if no sales velocity.
  - name: days_of_supply_with_transit
    logicalType: number
    physicalType: DOUBLE
    description: (on_hand + in_transit) / avg_daily_sales. Includes replenishment en route.
  - name: stockout_risk_score
    logicalType: integer
    physicalType: INT
    description: '0-100 score: higher = more risk. 100 = currently stocked out.'
  - name: inventory_risk_tier
    logicalType: string
    physicalType: STRING
    description: stockout / critical / at_risk / healthy based on days-of-supply.
  quality:
  - name: inv_risk_dos_nonnegative
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: inv_risk_dos_nonnegative
    query: 'SELECT * FROM early_risk_detection.gold_inventory_risk

      WHERE days_of_supply IS NOT NULL AND days_of_supply < 0'
  - name: inv_risk_score_range
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: inv_risk_score_range
    query: 'SELECT * FROM early_risk_detection.gold_inventory_risk

      WHERE stockout_risk_score NOT BETWEEN 0 AND 100'
  - name: inv_risk_tier_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: inv_risk_tier_domain
    query: 'SELECT * FROM early_risk_detection.gold_inventory_risk

      WHERE inventory_risk_tier NOT IN (''stockout'', ''critical'', ''at_risk'', ''healthy'')'
  - name: inv_risk_product_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: inv_risk_product_fk_orphan
    query: 'SELECT ir.* FROM early_risk_detection.gold_inventory_risk ir

      LEFT JOIN product.product p ON ir.product_sk = p.product_sk

      WHERE p.product_sk IS NULL'
  - name: inv_risk_store_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: inv_risk_store_fk_orphan
    query: 'SELECT ir.* FROM early_risk_detection.gold_inventory_risk ir

      LEFT JOIN store.store st ON ir.store_sk = st.store_sk

      WHERE st.store_sk IS NULL'
  - name: inv_risk_rowcount
    type: sql
    dimension: accuracy
    severity: info
    description: inv_risk_rowcount
    query: SELECT COUNT(*) AS inv_risk_rows FROM early_risk_detection.gold_inventory_risk
  - name: inv_risk_critical_count
    type: sql
    dimension: accuracy
    severity: info
    description: inv_risk_critical_count
    query: 'SELECT COUNT(*) AS critical_or_stockout

      FROM early_risk_detection.gold_inventory_risk

      WHERE inventory_risk_tier IN (''stockout'', ''critical'')'
- name: gold_procurement_risk
  physicalName: early_risk_detection.gold_procurement_risk
  physicalType: view
  description: 'A procurement risk register: one row per supplier (current fiscal period), with the contributing
    factors as columns so the register explains itself. Built on gold_supplier_scorecard (a MATERIALIZED
    VIEW) plus sourcing/spend from the PO-line fact.'
  tags:
  - gold
  authoritativeDefinitions:
  - url: outcome-packages/early-risk-detection/README.md
    type: businessDefinition
  - url: outcome-packages/early-risk-detection/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: supplier_sk
    logicalType: integer
    physicalType: BIGINT
    description: Supplier surrogate key.
  - name: supplier_id
    logicalType: string
    physicalType: STRING
    description: Durable supplier business key.
  - name: supplier_name
    logicalType: string
    physicalType: STRING
    description: Supplier name.
  - name: country_code
    logicalType: string
    physicalType: STRING
    description: Supplier country, ISO 3166-1 alpha-2.
  - name: composite_current
    logicalType: number
    physicalType: DOUBLE
    description: Current-period scorecard composite (0-100).
  - name: performance_risk
    logicalType: number
    physicalType: DOUBLE
    description: Risk from current performance = 100 - composite_current (0-100).
  - name: trend_risk
    logicalType: number
    physicalType: DOUBLE
    description: Risk from deterioration over the trailing 4 periods (0-100); fires even with an OK current
      score.
  - name: concentration_risk
    logicalType: number
    physicalType: DECIMAL
    description: 100 x concentration_hhi.
  - name: concentration_hhi
    logicalType: number
    physicalType: DECIMAL
    description: Spend-weighted avg category Herfindahl index, fractional [0,1].
  - name: single_source_flag
    logicalType: boolean
    physicalType: BOOLEAN
    description: TRUE if the supplier is the sole source of >= 1 SKU.
  - name: single_sourced_sku_count
    logicalType: integer
    physicalType: BIGINT
    description: Number of SKUs sole-sourced by this supplier.
  - name: geo_risk
    logicalType: number
    physicalType: DECIMAL
    description: 100 x the largest single-country spend share among the supplier categories (own country).
  - name: geo_concentration_flag
    logicalType: boolean
    physicalType: BOOLEAN
    description: TRUE if that country share exceeds 0.60.
  - name: risk_score
    logicalType: number
    physicalType: DOUBLE
    description: 'Weighted blend: performance 25, trend 30, concentration 20, single_source 15, geo 10.'
  - name: risk_tier
    logicalType: string
    physicalType: STRING
    description: LOW / MEDIUM / HIGH / CRITICAL; single-source or steep trend escalate to at least HIGH.
  - name: top_risk_factors
    logicalType: string
    physicalType: STRING
    description: Up to 3 factors with the largest weighted contribution.
  quality:
  - name: risk_hhi_range
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: risk_hhi_range
    query: 'SELECT * FROM early_risk_detection.gold_procurement_risk

      WHERE concentration_hhi IS NOT NULL AND concentration_hhi NOT BETWEEN 0 AND 1'
  - name: risk_score_range
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: risk_score_range
    query: 'SELECT * FROM early_risk_detection.gold_procurement_risk

      WHERE risk_score IS NOT NULL AND risk_score NOT BETWEEN 0 AND 100'
  - name: risk_tier_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: risk_tier_domain
    query: 'SELECT * FROM early_risk_detection.gold_procurement_risk

      WHERE risk_tier NOT IN (''LOW'', ''MEDIUM'', ''HIGH'', ''CRITICAL'')'
  - name: risk_supplier_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: risk_supplier_fk_orphan
    query: 'SELECT g.* FROM early_risk_detection.gold_procurement_risk g

      LEFT JOIN supplier.supplier s ON g.supplier_sk = s.supplier_sk

      WHERE s.supplier_sk IS NULL'
  - name: risk_rowcount
    type: sql
    dimension: accuracy
    severity: info
    description: risk_rowcount
    query: SELECT COUNT(*) AS risk_rows FROM early_risk_detection.gold_procurement_risk
  - name: risk_high_critical_count
    type: sql
    dimension: accuracy
    severity: info
    description: risk_high_critical_count
    query: 'SELECT COUNT(*) AS high_or_critical

      FROM early_risk_detection.gold_procurement_risk

      WHERE risk_tier IN (''HIGH'', ''CRITICAL'')'
  - name: risk_single_source_count
    type: sql
    dimension: accuracy
    severity: info
    description: risk_single_source_count
    query: 'SELECT COUNT(*) AS single_source_suppliers

      FROM early_risk_detection.gold_procurement_risk

      WHERE single_source_flag = true'
- name: gold_shipment_current_state
  physicalName: early_risk_detection.gold_shipment_current_state
  physicalType: view
  description: 'Current-state view: one row per shipment showing its latest tracking checkpoint, carrier
    ETA, and transit progress. Driven from the shipment header with a LEFT JOIN to the canonical-core
    shipment_tracking feed, so shipments with no tracking events yet (e.g. planned, pre-first-scan) are
    still visible with their header status. Transit elapsed is capped at actual_arrival_date for delivered
    shipments.'
  tags:
  - gold
  authoritativeDefinitions:
  - url: outcome-packages/early-risk-detection/README.md
    type: businessDefinition
  - url: outcome-packages/early-risk-detection/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: shipment_sk
    logicalType: integer
    physicalType: BIGINT
  - name: shipment_id
    logicalType: string
    physicalType: STRING
    description: Durable shipment business key.
  - name: supplier_id
    logicalType: string
    physicalType: STRING
  - name: supplier_sk
    logicalType: integer
    physicalType: BIGINT
  - name: supplier_name
    logicalType: string
    physicalType: STRING
  - name: lane_sk
    logicalType: integer
    physicalType: BIGINT
  - name: lane_id
    logicalType: string
    physicalType: STRING
  - name: destination_store_id
    logicalType: string
    physicalType: STRING
  - name: carrier_name
    logicalType: string
    physicalType: STRING
  - name: transport_mode
    logicalType: string
    physicalType: STRING
  - name: ship_date
    logicalType: date
    physicalType: DATE
  - name: original_eta_date
    logicalType: date
    physicalType: DATE
  - name: estimated_arrival_date
    logicalType: date
    physicalType: DATE
  - name: actual_arrival_date
    logicalType: date
    physicalType: DATE
  - name: current_status
    logicalType: string
    physicalType: STRING
    description: Latest carrier checkpoint type (e.g. in_transit, delivered, exception).
  - name: current_status_reason
    logicalType: string
    physicalType: STRING
    description: Carrier message text for the latest checkpoint.
  - name: last_event_timestamp
    logicalType: date
    physicalType: TIMESTAMP
    description: Timestamp of the most recent carrier tracking event.
  - name: last_known_location
    logicalType: string
    physicalType: STRING
    description: Facility name from the most recent tracking event.
  - name: last_known_city
    logicalType: string
    physicalType: STRING
    description: City from the most recent tracking event.
  - name: last_known_country
    logicalType: string
    physicalType: STRING
    description: Country code (ISO 3166-1 alpha-2) from the most recent tracking event.
  - name: last_known_latitude
    logicalType: number
    physicalType: DOUBLE
  - name: last_known_longitude
    logicalType: number
    physicalType: DOUBLE
  - name: carrier_code
    logicalType: string
    physicalType: STRING
    description: Standardized carrier identifier (SCAC or BIC code).
  - name: tracking_number
    logicalType: string
    physicalType: STRING
    description: Carrier-assigned tracking or waybill number.
  - name: current_eta_date
    logicalType: date
    physicalType: DATE
    description: 'Most recent ETA: carrier_eta from the latest tracking event, or the shipment estimated_arrival_date.'
  - name: eta_slip_days
    logicalType: integer
    physicalType: INT
    description: Days between current ETA and original ETA. Positive = late.
  - name: transit_elapsed_days
    logicalType: integer
    physicalType: INT
    description: Calendar days since ship_date.
  - name: planned_transit_days
    logicalType: integer
    physicalType: INT
  - name: last_ingest_timestamp
    logicalType: date
    physicalType: TIMESTAMP
  - name: last_event_latency_seconds
    logicalType: integer
    physicalType: INT
    description: Ingest latency of the most recent tracking event, in seconds.
- name: gold_supplier_scorecard
  physicalName: early_risk_detection.gold_supplier_scorecard
  physicalType: view
  description: Per-supplier performance scorecard, one row per supplier x fiscal period (NRF 4-5-4 period
    from the fiscal calendar). The objective input to procurement-risk decisions.
  tags:
  - gold
  authoritativeDefinitions:
  - url: outcome-packages/early-risk-detection/README.md
    type: businessDefinition
  - url: outcome-packages/early-risk-detection/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: supplier_sk
    logicalType: integer
    physicalType: BIGINT
    description: Supplier surrogate key.
  - name: supplier_id
    logicalType: string
    physicalType: STRING
    description: Durable supplier business key.
  - name: supplier_name
    logicalType: string
    physicalType: STRING
    description: Supplier name.
  - name: country_code
    logicalType: string
    physicalType: STRING
    description: Supplier country, ISO 3166-1 alpha-2.
  - name: fiscal_year
    logicalType: integer
    physicalType: INT
    description: NRF fiscal year.
  - name: fiscal_period
    logicalType: integer
    physicalType: INT
    description: NRF 4-5-4 fiscal period (1-12).
  - name: order_lines
    logicalType: integer
    physicalType: BIGINT
    description: Order lines in the period (OTIF / price-compliance denominator).
  - name: otif_pct
    logicalType: number
    physicalType: DOUBLE
    description: 'On-Time In-Full rate: lines on time AND in full / total lines.'
  - name: fill_rate
    logicalType: number
    physicalType: DOUBLE
    description: SUM(received_qty) / SUM(ordered_qty).
  - name: avg_lead_time_days
    logicalType: number
    physicalType: DOUBLE
    description: Mean (actual_delivery_date - order_date) over delivered lines.
  - name: lead_time_variance
    logicalType: number
    physicalType: DOUBLE
    description: Population variance (var_pop) of lead time; higher = less reliable.
  - name: defect_rate
    logicalType: number
    physicalType: DOUBLE
    description: (defective + returned units) / received units.
  - name: price_compliance_pct
    logicalType: number
    physicalType: DOUBLE
    description: Share of lines invoiced at or below contract price.
  - name: composite_score
    logicalType: number
    physicalType: DOUBLE
    description: 'Weighted 0-100 score: OTIF 35, fill 25, lead-time reliability 20, defect 15, price 5.'
  quality:
  - name: scorecard_otif_pct_range
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: scorecard_otif_pct_range
    query: 'SELECT * FROM early_risk_detection.gold_supplier_scorecard

      WHERE otif_pct IS NOT NULL AND otif_pct NOT BETWEEN 0 AND 1'
  - name: scorecard_fill_rate_range
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: scorecard_fill_rate_range
    query: 'SELECT * FROM early_risk_detection.gold_supplier_scorecard

      WHERE fill_rate IS NOT NULL AND fill_rate NOT BETWEEN 0 AND 1'
  - name: scorecard_defect_rate_range
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: scorecard_defect_rate_range
    query: 'SELECT * FROM early_risk_detection.gold_supplier_scorecard

      WHERE defect_rate IS NOT NULL AND defect_rate NOT BETWEEN 0 AND 1'
  - name: scorecard_composite_range
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: scorecard_composite_range
    query: 'SELECT * FROM early_risk_detection.gold_supplier_scorecard

      WHERE composite_score IS NOT NULL AND composite_score NOT BETWEEN 0 AND 100'
  - name: scorecard_supplier_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: scorecard_supplier_fk_orphan
    query: 'SELECT g.* FROM early_risk_detection.gold_supplier_scorecard g

      LEFT JOIN supplier.supplier s ON g.supplier_sk = s.supplier_sk

      WHERE s.supplier_sk IS NULL'
  - name: scorecard_rowcount
    type: sql
    dimension: accuracy
    severity: info
    description: scorecard_rowcount
    query: SELECT COUNT(*) AS scorecard_rows FROM early_risk_detection.gold_supplier_scorecard
  - name: scorecard_composite_null_rate
    type: sql
    dimension: accuracy
    severity: info
    description: scorecard_composite_null_rate
    query: 'SELECT ROUND(AVG(CASE WHEN composite_score IS NULL THEN 1.0 ELSE 0.0 END), 4) AS composite_null_rate

      FROM early_risk_detection.gold_supplier_scorecard'
  - name: scorecard_price_compliance_null_rate
    type: sql
    dimension: accuracy
    severity: info
    description: scorecard_price_compliance_null_rate
    query: 'SELECT ROUND(AVG(CASE WHEN price_compliance_pct IS NULL THEN 1.0 ELSE 0.0 END), 4) AS price_compliance_null_rate

      FROM early_risk_detection.gold_supplier_scorecard'
  - name: scorecard_composite_spread
    type: sql
    dimension: accuracy
    severity: info
    description: scorecard_composite_spread
    query: 'SELECT ROUND(STDDEV_POP(composite_score), 4) AS composite_stddev

      FROM early_risk_detection.gold_supplier_scorecard'
