- name: gold_promo_roi
  physicalName: promote_with_purpose.gold_promo_roi
  physicalType: view
  description: 'Did the promotion pay off? One row per completed promotion: incremental units / revenue
    / margin over baseline, ROI on trade spend, realized vs planned lift, and the two value-killers (cannibalization,
    forward buy).'
  tags:
  - gold
  authoritativeDefinitions:
  - url: outcome-packages/promote-with-purpose/README.md
    type: businessDefinition
  - url: outcome-packages/promote-with-purpose/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: promo_id
    logicalType: string
    physicalType: STRING
    description: Promotion business key.
  - name: promo_name
    logicalType: string
    physicalType: STRING
    description: Promotion name.
  - name: promo_type
    logicalType: string
    physicalType: STRING
    description: 'Mechanic: TPR / FEATURE / DISPLAY / FEATURE_AND_DISPLAY / BOGO / COUPON / BUNDLE.'
  - name: funding_type
    logicalType: string
    physicalType: STRING
    description: OFF_INVOICE / BILL_BACK / SCAN_DOWN / LUMP_SUM.
  - name: funded_by
    logicalType: string
    physicalType: STRING
    description: SUPPLIER / RETAILER / SHARED.
  - name: start_date
    logicalType: date
    physicalType: DATE
  - name: end_date
    logicalType: date
    physicalType: DATE
  - name: promoted_units
    logicalType: integer
    physicalType: BIGINT
    description: Units sold on promotion.
  - name: promoted_revenue
    logicalType: number
    physicalType: DECIMAL(18, 2)
    description: Net revenue on promotion.
  - name: promoted_margin
    logicalType: number
    physicalType: DECIMAL(18, 2)
    description: Gross margin on promotion.
  - name: baseline_units
    logicalType: number
    physicalType: DOUBLE
    description: Expected non-promoted units over the promo window (trailing-8-week baseline).
  - name: baseline_revenue
    logicalType: number
    physicalType: DECIMAL(18, 4)
    description: Baseline units valued at normal price.
  - name: baseline_margin
    logicalType: number
    physicalType: DECIMAL(18, 4)
    description: Baseline units valued at normal margin.
  - name: incremental_units
    logicalType: number
    physicalType: DOUBLE
    description: promoted_units - baseline_units (NOT clamped; negative = lost volume).
  - name: incremental_revenue
    logicalType: number
    physicalType: DECIMAL(18, 2)
    description: promoted_revenue - baseline_revenue.
  - name: incremental_margin
    logicalType: number
    physicalType: DECIMAL(18, 2)
    description: promoted_margin - baseline_margin.
  - name: trade_spend
    logicalType: number
    physicalType: DECIMAL
    description: Planned trade spend (realized actuals not modelled in v1).
  - name: roi
    logicalType: number
    physicalType: DECIMAL
    description: incremental_margin / NULLIF(trade_spend, 0); NULL-safe.
  - name: planned_lift_pct
    logicalType: number
    physicalType: DECIMAL(6, 2)
    description: Planned incremental unit lift %.
  - name: realized_lift_pct
    logicalType: number
    physicalType: DOUBLE
    description: 100 x incremental_units / baseline_units.
  - name: cannibalization_units
    logicalType: number
    physicalType: DOUBLE
    description: Lost units on substitute SKUs (same category, not on promo) during the window.
  - name: cannibalization_margin
    logicalType: number
    physicalType: DECIMAL(18, 4)
    description: Margin lost to cannibalization.
  - name: forward_buy_units
    logicalType: number
    physicalType: DOUBLE
    description: Lost units on promoted SKUs in the N weeks after the promo (pantry loading).
  - name: forward_buy_margin
    logicalType: number
    physicalType: DECIMAL(18, 4)
    description: Margin lost to forward buy.
  - name: net_incremental_margin
    logicalType: number
    physicalType: DECIMAL(18, 2)
    description: incremental_margin - cannibalization_margin - forward_buy_margin (negative = value destroyed).
  quality:
  - name: roi_null_only_when_no_trade_spend
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: ROI may be NULL only when trade_spend is 0/NULL (divide-by-zero guard) or when incremental
      margin is itself undefined (no baseline). It must NOT be NULL when both trade_spend and incremental_margin
      are present.
    query: "SELECT * FROM promote_with_purpose.gold_promo_roi\nWHERE roi IS NULL\n  AND trade_spend IS\
      \ NOT NULL AND trade_spend <> 0\n  AND incremental_margin IS NOT NULL"
  - name: gold_promo_roi_rowcount
    type: sql
    dimension: accuracy
    severity: info
    description: gold_promo_roi_rowcount
    query: SELECT COUNT(*) AS promo_rows FROM promote_with_purpose.gold_promo_roi
  - name: gold_promo_roi_baseline_coverage
    type: sql
    dimension: accuracy
    severity: info
    description: 'Reported only: share of promos with no usable baseline (NULL/zero), so incremental/ROI
      are undefined for them. Surfaced, not a failure.'
    query: "SELECT ROUND(AVG(CASE WHEN baseline_units IS NULL OR baseline_units = 0 THEN 1.0 ELSE 0.0\
      \ END), 4)\n         AS baseline_missing_rate\nFROM promote_with_purpose.gold_promo_roi"
  - name: gold_promo_roi_negative_net_count
    type: sql
    dimension: accuracy
    severity: info
    description: 'Reported only: number of promos that lost money on a net-incremental basis (cannibalization
      + forward-buy outweigh incremental margin). Not clamped.'
    query: 'SELECT COUNT(*) AS promos_with_negative_net

      FROM promote_with_purpose.gold_promo_roi

      WHERE net_incremental_margin < 0'
- name: gold_promo_roi_by_category
  physicalName: promote_with_purpose.gold_promo_roi_by_category
  physicalType: view
  description: 'Post-Promotion ROI at promo x category grain. gold_promo_roi rolls this up to one row
    per promo. Definitions: baseline_*        : from the trailing-8 non-promoted-week mean (gold_weekly_baseline),
    summed over the promo window (i.e. scaled to the promo''s duration). incremental_units = promoted_units
    - baseline_units (NOT clamped; a negative value is a real "promo lost volume" signal). incremental_margin=
    promoted_margin - baseline_margin, where margin = revenue - units * product.unit_cost. trade_spend       :
    planned_trade_spend allocated to the category by its share of the promo''s scope rows (realized actuals
    are not modelled — see summary). roi               = incremental_margin / NULLIF(trade_spend, 0).
    cannibalization   : shortfall below baseline on SUBSTITUTE SKUs (same category, NOT on this promo)
    in the promo''s stores during the window. forward_buy       : shortfall below baseline on the PROMOTED
    SKUs in the N fiscal weeks after the promo (pantry loading); N = forward_buy_weeks (default 2, see
    params CTE; keep in sync with seeds.yaml post_promo.forward_buy_weeks). net_incremental_margin = incremental_margin
    - cannibalization_margin - forward_buy_margin.'
