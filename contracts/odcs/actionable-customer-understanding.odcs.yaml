    description: Evaluation date of this membership snapshot (the temporal key; append-only, never version-closed).
  - name: membership_status
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Membership state at as_of. Allowed values: realized, existing, exited. Standard segment-membership
      lifecycle semantics: realized = newly qualified this evaluation, existing = still qualifies, exited
      = no longer qualifies. v1 is current-state append-only: the generator emits mostly `existing` plus
      a deterministic ~5% `exited` slice (so the exclusion path is exercised on seed data); `realized`
      is RESERVED for a future entered/exited delta feed.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: realized, existing, exited.'
  - name: membership_score
