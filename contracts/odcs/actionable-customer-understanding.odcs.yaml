    physicalType: STRING
    required: true
    description: Durable customer business key (pseudonymous; not raw PII). Joins customer.profile / gold_customer_behavioral_attributes
      and is the single stable activation/join key.
  - name: audience_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable key of the segment DEFINITION this membership is for. FK to marketing.audience.audience_id
      (the shared conformed definition, ADR 0022).
  - name: as_of_date
    logicalType: date
    physicalType: DATE
