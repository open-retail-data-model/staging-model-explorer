- name: gold_customer_behavioral_attributes
  physicalName: actionable_customer_understanding.gold_customer_behavioral_attributes
  physicalType: view
  description: The wide, agent-discoverable customer TRAIT surface for behavioral segmentation (the "parent
    model" a warehouse-native / composable CDP activation platform reads to compose custom audiences).
    ONE CURRENT ROW PER CUSTOMER, keyed on the durable `profile_id` — a single stable join key so a downstream
    activation platform (and reverse-ETL CDC) diffs on one column, never a multi-column predicate.
  tags:
  - gold
  authoritativeDefinitions:
  - url: outcome-packages/actionable-customer-understanding/README.md
    type: businessDefinition
  - url: outcome-packages/actionable-customer-understanding/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: profile_id
    logicalType: string
    physicalType: STRING
    description: Durable, pseudonymous customer business key (not raw PII) — the single stable activation/join
      key.
  - name: recency_periods
    logicalType: integer
    physicalType: INT
    description: Fiscal periods since the customer last purchased.
  - name: frequency
    logicalType: integer
    physicalType: BIGINT
    description: Distinct purchase occasions (orders) observed.
  - name: frequency_per_period
    logicalType: number
    physicalType: DOUBLE
    description: Orders per fiscal period of tenure (purchase cadence).
  - name: total_units
    logicalType: integer
    physicalType: BIGINT
    description: Total units purchased.
  - name: total_spend
    logicalType: number
    physicalType: DECIMAL(18, 2)
    description: Total net spend.
  - name: last_order_date
    logicalType: date
    physicalType: DATE
    description: Date of the customer's most recent order.
  - name: tenure_periods
    logicalType: integer
    physicalType: INT
    description: Fiscal periods from first to latest observed order.
  - name: avg_cadence_periods
    logicalType: number
    physicalType: DOUBLE
    description: 'The customer''s average purchase cadence: fiscal periods of tenure per order (tenure
      / frequency). Drives the lifecycle_stage derivation.'
  - name: distinct_categories
    logicalType: integer
    physicalType: BIGINT
    description: Count of distinct product categories purchased (breadth of category affinity).
  - name: distinct_brands
    logicalType: integer
    physicalType: BIGINT
    description: Count of distinct brands purchased.
  - name: top_category
    logicalType: string
    physicalType: STRING
    description: The category the customer spends the most net revenue in (dominant category affinity).
  - name: top_brand
    logicalType: string
    physicalType: STRING
    description: The brand the customer spends the most net revenue in.
  - name: promo_purchase_share_ratio
    logicalType: number
    physicalType: DECIMAL(6, 4)
    description: Share of net spend on discounted lines (net < gross) — promo responsiveness, 0..1.
  - name: lifecycle_stage
    logicalType: string
    physicalType: STRING
    description: 'Behaviorally-derived relationship stage: new / active / lapsing / churned (from recency
      vs the customer''s own cadence).'
  - name: r_score
    logicalType: integer
    physicalType: INT
    description: Recency score 1-5 (from gold_customer_ltv; surfaced as a trait, not recomputed).
  - name: f_score
    logicalType: integer
    physicalType: INT
    description: Frequency score 1-5 (from gold_customer_ltv).
  - name: m_score
    logicalType: integer
    physicalType: INT
    description: Monetary score 1-5 (from gold_customer_ltv).
  - name: rfm_score
    logicalType: integer
    physicalType: INT
    description: Combined RFM cell 111..555 (from gold_customer_ltv).
  - name: value_tier
    logicalType: string
    physicalType: STRING
    description: Value tier PLATINUM/GOLD/SILVER/BRONZE (from gold_customer_ltv).
  - name: historical_clv
    logicalType: number
    physicalType: DECIMAL(18, 2)
    description: Realized lifetime gross margin (from gold_customer_ltv).
  - name: predicted_clv
    logicalType: number
    physicalType: DOUBLE
    description: Heuristic forward CLV estimate (from gold_customer_ltv).
  - name: churn_risk_proxy
    logicalType: boolean
    physicalType: BOOLEAN
    description: Heuristic churn-risk flag (from gold_customer_ltv).
  - name: opt_in_status
    logicalType: string
    physicalType: STRING
    description: Marketing consent as a DISCOVERABLE ATTRIBUTE (opted_in / opted_out / unknown). NOT the
      legal source of truth (that is canonical-core consent) and never the activation gate — the net gate
      is applied only in UCV gold_activatable_audience_current.
  - name: interaction_count
    logicalType: integer
    physicalType: BIGINT
    description: 'Clickstream (ADR 0029), LIFETIME grain (unbounded — NOT the RFM observation window):
      count of ENGAGEMENT touches for this profile (stitched touches only), excluding session bookkeeping
      verbs (session_start/session_end/app_open). NULL for a purchaser with no stitched touches.'
  - name: session_count
    logicalType: integer
    physicalType: BIGINT
    description: 'Clickstream, LIFETIME grain (unbounded): distinct sessions (session_id) the profile
      interacted in.'
  - name: last_interaction_date
    logicalType: date
    physicalType: DATE
    description: 'Clickstream (lifetime scan): most recent touch date (engagement recency).'
  - name: avg_digital_dwell_seconds
    logicalType: number
    physicalType: DOUBLE
    description: 'Clickstream, LIFETIME grain (unbounded): mean page-dwell seconds over DIGITAL engagement
      touches (web/mobile_app) only. Restricted to one modality because touchpoint.dwell_seconds is cross-modal
      (page dwell vs call duration vs visit length are not comparable).'
  - name: digital_interaction_share
    logicalType: number
    physicalType: DOUBLE
    description: 'Clickstream channel mix, LIFETIME grain (unbounded — NOT the RFM window; a stale customer''s
      mix reads like an active one): share of touches on web / mobile_app (0..1). NOTE: the three interaction_share
      columns are NON-EXHAUSTIVE named shares (direct_mail and other are not bucketed), so they do not
      sum to 1 — do not treat them as a partition. A touch with a NULL channel_code counts toward the
      denominator but no named share (harmless on shipped data — the generator always populates channel_code).'
  - name: in_store_interaction_share
    logicalType: number
    physicalType: DOUBLE
    description: 'Clickstream channel mix, LIFETIME grain (unbounded): share of touches in store / kiosk
      (0..1).'
  - name: call_center_interaction_share
    logicalType: number
    physicalType: DOUBLE
    description: 'Clickstream channel mix, LIFETIME grain (unbounded): share of touches via call center
      (0..1).'
  - name: has_search_intent_flag
    logicalType: integer
    physicalType: INT
    description: 'Clickstream intent, LIFETIME grain: 1 if the profile had any search touch (ever), else
      0.'
  - name: has_cart_activity_flag
    logicalType: integer
    physicalType: INT
    description: 'Clickstream intent, LIFETIME grain: 1 if the profile had any add_to_cart touch (ever),
      else 0.'
  - name: cart_without_checkout_flag
    logicalType: boolean
    physicalType: BOOLEAN
    description: 'Clickstream, LIFETIME grain: TRUE if the profile ever added to cart but NEVER reached
      checkout_start across ALL touches. NOTE: checkout_start is reaching checkout, NOT a completed purchase
      (touchpoint carries no order-completion signal), and this is lifetime not per-cart/session — a habitual
      buyer who abandoned one old cart still reads FALSE once they checked out. A per-cart/session rate
      keyed on cart_id/session_id is a follow-on.'
  - name: account_id
    logicalType: string
    physicalType: STRING
    description: 'B2B: durable account key this customer is the PRIMARY CONTACT for. NULL for B2C and
      for non-primary account members (a full all-contacts roll-up is a follow-up).'
  - name: account_type
    logicalType: string
    physicalType: STRING
    description: B2B account type (NULL for B2C).
  - name: parent_account_id
    logicalType: string
    physicalType: STRING
    description: B2B parent account (account hierarchy), NULL if none.
  - name: computed_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
    description: When this trait row was computed (freshness).
  quality:
  - name: behavioral_attributes_grain_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: One current row per customer (the wide trait surface / parent model).
    query: 'SELECT profile_id

      FROM actionable_customer_understanding.gold_customer_behavioral_attributes

      GROUP BY profile_id

      HAVING COUNT(*) > 1'
  - name: behavioral_attributes_lifecycle_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: behavioral_attributes_lifecycle_domain
    query: 'SELECT * FROM actionable_customer_understanding.gold_customer_behavioral_attributes

      WHERE lifecycle_stage NOT IN (''new'', ''active'', ''lapsing'', ''churned'')'
  - name: behavioral_attributes_opt_in_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: behavioral_attributes_opt_in_domain
    query: 'SELECT * FROM actionable_customer_understanding.gold_customer_behavioral_attributes

      WHERE opt_in_status NOT IN (''opted_in'', ''opted_out'', ''unknown'')'
- name: gold_customer_ltv
  physicalName: actionable_customer_understanding.gold_customer_ltv
  physicalType: view
  description: 'Per-customer lifetime value: historical realized value + a transparent forward estimate,
    plus RFM segmentation and value tiers. Built on the BASE dimensional model (customer_order_line +
    product for margin + the NRF 4-5-4 fiscal calendar) -- NOT on the in-progress C360/CDP semantic layer
    (none exists yet). Keyed on the customer SURROGATE; no raw PII (loyalty/household identifiers or names)
    is exposed -- those stay in the governed dimension.'
  tags:
  - gold
  authoritativeDefinitions:
  - url: outcome-packages/actionable-customer-understanding/README.md
    type: businessDefinition
  - url: outcome-packages/actionable-customer-understanding/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: profile_sk
    logicalType: integer
    physicalType: BIGINT
    description: Customer surrogate key (the governed dimension key).
  - name: profile_id
    logicalType: string
    physicalType: STRING
    description: Durable, pseudonymous customer business key (not raw PII).
  - name: recency_periods
    logicalType: integer
    physicalType: INT
    description: Fiscal periods (NRF 4-5-4) since the customer last purchased.
  - name: frequency
    logicalType: integer
    physicalType: BIGINT
    description: Distinct purchase occasions (orders) in the observation window.
  - name: total_units
    logicalType: integer
    physicalType: BIGINT
    description: Total units purchased.
  - name: total_spend
    logicalType: number
    physicalType: DECIMAL(18, 2)
    description: Total net spend.
  - name: avg_order_value
    logicalType: number
    physicalType: DECIMAL
    description: Average net spend per order (total_spend / frequency).
  - name: historical_clv
    logicalType: number
    physicalType: DECIMAL(18, 2)
    description: Realized gross margin to date; can be negative (a real loss).
  - name: expected_active_periods
    logicalType: integer
    physicalType: INT
    description: 'Survival heuristic: GREATEST(0, LEAST(tenure, 12) - recency) forward periods.'
  - name: predicted_clv
    logicalType: number
    physicalType: DOUBLE
    description: Transparent forward estimate = avg_order_margin x freq_per_period x expected_active_periods;
      clamped >= 0. Heuristic, not an ML model.
  - name: r_score
    logicalType: integer
    physicalType: INT
    description: Recency score 1-5 from stable fixed thresholds (5 = most recent; reproducible across
      refreshes, not a population quintile).
  - name: f_score
    logicalType: integer
    physicalType: INT
    description: Frequency score 1-5 from stable fixed thresholds (5 = most frequent).
  - name: m_score
    logicalType: integer
    physicalType: INT
    description: Monetary score 1-5 from stable fixed thresholds (5 = highest spend).
  - name: rfm_score
    logicalType: integer
    physicalType: INT
    description: Combined RFM cell = 100*R + 10*F + M (111..555).
  - name: value_tier
    logicalType: string
    physicalType: STRING
    description: historical_clv tier from stable fixed thresholds (PLATINUM >=2500 / GOLD >=1000 / SILVER
      >=250 / BRONZE else); reproducible across refreshes, not an NTILE quartile.
  - name: churn_risk_proxy
    logicalType: boolean
    physicalType: BOOLEAN
    description: 'Heuristic flag: recency exceeds 2x the typical purchase cadence (tenure / frequency).'
  quality:
  - name: ltv_grain_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: One row per customer, keyed on the DURABLE profile_id (never the version-specific profile_sk).
      A re-versioned customer must not fragment into multiple rows — the SCD2 fragmentation guard (standard
      §A.16). Dormant-green under single-version synthetic data; fires once profile carries history.
    query: 'SELECT profile_id

      FROM actionable_customer_understanding.gold_customer_ltv

      GROUP BY profile_id

      HAVING COUNT(*) > 1'
  - name: ltv_rfm_components_range
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: ltv_rfm_components_range
    query: 'SELECT * FROM actionable_customer_understanding.gold_customer_ltv

      WHERE r_score NOT BETWEEN 1 AND 5 OR f_score NOT BETWEEN 1 AND 5 OR m_score NOT BETWEEN 1 AND 5'
  - name: ltv_value_tier_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: ltv_value_tier_domain
    query: 'SELECT * FROM actionable_customer_understanding.gold_customer_ltv

      WHERE value_tier NOT IN (''PLATINUM'', ''GOLD'', ''SILVER'', ''BRONZE'')'
  - name: ltv_predicted_clv_nonnegative
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: ltv_predicted_clv_nonnegative
    query: 'SELECT * FROM actionable_customer_understanding.gold_customer_ltv

      WHERE predicted_clv < 0'
  - name: ltv_customer_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: ltv_customer_fk_orphan
    query: 'SELECT g.* FROM actionable_customer_understanding.gold_customer_ltv g

      LEFT JOIN customer.profile p ON g.profile_sk = p.profile_sk

      WHERE p.profile_sk IS NULL'
  - name: ltv_rowcount
    type: sql
    dimension: accuracy
    severity: info
    description: ltv_rowcount
    query: SELECT COUNT(*) AS ltv_rows FROM actionable_customer_understanding.gold_customer_ltv
  - name: ltv_value_tier_spread
    type: sql
    dimension: accuracy
    severity: info
    description: 'Reported only: distinct value tiers present (4 = full spread).'
    query: SELECT COUNT(DISTINCT value_tier) AS distinct_tiers FROM actionable_customer_understanding.gold_customer_ltv
  - name: ltv_predicted_clv_null_rate
    type: sql
    dimension: accuracy
    severity: info
    description: ltv_predicted_clv_null_rate
    query: 'SELECT ROUND(AVG(CASE WHEN predicted_clv IS NULL THEN 1.0 ELSE 0.0 END), 4) AS predicted_null_rate

      FROM actionable_customer_understanding.gold_customer_ltv'
