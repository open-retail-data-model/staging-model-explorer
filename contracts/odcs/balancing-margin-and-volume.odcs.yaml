    description: Boolean indicating if a new promotion started exactly on this date.
  - name: days_into_promo
    description: The number of days elapsed since the current promotion started.
  - name: days_to_promo_end
    description: The number of days remaining until the current promotion expires.
  - name: is_promo_last_day
    description: Boolean indicating if this is the final day of the promotion.
  - name: days_post_promo_end
    description: The number of days elapsed since the last promotion ended.
  - name: is_post_promo_decay_window
    description: Boolean indicating if the product is in the immediate post-promo "hangover" period.
  - name: promo_frequency_30d
    description: The number of distinct promotional days in the last 30 days.
  - name: days_since_last_promo
    description: The number of days since the product was last on promotion.
  - name: concurrent_promo_count
    description: The number of overlapping promotional mechanics currently active.
  - name: promo_type
    description: Promotion mechanic type (e.g., TPR, DISPLAY).
  - name: funding_type
    description: How the promotion is funded.
  - name: planned_discount_pct
    description: The planned percentage depth of the markdown.
  quality:
  - name: bmv_promotional_features_markdown_depth
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: Markdown depth should theoretically be between 0 and 1 (100% discount). Flag instances
      where items are sold at negative gross revenue (depth > 1) or incorrectly negative discounts.
    query: 'SELECT * FROM balancing_margin_and_volume.gold_promotional_features

      WHERE markdown_depth_pct < 0 OR markdown_depth_pct > 1.0'
