    description: Categorical indicator of competitor price aggression (e.g., 'Severe', 'Moderate', 'Low').
  - name: discount_depth_bucket
    logicalType: string
    physicalType: STRING
    description: Categorical depth of the current markdown (e.g., 'Clearance >50%', 'Shallow <10%').
  - name: demand_bucket_7d
    logicalType: string
    physicalType: STRING
    description: Categorical volume tier based on the last 7 days of sales.
  - name: weeks_of_cover_bucket
    logicalType: string
    physicalType: STRING
    description: Inventory health indicator categorizing stock life (e.g., '<1 Week', 'Overstock').
  - name: article_age_bucket
    logicalType: string
    physicalType: STRING
    description: Lifecycle stage of the product (e.g., 'New Arrival', 'Mature', 'End of Life').
  - name: demand_velocity_bucket
    logicalType: string
    physicalType: STRING
    description: Categorical speed of sales (e.g., 'Fast Mover', 'Slow Mover').
  - name: promo_frequency_bucket
    logicalType: string
    physicalType: STRING
    description: Categorical classification of how often the item is discounted.
  quality:
  - name: bmv_bucket_features_domain_margin
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: Margin health bucket must fall within defined domain limits
    query: 'SELECT * FROM balancing_margin_and_volume.gold_bucket_features

      WHERE margin_health_bucket NOT IN (''High'', ''Healthy'', ''Low'', ''Bleeding'')'
  - name: bmv_bucket_features_domain_discount
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: Discount depth bucket must fall within defined domain limits
    query: 'SELECT * FROM balancing_margin_and_volume.gold_bucket_features

      WHERE discount_depth_bucket NOT IN (''Clearance >50%'', ''Deep 20-50%'', ''Shallow <20%'', ''No
      Discount'')'
- name: gold_competitor_analysis
  physicalName: balancing_margin_and_volume.gold_competitor_analysis
  physicalType: view
  description: Competitor price alignment and tracking.
  tags:
  - gold
  authoritativeDefinitions:
  - url: outcome-packages/balancing-margin-and-volume/README.md
    type: businessDefinition
  - url: outcome-packages/balancing-margin-and-volume/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: product_sk
    logicalType: integer
    physicalType: BIGINT
    description: Surrogate key for the product.
  - name: store_sk
    logicalType: integer
    physicalType: BIGINT
    description: Surrogate key for the store.
  - name: product_id
    logicalType: string
    physicalType: STRING
  - name: store_id
    logicalType: string
    physicalType: STRING
  - name: date_key
    logicalType: date
    physicalType: DATE
  - name: competitor_sk
    logicalType: integer
    physicalType: BIGINT
  - name: competitor_id
    logicalType: string
    physicalType: STRING
  - name: units_sold
    logicalType: number
    physicalType: DECIMAL(12, 3)
  - name: effective_price_lc
    logicalType: number
    physicalType: DECIMAL(18, 2)
  - name: competitor_regular_price_lc
    logicalType: number
    physicalType: DECIMAL(18, 2)
    description: The tracked shelf price of the matched competitor.
  - name: is_comp_on_promo
    logicalType: boolean
    physicalType: BOOLEAN
  - name: price_gap_lc
    logicalType: number
    physicalType: DECIMAL(18, 2)
    description: 'The absolute difference: effective_price_lc - competitor_regular_price_lc.'
  - name: is_comp_price_below_own
    logicalType: boolean
    physicalType: BOOLEAN
    description: True if the competitor is pricing lower than our effective price.
  - name: price_index_vs_comp
    logicalType: number
    physicalType: DECIMAL(8, 4)
    description: (effective_price_lc / competitor_regular_price_lc) * 100.
  - name: price_gap_trend_flag
    logicalType: string
    physicalType: STRING
  - name: is_kvi
    logicalType: boolean
    physicalType: BOOLEAN
  - name: kvi_own_revenue_lc
    logicalType: number
    physicalType: DECIMAL(18, 2)
  - name: kvi_comp_revenue_lc
    logicalType: number
    physicalType: DECIMAL(18, 2)
  - name: competitor_assortment_overlap_pct
    logicalType: number
    physicalType: DECIMAL(8, 4)
  quality:
  - name: bmv_competitor_analysis_undercut_rate
    type: sql
    dimension: accuracy
    severity: info
    description: Measures the percentage of instances where competitors beat our price
    query: 'SELECT ROUND(AVG(CASE WHEN is_comp_price_below_own = TRUE THEN 1.0 ELSE 0.0 END), 4) AS competitor_undercut_rate

      FROM balancing_margin_and_volume.gold_competitor_analysis'
